name: Cashier value tickets
on:
  pull_request:
    branches: [main]
    paths:
      - src/pages/CashierTradePage.tsx
      - supabase/migrations/**
      - scripts/ci/test-cashier-value-tickets.py
      - tests/fixtures/cashier-value-tickets/**
      - .github/workflows/cashier-value-tickets.yml
permissions:
  contents: read
concurrency:
  group: cashier-value-tickets-${{ github.ref }}
  cancel-in-progress: true
jobs:
  value-tickets:
    name: Value tickets redeem exactly once at an equal entry value
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Qualify native value-ticket transactions
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/ci/test-cashier-value-tickets.py
