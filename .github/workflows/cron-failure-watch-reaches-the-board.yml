name: Cron failure watch reaches the board

# fn_ca_cron_failure_watch (migration 20261007215818). Runs
# scripts/ci/test-cron-failure-watch-reaches-the-board.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-10-07 (md5 equal to the live function) must miss an hourly job
# that failed 23 of 24 runs, and the migration must raise exactly the failing
# jobs, keep the ledger-refusal block, read cron.job_run_details once, and
# reproduce production's derived postimage md5. Kept in its own file so the
# change does not edit ci.yml. No timer (CLAUDE.md 10.85): pull_request only,
# scoped to the paths it proves. ci.yml has no push trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261007215818_a_failing_hourly_cron_reaches_the_board.sql
      - scripts/ci/fixtures/cron-failure-watch/**
      - scripts/ci/test-cron-failure-watch-reaches-the-board.py
      - .github/workflows/cron-failure-watch-reaches-the-board.yml

permissions:
  contents: read

concurrency:
  group: cron-failure-watch-reaches-the-board-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cron-failure-watch-reaches-the-board:
    name: A failing hourly cron reaches the board
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: A failing hourly cron reaches the board
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-cron-failure-watch-reaches-the-board.py
