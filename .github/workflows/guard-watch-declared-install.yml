name: Guard watch reads a declared install

# fn_ca_guard_defs_watch() (migration 20261015181950). Runs
# scripts/ci/test-guard-watch-declared-install.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-10-15 (pg_get_functiondef md5 equal to the live function) must
# raise a notice for an install a migration declared on its @live-proof line,
# and the migration must raise only undeclared redefinitions (a preimage
# mention declares nothing), move a declared baseline naming its migration,
# keep grants, declare its own redefinition, and reproduce production's derived
# postimage md5. No timer (CLAUDE.md 10.85): pull_request only, scoped to the
# paths it proves. ci.yml has no push trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015181950_a_declared_guard_install_is_not_a_review_notice.sql
      - supabase/migrations/20260910143032_a_declared_guard_change_is_recorded_not_raised.sql
      - scripts/ci/fixtures/guard-watch-declared-install/**
      - scripts/ci/test-guard-watch-declared-install.py
      - .github/workflows/guard-watch-declared-install.yml

permissions:
  contents: read

concurrency:
  group: guard-watch-declared-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard-watch-declared-install:
    name: Guard watch raises only undeclared redefinitions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Guard watch raises only undeclared redefinitions
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-guard-watch-declared-install.py --output artifacts/guard-watch-declared-install
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guard-watch-declared-install-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/guard-watch-declared-install/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
