# ─────────────────────────────────────────────────────────────────────────────
# AN ORDINARY MIGRATION MERGES ONLY IN ITS INSTALL WINDOW (2026-11-26)
#
# The merge dispatcher installs an ordinary migration only in
# [cycle start + 10 min, cycle start + 30 min) of a three-hourly cutover
# (04:15-04:30 for the 04:00 anchor). Merged at any other minute it sits
# uninstalled on main for up to 150 minutes, and the Backup refuses to certify
# any commit carrying it (backup-engine.yml O7), so every engine commit merged
# after it waits for the next window (2026-11-25: 1 PM to 10 PM Chicago).
#
# A RELEASE-CONTROL CHANGE (a non-test CONTROL_INPUTS path of
# scripts/ci/read-engine-prequalification.py) takes the same window: merged
# later it makes every certified candidate unselectable with no time left for
# a new certificate (2026-11-26 01:00 Chicago: #12038 after c951436a6ead).
#
# This check is red outside the window, with the next window named in Chicago
# time, and green inside it (a five-minute margin so a merge made right after a
# green answer still installs at once). A pull request with no ordinary
# migration is always green. It runs the DEFAULT BRANCH's script; the pull
# request's migration files are read as data only. No secret, no environment,
# read-only token.
#
# WALL TIME AND REQUIRED CHECKS. GitHub evaluates a check when its event fires
# (push, re-run, label), not at the moment of merge, and main has no merge
# queue. So a green answer is true for the minutes it names; whoever merges
# re-runs this check inside the window and merges at once. On a merge_group
# event (when a merge queue is enabled on main) it is evaluated at merge time
# and is exact. NOT A SCHEDULE, NOT A WATCHER: one answer per event.
# ─────────────────────────────────────────────────────────────────────────────
name: An Ordinary Migration Merges Only In Its Install Window

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  merge_group:

permissions:
  contents: read

concurrency:
  group: migration-merge-window-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  window:
    name: An ordinary migration merges only in its install window
    if: ${{ !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the default branch's script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          sparse-checkout: |
            scripts/ci/migration-merge-window.mjs
            scripts/ci/merged-migration-dispatch.mjs
            scripts/ci/maintenance-window-migrations.mjs
            scripts/ci/migration-concurrent-preamble.mjs
            scripts/ci/owner-window-migration.mjs
            scripts/ci/read-engine-prequalification.py
            server/src/maintenance/maintenanceSchedulePolicy.json
          sparse-checkout-cone-mode: false
      - name: Check out the proposed migration files (data only)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          path: proposed
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: supabase/migrations
      - name: Decide whether a merge now installs at once
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          # The pull request that introduces this check runs before the default
          # branch has its script: nothing to judge yet, so it passes and says so.
          if [ ! -f scripts/ci/migration-merge-window.mjs ]; then
            echo "The merge-window guard is not on the default branch yet; nothing to check."
            exit 0
          fi
          # The files the change adds or modifies under supabase/migrations,
          # against the merge base (the dispatcher's own list format).
          base=$(git -C proposed merge-base "$BASE" "$HEAD")
          git -C proposed diff --name-status --no-renames "$base" "$HEAD" -- supabase/migrations \
            | awk -F'\t' '$1 == "A" {print "added\t" $2} $1 == "M" {print "modified\t" $2}' > files.txt
          # Release-control paths the change touches: the non-test CONTROL_INPUTS
          # of the default branch's prequalification reader. A change there
          # makes every older certified candidate unselectable, so it takes the
          # same window. Unreadable is not "none": the check fails.
          git -C proposed diff --name-only "$base" "$HEAD" > changed.txt
          python3 -B - changed.txt > control.txt <<'PY'
          import runpy, sys
          m = runpy.run_path('scripts/ci/read-engine-prequalification.py')
          inputs = m['CONTROL_INPUTS']
          for path in open(sys.argv[1]).read().split():
              hit = any(path == e or path.startswith(e.rstrip('/') + '/') for e in inputs)
              if hit and not m['_is_pure_test_control_path'](path) and not m['_is_non_release_server_script_path'](path):
                  print(path)
          PY
          # The serving engine's live schedule (as the dispatcher reads it),
          # else the repository policy; unreadable is three-hourly, the
          # stricter rule.
          freq=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' https://engine.smarter.poker/health \
            | jq -r '.maintenance.schedule.frequency // empty' 2>/dev/null) || freq=''
          [ -n "$freq" ] || freq=$(jq -r '.frequency // empty' server/src/maintenance/maintenanceSchedulePolicy.json 2>/dev/null) || freq=''
          [ -n "$freq" ] || freq=three-hourly
          echo "schedule: $freq"
          set +e
          node scripts/ci/migration-merge-window.mjs check files.txt proposed/supabase/migrations --schedule "$freq" --control control.txt > verdict.txt
          rc=$?
          set -e
          cat verdict.txt
          { echo "### Migration Merge Window"; echo ""; sed 's/^/- /' verdict.txt; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          if [ "$rc" -ne 0 ]; then
            echo "::error title=Outside the migration install window::$(head -1 verdict.txt)"
          fi
          exit "$rc"
