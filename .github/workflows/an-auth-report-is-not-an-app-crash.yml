name: An auth report is not an app crash

# fn_sp_daily_metrics_compute 'crashes' (migration 20261016104606). Runs
# scripts/ci/test-an-auth-report-is-not-an-app-crash.py against a throwaway
# PostgreSQL 17 cluster, never production: the function's exact production
# text with 20261016103449 applied counts the auth flow's own failure reports
# as app crashes, and the migration must count only real crashes, leave the
# deploys read untouched and reproduce the derived postimage md5. No timer
# (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261016104606_an_auth_report_is_not_an_app_crash.sql
      - supabase/migrations/20261016100458_sp_daily_digest_standalone_rake_and_club_ranking.sql
      - supabase/migrations/20261016103449_sp_daily_digest_counts_superseded_deploys_and_house_diamond_.sql
      - scripts/ci/test-an-auth-report-is-not-an-app-crash.py
      - .github/workflows/an-auth-report-is-not-an-app-crash.yml

permissions:
  contents: read

concurrency:
  group: an-auth-report-is-not-an-app-crash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  an-auth-report-is-not-an-app-crash:
    name: The digest counts real app crashes, not auth flow reports
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: The digest counts real app crashes, not auth flow reports
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-an-auth-report-is-not-an-app-crash.py --output artifacts/an-auth-report-is-not-an-app-crash
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: an-auth-report-is-not-an-app-crash-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/an-auth-report-is-not-an-app-crash/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
