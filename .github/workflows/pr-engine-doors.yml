# ─────────────────────────────────────────────────────────────────────────────
# A PULL REQUEST CANNOT MAKE MAIN UNSHIPPABLE
#
# The release gate (auto-deploy-hetzner.yml, job `engine-doors`) asks
# production's pg_proc whether every database function the engine calls exists.
# It is the last word and nothing here weakens it. But it only runs at RELEASE
# time, about eight minutes before the 04:00 America/Chicago break, so a pull
# request can merge, main can become un-releasable, and nobody finds out until
# the next release is refused.
#
# 2026-11-07 is the worked example. Engine Release run 42360536751 refused the
# certified e6e26ab8 at 09:52Z: fn_cash_session_set_blind_off() and
# fn_lightning_blind_off_players() did not exist in production. Both are created
# by 20261106203853_hit_and_run_ten_hands_in_profit.sql, which declares
# "-- @install-window: daily-maintenance" and therefore installs only inside the
# freeze; that window run was refused with a 55P03 lock timeout, so the file
# stayed queued and main stayed un-releasable.
#
# This job asks the same question on the PR side and splits the answer three
# ways, because the three cases need three different human responses:
#
#   REFUSED (fails the PR)  No migration in the merge result creates the
#                           function. The PR forgot its database half.
#   ALLOWED (passes)        A migration THIS PR ADDS creates it. A window file
#                           installs in the next break, an ordinary file on
#                           merge. Refusing this is the very deadlock above.
#   WARNED  (passes, loud)  A migration already on main creates it and is not
#                           yet applied. Merging keeps main unshippable, but the
#                           PR did not cause it, and this repository has already
#                           ruled that failing every PR for another branch's
#                           unapplied migration "would be an outage of its own"
#                           (applied-migrations-recorded.yml).
#
# CREDENTIAL: secrets.DATABASE_URL, which this repository already holds and 23
# workflows already use. No new secret. The job is read-only: it SELECTs from
# pg_catalog.pg_proc and supabase_migrations.schema_migrations and writes
# nothing. A pull request from a fork gets no secrets, so the script reports
# verdict=unchecked and passes rather than pretending to have proof.
# ─────────────────────────────────────────────────────────────────────────────
name: PR Engine Doors

on:
  # pull_request_target runs MAIN's workflow and MAIN's script with the
  # credential. The pull request's files are fetched and extracted as data
  # (symlinks removed) and never executed, so no pull-request code runs beside
  # DATABASE_URL (2026-11-11, merge-queue secrets boundary).
  pull_request_target:
    branches: [main]
    paths:
      - 'server/**'
      - 'supabase/migrations/**'
      - 'scripts/ci/check-pr-engine-doors.mjs'
      - 'scripts/ci/check-engine-doors-exist.mjs'
      - 'scripts/ci/window-migration-doors.mjs'
      - 'scripts/ci/engine-doors.allowlist.json'
      - '.github/workflows/pr-engine-doors.yml'

permissions: {}

concurrency:
  group: pr-engine-doors-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  doors:
    name: Every Door This PR Calls Has A Migration
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.doors.outputs.verdict || '' }}
      refused: ${{ steps.doors.outputs.refused || '' }}
      allowed: ${{ steps.doors.outputs.allowed || '' }}
      warned: ${{ steps.doors.outputs.warned || '' }}
    steps:
      # MAIN's code only. The merge result is read below as files, not run.
      - name: Checkout the default branch (trusted code)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false

      - name: Use the production Node major
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # The MERGE RESULT, not the head commit: what merges is what has to be
      # releasable. It is fetched as data and extracted without symlinks; no
      # file from it is executed, sourced or installed.
      - name: Read the merge result this pull request would produce, as data
        id: pr
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          mkdir -p pr
          if git -C trusted fetch --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pr/merge"; then
            git -C trusted archive refs/remotes/pr/merge -- server/src supabase/migrations scripts/ci/engine-doors.allowlist.json \
              | tar -x -C pr
            find pr -type l -delete
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo '::warning title=PR DOORS UNCHECKED::the merge result could not be fetched (merge conflict or not yet computed); nothing was checked'
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Every database function this pull request calls has a migration
        id: doors
        if: steps.pr.outputs.ready == 'true'
        working-directory: pr
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PR_DOORS_ROOT: ${{ github.workspace }}/pr
          PR_DOORS_BASE_ROOT: ${{ github.workspace }}/trusted
          PR_DOORS_BASE_REF: HEAD
        run: |
          set -euo pipefail
          ( cd ../trusted && { npm ls pg >/dev/null 2>&1 || npm i pg@8 --no-save --no-audit --no-fund --ignore-scripts >/dev/null 2>&1 || true; } )
          node ../trusted/scripts/ci/check-pr-engine-doors.mjs | tee /tmp/prdoors.log

      - name: Name the verdict in the summary
        if: always()
        # The verdict reaches the shell as data, never as script text, and only
        # one of the fixed words is printed.
        env:
          DOORS_VERDICT: ${{ steps.doors.outputs.verdict || 'unchecked' }}
        run: |
          set -uo pipefail
          case "$DOORS_VERDICT" in proved|allowed|warned|refused|unchecked) ;; *) DOORS_VERDICT=unchecked ;; esac
          {
            echo "## PR Engine Doors"
            echo ""
            echo "Verdict: \`$DOORS_VERDICT\`"
            echo ""
            if [ -s /tmp/prdoors.log ]; then
              echo '```'
              grep -E '^(OK|ALLOWED|WARNED|REFUSED|UNCHECKED) ' /tmp/prdoors.log || tail -5 /tmp/prdoors.log
              echo '```'
            fi
            case "$DOORS_VERDICT" in
              refused)
                echo "A database function this build calls exists nowhere: not in production, and in no"
                echo "migration in this merge result. Add the migration that creates it. A file marked"
                echo "SUPERSEDED does not count - it never installs."
                ;;
              warned)
                echo "Nothing here is wrong with this pull request. A migration already on main creates a"
                echo "function production does not have yet and has not been applied, so the engine release"
                echo "will keep refusing main until it installs. Merging is allowed; shipping waits on that"
                echo "migration."
                ;;
              allowed)
                echo "This pull request carries its own database half. The functions named above arrive"
                echo "with its migrations - a window-gated file installs inside the next 04:00"
                echo "America/Chicago break, an ordinary file applies on merge."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
