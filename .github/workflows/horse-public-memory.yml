name: Horse public memory
on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/horse-public-memory.yml
      - scripts/ci/test-horse-exact-public-memory.py
      - supabase/migrations/20260906113554_the_atomic_hand_insert_lets_the_defaults_apply_and_proves_it.sql
      - supabase/migrations/20260908042100_an_accepted_hand_is_one_commit_and_stats_leave_the_hot_path.sql
      - supabase/migrations/20261023183513_durable_variant_scoped_horse_opponent_memory.sql
      - supabase/migrations/20261024023547_horse_opponent_bounded_original_request_reads.sql
      - supabase/migrations/20261106091733_horse_public_memory_exact_rule_domains.sql
      - supabase/migrations/20261107160549_horse_memory_excludes_forced_folds.sql
      - supabase/migrations/20261115010037_bind_horse_exact_profiles_to_their_accepted_hand.sql
      - supabase/migrations/20261115011318_horse_saved_profile_presence_at_original_deal.sql
      - scripts/ci/fixtures/horse-saved-profile-presence.sql
      - supabase/migrations/20261115015341_the_exact_opponent_profile_keeps_a_long_participation_window.sql
      - supabase/migrations/20261115144258_the_exact_opponent_profile_remembers_shown_river_strength.sql
      - scripts/ci/fixtures/horse-shown-river-vectors.json
      - supabase/migrations/20261117175407_the_exact_opponent_profile_keeps_a_postflop_read_by_street_a.sql
      - scripts/ci/fixtures/horse-street-read-vectors.json
      - supabase/migrations/20261118023000_exact_profile_keeps_reraiser_answers.sql
      - scripts/ci/fixtures/horse-reraise-response-vectors.json
      - supabase/migrations/20261119192551_the_exact_opponent_profile_keeps_what_a_flop_bet_showed.sql
      - supabase/migrations/20261119213206_the_flop_shown_learner_reads_omaha_only_shown_only_when_unmu.sql
      - scripts/ci/fixtures/horse-flop-shown-vectors.json
concurrency:
  group: horse-public-memory-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install PostgreSQL 17 on the disposable runner
        run: |
          set -euo pipefail
          if [[ -x /usr/lib/postgresql/17/bin/initdb ]]; then exit 0; fi
          # The one shared install (signed sources, checkout key, bounded retries).
          bash .github/actions/install-postgres-17/install.sh
      - name: Verify accepted public actions and cold profile reads
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-horse-exact-public-memory.py --scratch "$RUNNER_TEMP" --output "$RUNNER_TEMP/horse-exact-memory-evidence"
