name: Auto-Deploy Hetzner Engine (on server/ changes)
run-name: ${{ github.event.action == 'observe-club-arena-horse-fleet' && format('Private Horse Fleet Observation {0}', github.event.client_payload.source_sha) || github.event.action == 'withdraw-club-arena-engine' && format('Engine Withdrawal {0}', github.event.client_payload.withdrawal.runKey) || format('Engine Release {0}', github.event.client_payload.ref_sha) }}

# Club Arena owns this release lane. World Hub, database jobs, timers, and
# operator laptops cannot publish or restart the game engine. Protected main
# emits one immutable component SHA; this workflow proves and stages it, while
# one root-owned Hetzner systemd transaction waits for the announced table
# break, cuts over, proves local/public/database identity, and seals or recovers.
on:
  repository_dispatch:
    types: [deploy-club-arena-engine, withdraw-club-arena-engine, observe-club-arena-horse-fleet]

permissions: {}

# Exact redeliveries serialize before checkout/npm work; distinct protected-
# main SHAs still reach the durable Hetzner intake immediately and let host
# locks plus freshness decide which release owns the next certified break.
concurrency:
  group: club-arena-engine-request-${{ github.event.client_payload.ref_sha }}${{ github.event.action == 'observe-club-arena-horse-fleet' && format('-private-observation-{0}', github.run_id) || '' }}
  cancel-in-progress: false

jobs:
  observe-private-horse-fleet:
    name: Observe One Private Natural Horse Cohort
    if: github.event.action == 'observe-club-arena-horse-fleet' && (github.actor != 'github-actions[bot]' && github.triggering_actor != 'github-actions[bot]') && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: ci-main
    # At most sixteen 115-second read-only partitions plus setup and cleanup.
    timeout-minutes: 35
    permissions:
      contents: read
    concurrency:
      group: club-arena-private-horse-fleet-observation
      cancel-in-progress: false
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      SSH_USER: root
      FLEET_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
      FLEET_FROM_UTC: ${{ github.event.client_payload.from_utc }}
      FLEET_TO_UTC: ${{ github.event.client_payload.to_utc }}
      FLEET_TURN_CENSUS_JSON: ${{ toJSON(github.event.client_payload.turn_census) }}
    steps:
      - name: Checkout protected observer control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/horse-fleet-packet.py
            /scripts/ci/horse-turn-census-packet.py
            /scripts/ci/horse-turn-census-proof.mjs
            /server/scripts/phase6d-turn-census.mjs
            /scripts/ci/horse-public-bootstrap-witness.py
            /server/scripts/phase6d-population.mjs
          persist-credentials: false
      - name: Refuse unprotected source and unavailable local clients
        run: |
          set -euo pipefail
          case "$FLEET_TURN_CENSUS_JSON" in
            true|false|null) ;;
            *) echo 'Private census mode must be a JSON boolean or absent'; exit 2 ;;
          esac
          [[ "$FLEET_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$FLEET_SOURCE_SHA" origin/main
          git ls-tree "$FLEET_SOURCE_SHA" -- server/src/services/horseDecisionJournal/fleet.ts \
            | grep -Eq '^100644 blob [0-9a-f]{40}[[:space:]]server/src/services/horseDecisionJournal/fleet\.ts$'
          psql --version >/dev/null
          node --version >/dev/null
          PRIVATE_DIR="$RUNNER_TEMP/horse-fleet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          install -d -m 0700 "$PRIVATE_DIR"
          echo "PRIVATE_DIR=$PRIVATE_DIR" >> "$GITHUB_ENV"
      - name: Read one canonical cohort and original accepted coordinates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          packet_args=("$PRIVATE_DIR/packet.json" "$PRIVATE_DIR/attestation.json")
          if [ "$FLEET_TURN_CENSUS_JSON" = true ]; then packet_args=(--turn-census "${packet_args[@]}"); fi
          timeout --signal=TERM --kill-after=2s 20s python3 -B scripts/ci/horse-fleet-packet.py "${packet_args[@]}"
      - name: Establish existing pinned SSH service identity
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ]
          printf '%s\n' "$SSH_KEY" > "$PRIVATE_DIR/key"
          chmod 0600 "$PRIVATE_DIR/key"
          ssh-keygen -y -f "$PRIVATE_DIR/key" >/dev/null
          printf '%s\n' "$HOST_KEY" > "$PRIVATE_DIR/known_hosts"
          chmod 0600 "$PRIVATE_DIR/known_hosts"
          ssh-keygen -l -f "$PRIVATE_DIR/known_hosts" >/dev/null
          HSSH="$PRIVATE_DIR/hssh"
          printf '#!/usr/bin/env bash\nexec ssh -i %q -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%q -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes %q "$@"\n' \
            "$PRIVATE_DIR/key" "$PRIVATE_DIR/known_hosts" "$SSH_USER@$HETZNER_HOST" > "$HSSH"
          chmod 0700 "$HSSH"
          echo "HSSH=$HSSH" >> "$GITHUB_ENV"
      - name: Read one bounded current-container public bootstrap witness
        if: github.event.client_payload.public_pool_bootstrap == true
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=2s 35s python3 -B scripts/ci/horse-public-bootstrap-witness.py \
            --source-sha "$FLEET_SOURCE_SHA" --ssh-command "$HSSH"
      - name: Observe the installed CLI without release or maintenance actions
        run: |
          set -euo pipefail
          observer_mode=--observe-bounded
          if [ "$FLEET_TURN_CENSUS_JSON" = true ]; then observer_mode=--observe-turn-census; fi
          timeout --signal=TERM --kill-after=5s 1900s python3 -B scripts/ci/horse-fleet-packet.py "$observer_mode" \
            "$PRIVATE_DIR/packet.json" "$PRIVATE_DIR/attestation.json" "$HSSH" "$PRIVATE_DIR/result.json"
      - name: Remove private packet and exact ephemeral transport
        if: always()
        run: |
          set -euo pipefail
          PRIVATE_DIR="$RUNNER_TEMP/horse-fleet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          rm -rf -- "$PRIVATE_DIR"

  withdraw-waiting-release:
    name: Withdraw One Exact Waiting Original Transaction
    if: github.event.action == 'withdraw-club-arena-engine' && (github.actor != 'github-actions[bot]' && github.triggering_actor != 'github-actions[bot]') && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: ci-main
    concurrency:
      group: club-arena-engine-withdrawal-${{ github.event.client_payload.withdrawal.runKey }}
      cancel-in-progress: false
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout the protected receiver control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Qualify exact selection, refusal and terminal signal boundaries
        run: python3 -B tests/operations/waiting-engine-release-withdrawal.test.py
      - name: Withdraw only the waiting transaction through its original wrapper
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HETZNER_HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: python3 -B scripts/ci/withdraw-waiting-engine-release.py
      - name: Retain the exact original receipt or bounded diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-withdrawal-${{ github.run_id }}
          path: |
            artifacts/engine-withdrawal/receipt.json
            artifacts/engine-withdrawal/diagnostic.json
          if-no-files-found: error
          retention-days: 7

  preflight:
    if: github.event.action == 'deploy-club-arena-engine'
    name: Verify the exact prepared engine release request
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # Read-only: the Backup Engine certificate gate reads commit statuses.
      statuses: read
      actions: read
    outputs:
      target_sha: ${{ steps.target.outputs.sha }}
      image_id: ${{ steps.preparation.outputs.image_id }}
      rollback_image_id: ${{ steps.preparation.outputs.rollback_image_id }}
    steps:
      - name: Checkout the requested immutable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.client_payload.ref_sha }}
          fetch-depth: 0
          # Exact historical runtime qualification reads old source blobs too.
          # Keep those immutable inputs present before its bounded native run.

      - name: Prove the request is current protected-main engine code
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.client_payload.ref_sha || '' }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::client_payload.ref_sha must be one full lowercase commit SHA'; exit 1; }
          RESOLVED_SHA="$(git rev-parse --verify 'HEAD^{commit}')"
          [ "$RESOLVED_SHA" = "$REQUESTED_SHA" ] \
            || { echo "::error::checkout resolved $RESOLVED_SHA, not $REQUESTED_SHA"; exit 1; }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          MAIN_SHA="$(git rev-parse --verify 'origin/main^{commit}')"
          git merge-base --is-ancestor "$RESOLVED_SHA" "$MAIN_SHA" \
            || { echo "::error::target is not contained in protected main $MAIN_SHA"; exit 1; }
          LATEST_REQUIRED="$(git log "$MAIN_SHA" -1 --format=%H -- \
            'server/**' ':(exclude)server/**/*.test.ts' ':(exclude)server/sim/**' ':(exclude)server/qualification/**')"
          [[ "$LATEST_REQUIRED" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::latest engine component SHA is unreadable'; exit 1; }
          # Protected-main containment is mandatory. A newer merge alone cannot
          # cancel this exact target; the host enforces sealed high-water ancestry.
          if [ "$RESOLVED_SHA" != "$LATEST_REQUIRED" ]; then
            echo "::notice::Exact target $RESOLVED_SHA is behind protected-main engine $LATEST_REQUIRED; host forward-only admission is still required."
          fi
          echo "sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

      # Owner rule 2026-11-06: the live engine only ever receives a version the
      # Backup Engine certified. stage-engine-release.yml offers only certified
      # commits, but this receiver also accepts deploy-club-arena-engine events
      # sent directly. This gate refuses any request whose exact SHA does not
      # carry backup-engine/certified = success, before tests, database doors,
      # SSH or any Hetzner contact. Every downstream job needs this matrix.
      - name: Require the Backup Engine certificate for this exact SHA
        id: backup_certificate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CERTIFIED_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          [[ "$CERTIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error title=Backup Engine certificate gate::resolved target SHA is not one full lowercase commit SHA'; exit 1; }
          # Statuses are listed newest first; the newest backup-engine/certified
          # status for this exact SHA decides. A read failure refuses too.
          STATE="$(gh api "repos/$REPO/commits/$CERTIFIED_SHA/statuses?per_page=100" \
            --jq '[.[] | select(.context == "backup-engine/certified")][0].state // "missing"')" \
            || { echo "::error title=Backup Engine certificate gate::could not read commit statuses for $CERTIFIED_SHA; refusing to release an uncertified engine"; exit 1; }
          if [ "$STATE" != success ]; then
            echo "::error title=Backup Engine certificate gate::$CERTIFIED_SHA has backup-engine/certified = $STATE, not success. The live engine only receives a version the Backup Engine certified; nothing was released."
            exit 1
          fi
          echo "Backup Engine certified $CERTIFIED_SHA (backup-engine/certified = success)."
          echo "certified=true" >> "$GITHUB_OUTPUT"

      - name: Require daily preparation or the protected November 7 owner window
        id: daily_release
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gate_status=0
          python3 - <<'PYTHON' || gate_status=$?
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import json, os, subprocess
          policy = json.loads(subprocess.check_output(["git", "show", os.environ["TARGET_SHA"] + ":server/src/maintenance/maintenanceSchedulePolicy.json"], text=True))
          if policy.get("phase1Status") not in ("off", "complete"):
              raise SystemExit("Engine replacement refused: the exact certified target must use daily maintenance.")
          now = datetime.now(ZoneInfo("America/Chicago"))
          if not (now.hour == 3 and 30 <= now.minute < 50):
              raise SystemExit(3)
          PYTHON
          case "$gate_status" in
            0) exit 0 ;;
            3) ;;
            *) exit "$gate_status" ;;
          esac
          # The target checkout can predate the protected admission helper.
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$CONTROL_SHA" refs/remotes/origin/main
          owner_dir="$(mktemp -d "$RUNNER_TEMP/owner-control.XXXXXXXX")"
          trap 'rm -rf -- "$owner_dir"' EXIT
          git show "$CONTROL_SHA:server/scripts/engine-release-activation-floor.py" > "$owner_dir/floor.py"
          python3 -B "$owner_dir/floor.py" nov7-owner --repo . --target "$TARGET_SHA" \
            --control "$CONTROL_SHA" --deadline "$(( $(date +%s) + 80 * 60 ))"

      - name: Require previously completed daytime qualification
        id: preparation
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.sha }}
          SELECTED_CONTROL: ${{ github.event.client_payload.control_sha }}
          SELECTION_RUN: ${{ github.event.client_payload.selection_run_id }}
          OWNER_WINDOW_ID: ${{ github.event.client_payload.owner_window_id }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_CONTROL" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          reader="$(mktemp "$RUNNER_TEMP/reader.XXXXXXXX")"
          git show "$GITHUB_SHA:scripts/ci/read-engine-prequalification.py" > "$reader"
          cutoff="$(python3 -c 'from datetime import datetime; from zoneinfo import ZoneInfo; print(int(datetime.now(ZoneInfo("America/Chicago")).replace(hour=3, minute=30, second=0, microsecond=0).timestamp()))')"
          selection_args=(--cutoff "$cutoff")
          if [ -n "$OWNER_WINDOW_ID" ]; then
            selection_args=(--owner-window "$OWNER_WINDOW_ID")
          fi
          receipt="$(python3 -B "$reader" --repo "$GITHUB_REPOSITORY" --target "$TARGET" --control "$SELECTED_CONTROL" --receiver-control "$GITHUB_SHA" --selection-run-id "$SELECTION_RUN" "${selection_args[@]}")"
          echo "image_id=$(jq -er .imageId <<< "$receipt")" >> "$GITHUB_OUTPUT"
          echo "rollback_image_id=$(jq -er .rollbackImageId <<< "$receipt")" >> "$GITHUB_OUTPUT"

  cutover-spectator:
    if: ((github.actor != 'github-actions[bot]' && github.triggering_actor != 'github-actions[bot]') || (github.event_name == 'repository_dispatch' && github.event.action == 'deploy-club-arena-engine')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    name: Observe one authenticated spectator across replacement
    needs: preflight
    continue-on-error: true
    runs-on: ubuntu-24.04
    environment: ci-main
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      witness: ${{ steps.retired.outputs.witness }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install browser dependencies from the primary mirror
        run: |
          sudo python3 scripts/ci/ubuntu-apt-mirror.py
          npx playwright install --with-deps chromium webkit
      - name: Read predecessor before opening a spectator
        run: |
          sha="$(curl -fsS --max-time 10 https://engine.smarter.poker/health | jq -er 'select(.maintenance.active==false) | .releaseSha | select(test("^[a-f0-9]{40}$"))')"
          echo "EXPECTED_ENGINE_SHA=$sha" >> "$GITHUB_ENV"
      - name: Create the reserved spectator
        id: account
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/production-e2e-account.mjs create
      - name: Prepare its ordinary zero-balance membership
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_SPECTATOR_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
        run: node scripts/ci/production-e2e-account.mjs prepare-spectator
      - name: Observe the natural reconnect and committed hand
        id: observe
        env:
          BASE_URL: https://smarter.poker/hub/club-arena/
          ARENA_BASE_URL: https://smarter.poker/hub/club-arena
          E2E_REQUIRE_AUTH: '1'
          LIVE_TABLE_REALTIME_CERTIFICATION: '1'
          ENGINE_HEALTH_URL: https://engine.smarter.poker/health
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          E2E_CLUB_ID: a41434bb-8d0c-400a-8f0d-e8b3d65afed4
          CUTOVER_SPECTATOR_TARGET: ${{ needs.preflight.outputs.target_sha }}
        run: |
          npx playwright test tests/e2e/production-live-table-realtime.spec.ts --grep 'an authenticated spectator spans' --project=webkit-live-table-realtime --workers=1 --retries=0 --reporter=line
      - name: Retire and verify only this fixture
        id: retired
        if: always() && steps.account.outcome != 'skipped'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node scripts/ci/production-e2e-account.mjs cleanup
          if [ -f cutover-spectator.json ]; then echo "witness=$(jq -ce . cutover-spectator.json)" >> "$GITHUB_OUTPUT"; fi

  correlate-cutover-spectator:
    name: Bind spectator evidence to the original sealed release
    needs: [deploy, cutover-spectator]
    continue-on-error: true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - env:
          SEALED_RECEIPT: ${{ needs.deploy.outputs.gameplay_receipt }}
          SPECTATOR: ${{ needs.cutover-spectator.outputs.witness }}
        run: node scripts/ci/correlate-cutover-spectator.mjs > sealed-spectator.json
      - uses: actions/upload-artifact@v4
        with:
          name: sealed-spectator-${{ github.run_id }}-${{ github.run_attempt }}
          path: sealed-spectator.json
          if-no-files-found: error

  engine-doors:
    if: ((github.actor != 'github-actions[bot]' && github.triggering_actor != 'github-actions[bot]') || (github.event_name == 'repository_dispatch' && github.event.action == 'deploy-club-arena-engine')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    name: Prove The Exact Engine Has Every Production Door
    needs: preflight
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 10
    permissions:
      contents: read
    # Phase 6: a refused door names itself in the deploy receipt's reason
    # (e.g. "missing database function fn_x()"), not only in a job log.
    # A door created by a queued daily-maintenance window migration is a third,
    # named outcome (verdict=conditional): it can only install inside the break,
    # so the host transaction re-reads pg_proc for it there before any cutover.
    outputs:
      refusal: ${{ steps.doors.outputs.refusal || '' }}
      verdict: ${{ steps.doors.outputs.verdict || '' }}
      conditional: ${{ steps.doors.outputs.conditional || '' }}
      conditional_migrations: ${{ steps.doors.outputs.conditional_migrations || '' }}
    steps:
      - name: Checkout the requested immutable commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.target_sha }}

      - name: Use the production Node major
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # A schema manifest can describe a function before production actually
      # has it. Ask pg_proc from the exact requested checkout in a credential
      # boundary that owns neither test execution nor root SSH authority.
      - name: Every database function this build calls exists in production
        id: doors
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ROLLBACK_REQUESTED: 'false'
        run: |
          set -euo pipefail
          npm ls pg >/dev/null 2>&1 || npm i pg@8 --no-save --no-audit --no-fund >/dev/null 2>&1 || true
          # Protected main's bytes prove a queued window migration is the merged
          # one. A failed fetch admits nothing conditionally; it never passes.
          git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main' \
            || echo '::warning::protected main could not be fetched; no door can be admitted on a window condition'
          node scripts/ci/check-engine-doors-exist.mjs

  deploy:
    if: ((github.actor != 'github-actions[bot]' && github.triggering_actor != 'github-actions[bot]') || (github.event_name == 'repository_dispatch' && github.event.action == 'deploy-club-arena-engine')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    name: Publish Through Hetzner Club Arena
    needs: [preflight, engine-doors]
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 210
    permissions:
      contents: read
    outputs:
      release_result: ${{ steps.release.outputs.result || 'not completed' }}
      gameplay_receipt: ${{ steps.gameplay_receipt.outputs.receipt }}
      release_failure: ${{ steps.release.outputs.failed_stage || '' }}
      exit_stage: ${{ steps.exit_path.outputs.stage || 'unknown' }}
      exit_outcome: ${{ steps.exit_path.outputs.outcome || 'unknown' }}
      exit_error: ${{ steps.exit_path.outputs.error || '' }}
      superseded_by: ${{ steps.release.outputs.superseded_by || '' }}
      verified: ${{ steps.verify.outputs.verified || 'false' }}
      shipped: ${{ (steps.release.outputs.result == 'sealed' || steps.release.outputs.result == 'already-released') && steps.verify.outputs.verified == 'true' }}
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      SSH_USER: root
      CONTAINER: club-arena-engine
      IMAGE_REPO: club-arena-engine
      REPO_DIR: /opt/club-arena
      ENGINE_URL: https://engine.smarter.poker
      SHA: ${{ needs.preflight.outputs.target_sha }}
      CONTROL_SHA: ${{ github.sha }}
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
      RUN_ACTOR: ${{ github.actor }}

    steps:
      - name: Establish one absolute deploy-job deadline
        id: deadline
        run: |
          set -euo pipefail
          # The Actions job is capped at 210 minutes. Our own clock stops ten
          # minutes earlier so `always()` cleanup still has runner time even
          # when a release consumes every second of its declared budget.
          DEPLOY_JOB_BUDGET_SECONDS=12000
          POST_RELEASE_RESERVE_SECONDS=600
          PROOF_RESERVE_AFTER_SECONDS=330
          RECEIPT_RESERVE_AFTER_SECONDS=120
          LOCAL_CLEANUP_RESERVE_SECONDS=30
          NOW_EPOCH="$(date +%s)"
          RELEASE_JOB_DEADLINE_EPOCH=$((NOW_EPOCH + DEPLOY_JOB_BUDGET_SECONDS))
          RELEASE_DISPATCH_DEADLINE_EPOCH=$((RELEASE_JOB_DEADLINE_EPOCH - POST_RELEASE_RESERVE_SECONDS))
          RELEASE_PROOF_DEADLINE_EPOCH=$((RELEASE_JOB_DEADLINE_EPOCH - PROOF_RESERVE_AFTER_SECONDS))
          RELEASE_RECEIPT_DEADLINE_EPOCH=$((RELEASE_JOB_DEADLINE_EPOCH - RECEIPT_RESERVE_AFTER_SECONDS))
          RELEASE_REMOTE_CLEANUP_DEADLINE_EPOCH=$((RELEASE_JOB_DEADLINE_EPOCH - LOCAL_CLEANUP_RESERVE_SECONDS))
          [ "$POST_RELEASE_RESERVE_SECONDS" -ge 600 ]
          [ "$RELEASE_DISPATCH_DEADLINE_EPOCH" -lt "$RELEASE_PROOF_DEADLINE_EPOCH" ]
          [ "$RELEASE_PROOF_DEADLINE_EPOCH" -lt "$RELEASE_RECEIPT_DEADLINE_EPOCH" ]
          [ "$RELEASE_RECEIPT_DEADLINE_EPOCH" -lt "$RELEASE_REMOTE_CLEANUP_DEADLINE_EPOCH" ]
          {
            echo "RELEASE_JOB_DEADLINE_EPOCH=$RELEASE_JOB_DEADLINE_EPOCH"
            echo "RELEASE_DISPATCH_DEADLINE_EPOCH=$RELEASE_DISPATCH_DEADLINE_EPOCH"
            echo "RELEASE_PROOF_DEADLINE_EPOCH=$RELEASE_PROOF_DEADLINE_EPOCH"
            echo "RELEASE_RECEIPT_DEADLINE_EPOCH=$RELEASE_RECEIPT_DEADLINE_EPOCH"
            echo "RELEASE_REMOTE_CLEANUP_DEADLINE_EPOCH=$RELEASE_REMOTE_CLEANUP_DEADLINE_EPOCH"
            echo "POST_RELEASE_RESERVE_SECONDS=$POST_RELEASE_RESERVE_SECONDS"
          } >> "$GITHUB_ENV"

      - name: Checkout the exact workflow control and authenticated main history
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Recheck freshness after the FIFO wait
        id: freshness
        run: |
          set -euo pipefail
          [ "$(date +%s)" -lt "$RELEASE_DISPATCH_DEADLINE_EPOCH" ] \
            || { echo '::error::checkout exhausted the absolute deploy budget'; exit 70; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_KEY" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          [ "$(git rev-parse --verify 'HEAD^{commit}')" = "$CONTROL_SHA" ]
          git cat-file -e "$SHA^{commit}"
          timeout --signal=TERM --kill-after=5s 120s \
            git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          MAIN_SHA="$(git rev-parse --verify 'origin/main^{commit}')"
          git merge-base --is-ancestor "$SHA" "$MAIN_SHA" \
            || { echo '::error::release target left protected-main history'; exit 1; }
          git merge-base --is-ancestor "$CONTROL_SHA" "$MAIN_SHA" \
            || { echo '::error::workflow control commit left protected-main history'; exit 1; }
          LATEST_REQUIRED="$(git log "$MAIN_SHA" -1 --format=%H -- \
            'server/**' ':(exclude)server/**/*.test.ts' ':(exclude)server/sim/**' ':(exclude)server/qualification/**')"
          [[ "$LATEST_REQUIRED" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::latest engine component SHA is unreadable'; exit 1; }
          # Protected-main containment is mandatory. A newer merge alone cannot
          # cancel this exact target; the host enforces sealed high-water ancestry.
          if [ "$SHA" != "$LATEST_REQUIRED" ]; then
            echo "::notice::Exact target $SHA is behind protected-main engine $LATEST_REQUIRED; host forward-only admission is still required."
          fi

      - name: Admit only the immutable target's preparation window
        id: admit
        run: |
          set -euo pipefail
          python3 server/scripts/engine-release-activation-floor.py prepare \
            --repo . --target "$SHA" --control "$CONTROL_SHA" \
            --deadline "$RELEASE_DISPATCH_DEADLINE_EPOCH" \
            > "$RUNNER_TEMP/engine-activation-floor-$RUN_KEY.json"

      - name: Establish pinned ephemeral SSH transport
        id: ssh
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] \
            || { echo '::error::HETZNER_HOST is absent or invalid'; exit 1; }
          [ -n "$SSH_KEY" ] || { echo '::error::HETZNER_SSH_PRIVATE_KEY is absent'; exit 1; }
          [ -n "$HOST_KEY" ] || { echo '::error::HETZNER_HOST_KEY is absent'; exit 1; }
          SSH_DIR="$RUNNER_TEMP/club-arena-ssh-$RUN_KEY"
          install -d -m 0700 "$SSH_DIR"
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key"
          chmod 0600 "$SSH_DIR/key"
          ssh-keygen -y -f "$SSH_DIR/key" >/dev/null
          printf '%s\n' "$HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/known_hosts"
          ssh-keygen -l -f "$SSH_DIR/known_hosts" >/dev/null
          HSSH="$RUNNER_TEMP/hssh-$RUN_KEY"
          printf '#!/usr/bin/env bash\nexec ssh -i %q -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%q -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o TCPKeepAlive=yes %q "$@"\n' \
            "$SSH_DIR/key" "$SSH_DIR/known_hosts" "$SSH_USER@$HETZNER_HOST" > "$HSSH"
          chmod 0700 "$HSSH"
          echo "HSSH=$HSSH" >> "$GITHUB_ENV"
          echo "SSH_DIR=$SSH_DIR" >> "$GITHUB_ENV"
          TRANSPORT_SETUP_REMAINING=$((RELEASE_DISPATCH_DEADLINE_EPOCH - $(date +%s)))
          [ "$TRANSPORT_SETUP_REMAINING" -gt 5 ] \
            || { echo '::error::SSH setup exhausted the absolute deploy budget'; exit 70; }
          TRANSPORT_SETUP_TIMEOUT=$((TRANSPORT_SETUP_REMAINING - 5))
          [ "$TRANSPORT_SETUP_TIMEOUT" -le 60 ] || TRANSPORT_SETUP_TIMEOUT=60
          # This command is intentionally expanded by the remote shell.
          # shellcheck disable=SC2016
          timeout --signal=TERM --kill-after=5s "${TRANSPORT_SETUP_TIMEOUT}s" \
            "$HSSH" 'test "$(id -u)" = 0 && printf "%s\n" club-arena-engine-host'

      - name: Stage exact control bytes without mutating the host checkout
        id: stage
        run: |
          set -euo pipefail
          STAGING_REMAINING=$((RELEASE_DISPATCH_DEADLINE_EPOCH - $(date +%s)))
          [ "$STAGING_REMAINING" -gt 5 ] \
            || { echo '::error::control staging exhausted the absolute deploy budget'; exit 70; }
          STAGING_TIMEOUT=$((STAGING_REMAINING - 5))
          [ "$STAGING_TIMEOUT" -le 300 ] || STAGING_TIMEOUT=300
          timeout --signal=TERM --kill-after=5s "${STAGING_TIMEOUT}s" \
            "$HSSH" "TARGET_SHA='$SHA' CONTROL_SHA='$CONTROL_SHA' RUN_KEY='$RUN_KEY' REPO_DIR='$REPO_DIR' bash -se" <<'REMOTE'
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_KEY" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          [ "$(id -u)" = 0 ]
          export GIT_NO_REPLACE_OBJECTS=1
          for binary in cmp docker flock git python3 curl systemctl systemd-analyze tar timeout; do
            command -v "$binary" >/dev/null || { echo "missing host prerequisite: $binary" >&2; exit 1; }
          done
          [ -s "$REPO_DIR/server/.env" ]
          git -C "$REPO_DIR" remote get-url origin \
            | grep -Fi 'smarter-poker/smarter-poker-club-arena' >/dev/null
          exec 8>/var/lock/club-arena-source.lock
          flock -w 90 8
          GIT_HTTP_LOW_SPEED_LIMIT=1024 GIT_HTTP_LOW_SPEED_TIME=30 \
            timeout --signal=TERM --kill-after=5s 90s \
            env -u GIT_CONFIG -u GIT_CONFIG_COUNT -u GIT_CONFIG_PARAMETERS \
              -u GIT_ASKPASS -u SSH_ASKPASS -u GIT_SSL_NO_VERIFY \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
              bash -c '
            set -euo pipefail
            # Fetch public source without changing origin or using host credentials.
            # Local includes, rewrites and HTTP overrides must not redirect this request.
            if git -C "$1" config --local --no-includes --name-only \
              --get-regexp "^(url\..*\.insteadof|include\..*|includeif\..*|http\..*|extensions\.worktreeconfig)$" >/dev/null; then
              echo "unsafe local Git transport configuration" >&2
              exit 78
            else
              rc=$?
              [ "$rc" = 1 ] || exit "$rc"
            fi
            exec git -c credential.helper= -c core.askPass=/bin/false \
              -c http.extraHeader= -c http.followRedirects=false -c http.sslVerify=true \
              -c protocol.allow=never -c protocol.https.allow=always \
              -C "$1" fetch --no-tags \
              https://github.com/Smarter-Software-PIQ/Smarter-Poker-Club-Arena.git \
              +refs/heads/main:refs/remotes/origin/main
            ' -- "$REPO_DIR"
          MAIN_SHA="$(git -C "$REPO_DIR" rev-parse --verify 'origin/main^{commit}')"
          for commit in "$TARGET_SHA" "$CONTROL_SHA"; do
            git -C "$REPO_DIR" cat-file -e "$commit^{commit}"
            git -C "$REPO_DIR" merge-base --is-ancestor "$commit" "$MAIN_SHA"
          done
          LATEST_REQUIRED="$(git -C "$REPO_DIR" log "$MAIN_SHA" -1 --format=%H -- \
            'server/**' ':(exclude)server/**/*.test.ts' ':(exclude)server/sim/**' ':(exclude)server/qualification/**')"
          [[ "$LATEST_REQUIRED" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::latest engine component SHA is unreadable'; exit 1; }
          # Protected-main containment is mandatory. A newer merge alone cannot
          # cancel this exact target; the host enforces sealed high-water ancestry.
          if [ "$TARGET_SHA" != "$LATEST_REQUIRED" ]; then
            echo "Exact target $TARGET_SHA is behind protected-main engine $LATEST_REQUIRED; host forward-only admission is still required."
          fi
          STAGE="/var/lib/club-arena/control-staging/$RUN_KEY"
          [[ "$STAGE" =~ ^/var/lib/club-arena/control-staging/[1-9][0-9]*-[1-9][0-9]*$ ]]
          rm -rf -- "$STAGE"
          install -d -m 0700 \
            /var/lib/club-arena \
            /var/lib/club-arena/control-staging \
            "$STAGE"
          GIT_NO_REPLACE_OBJECTS=1 git -c tar.umask=0022 -C "$REPO_DIR" archive "$CONTROL_SHA" server/scripts \
            | tar --no-same-owner -xf - -C "$STAGE"
          chmod 0755 "$STAGE/server/scripts/"*.sh
          for script in "$STAGE"/server/scripts/*.sh; do bash -n "$script"; done
          python3 -m py_compile \
            "$STAGE/server/scripts/engine-release-seal.py" \
            "$STAGE/server/scripts/engine-release-database-proof.py"
          python3 - "$STAGE" <<'PY'
          import os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  fd = os.open(path, os.O_RDONLY)
                  try: os.fsync(fd)
                  finally: os.close(fd)
          for path in sorted((p for p in root.rglob('*') if p.is_dir()), reverse=True):
              fd = os.open(path, os.O_RDONLY | getattr(os, 'O_DIRECTORY', 0))
              try: os.fsync(fd)
              finally: os.close(fd)
          fd = os.open(root, os.O_RDONLY | getattr(os, 'O_DIRECTORY', 0))
          try: os.fsync(fd)
          finally: os.close(fd)
          fd = os.open(root.parent, os.O_RDONLY | getattr(os, 'O_DIRECTORY', 0))
          try: os.fsync(fd)
          finally: os.close(fd)
          for parent in (root.parent.parent, root.parent.parent.parent):
              fd = os.open(parent, os.O_RDONLY | getattr(os, 'O_DIRECTORY', 0))
              try: os.fsync(fd)
              finally: os.close(fd)
          PY
          REMOTE

      - name: Prepare the scheduled immutable image without entering release intake
        id: prepare
        env:
          PREPARED_IMAGE: ${{ needs.preflight.outputs.image_id }}
          ROLLBACK_IMAGE: ${{ needs.preflight.outputs.rollback_image_id }}
        run: |
          set -euo pipefail
          if python3 - "$RUNNER_TEMP/engine-activation-floor-$RUN_KEY.json" "$SHA" <<'PYTHON'
          import json, subprocess, sys
          floor = json.load(open(sys.argv[1])).get('schema')
          scheduled = floor in ('engine-release-activation-floor/v1', 'engine-release-activation-floor/v2-owner-window')
          # An expired historical floor cannot suppress the source-owned Phase1
          # image qualification. This is the SAME existing builder/prewarm door.
          path = 'server/src/maintenance/maintenanceSchedulePolicy.json'
          present = subprocess.check_output(['git','ls-tree','--name-only',sys.argv[2],'--',path], timeout=10).strip()
          if present:
              p = json.loads(subprocess.check_output(['python3','server/scripts/engine-release-seal.py','schedule-policy','--repo','.','--sha',sys.argv[2]], timeout=35))
              scheduled = scheduled or p['phase1Status'] in ('active','complete','off')
          raise SystemExit(0 if scheduled else 1)
          PYTHON
          then
            [[ "$PREPARED_IMAGE" =~ ^sha256:[0-9a-f]{64}$ && "$ROLLBACK_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
            REMAINING=$((RELEASE_DISPATCH_DEADLINE_EPOCH - $(date +%s) - 15))
            [ "$REMAINING" -gt 0 ]
            [ "$REMAINING" -le 3450 ] || REMAINING=3450
            timeout --signal=TERM --kill-after=5s "${REMAINING}s" \
              "$HSSH" "PREPARED_IMAGE='$PREPARED_IMAGE' ROLLBACK_IMAGE='$ROLLBACK_IMAGE' TARGET_SHA='$SHA' CONTROL_SHA='$CONTROL_SHA' RUN_KEY='$RUN_KEY' NOT_AFTER_EPOCH='$RELEASE_DISPATCH_DEADLINE_EPOCH' REPO_DIR='$REPO_DIR' bash -se" \
              <<'REMOTE' | tee "$RUNNER_TEMP/engine-prepared-image-$RUN_KEY.log"
          set -euo pipefail
          STAGE="/var/lib/club-arena/control-staging/$RUN_KEY"
          python3 "$STAGE/server/scripts/engine-release-activation-floor.py" prepare \
            --repo "$REPO_DIR" --target "$TARGET_SHA" --control "$CONTROL_SHA" --deadline "$NOT_AFTER_EPOCH"
          [[ "$(docker image inspect -f '{{.Id}}' "club-arena-engine:$TARGET_SHA")" = "$PREPARED_IMAGE" ]]
          [[ "$(docker image inspect -f '{{.Id}}' "$ROLLBACK_IMAGE")" = "$ROLLBACK_IMAGE" ]]
          [[ "$(docker container inspect -f '{{if .State.Running}}{{.Image}}{{end}}' club-arena-engine)" = "$ROLLBACK_IMAGE" ]]
          [[ "$(/usr/local/lib/club-arena/engine-control/engine-release-seal.py get desired-image-id)" = "$ROLLBACK_IMAGE" ]]
          # The durable transaction reloads this run's exact admission evidence.
          # Stage is private to root and retained while its transaction is active.
          umask 077
          printf '%s\n' "$TARGET_SHA" "$CONTROL_SHA" "$PREPARED_IMAGE" "$ROLLBACK_IMAGE" > "$STAGE/prepared-image"
          sync -f "$STAGE/prepared-image"
          IMAGE_JSON="$(docker image inspect "club-arena-engine:$TARGET_SHA")"
          EXPECTED_TREE="$(GIT_NO_REPLACE_OBJECTS=1 git -C "$REPO_DIR" rev-parse "$TARGET_SHA:server")"
          IMAGE_JSON="$IMAGE_JSON" EXPECTED_TREE="$EXPECTED_TREE" python3 - <<'PYTHON'
          import json, os, re
          image = json.loads(os.environ['IMAGE_JSON'])
          assert len(image) == 1
          image = image[0]
          labels = image['Config']['Labels']
          assert re.fullmatch(r'sha256:[0-9a-f]{64}', image['Id'])
          assert labels['org.opencontainers.image.revision'] == os.environ['TARGET_SHA']
          assert labels['com.smarterpoker.engine.source-tree'] == os.environ['EXPECTED_TREE']
          assert labels['com.smarterpoker.engine.build-contract'] == 'clean-server-archive-v1'
          print('ENGINE_PREPARED_IMAGE=' + json.dumps({'targetSha': os.environ['TARGET_SHA'], 'controlSha': os.environ['CONTROL_SHA'], 'imageId': image['Id'], 'serverTree': os.environ['EXPECTED_TREE'], 'activated': False}, sort_keys=True))
          PYTHON
          IMAGE_ID="$(printf '%s' "$IMAGE_JSON" | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["Id"])')"
          GIT_NO_REPLACE_OBJECTS=1 git -C "$REPO_DIR" show "$CONTROL_SHA:server/scripts/prewarm-engine-image.sh" \
            | cmp -s - "$STAGE/server/scripts/prewarm-engine-image.sh"
          for asset in legacy-census-scale-preflight.py legacy-census-scale-fixture.mjs legacy-census-scale-composition.mjs legacy-engine-checkpoint.mjs engine-release-seal.py; do
            GIT_NO_REPLACE_OBJECTS=1 git -C "$REPO_DIR" show "$CONTROL_SHA:server/scripts/$asset" \
              | cmp -s - "$STAGE/server/scripts/$asset"
          done
          "$STAGE/server/scripts/prewarm-engine-image.sh" "$IMAGE_ID" "$RUN_KEY" "$NOT_AFTER_EPOCH"
          REMOTE
          fi

      - name: Wait for the immutable activation floor before creating any intake
        id: floor
        run: |
          set -euo pipefail
          python3 server/scripts/engine-release-activation-floor.py wait \
            --repo . --target "$SHA" --control "$CONTROL_SHA" \
            --deadline "$RELEASE_DISPATCH_DEADLINE_EPOCH"

      - name: Dispatch the staged SHA through the durable Hetzner intake
        id: release
        run: |
          set -euo pipefail
          # Every observer and retry shares the absolute deadline established
          # before checkout. The final ten minutes can never be borrowed by
          # dispatch; they belong to proof, the strict receipt, and cleanup.
          # THE STEP ALWAYS SAYS WHAT HAPPENED (Phase 6, 2026-10-31). Every
          # release since 2026-10-29 was recorded "did not prove a completed
          # durable Hetzner release transaction" because an exit path here
          # wrote no result at all. Whatever ends this script, result= is
          # written: the outcome, or failed:<stage> naming where it stopped.
          RELEASE_STAGE=budget
          RESULT_EMITTED=false
          name_release_exit() {
            local rc=$?
            local doors=''
            if [ "$RESULT_EMITTED" != true ]; then
              # A window-migration door the host found still missing inside
              # the break names itself in the receipt, not only in a log.
              if [ -r "$RUNNER_TEMP/engine-release-${RUN_KEY:-}.log" ]; then
                doors="$(sed -n 's/.*FATAL: WINDOW MIGRATION DOORS REFUSED: //p' \
                  "$RUNNER_TEMP/engine-release-${RUN_KEY:-}.log" | tail -1 | tr -d '\r' | cut -c1-300)"
              fi
              echo "result=failed:$RELEASE_STAGE" >> "$GITHUB_OUTPUT"
              if [ -n "$doors" ]; then
                echo "failed_stage=$RELEASE_STAGE (exit $rc): window migration doors refused: $doors" >> "$GITHUB_OUTPUT"
              else
                echo "failed_stage=$RELEASE_STAGE (exit $rc)" >> "$GITHUB_OUTPUT"
              fi
            fi
          }
          trap name_release_exit EXIT
          [ $((RELEASE_JOB_DEADLINE_EPOCH - RELEASE_DISPATCH_DEADLINE_EPOCH)) -ge "$POST_RELEASE_RESERVE_SECONDS" ]
          DISPATCH_FINALIZE_RESERVE_SECONDS=15
          ACTOR_B64="$(printf '%s' "$RUN_ACTOR" | base64 -w 0)"
          [[ "$ACTOR_B64" =~ ^[A-Za-z0-9+/]*={0,2}$ ]]
          # A release that stood down because protected main moved is not a broken
          # build, and until 2026-09-12 both were recorded as "release ended
          # without complete production proof". Fourteen consecutive stand-downs
          # read as fourteen failed production proofs, and the investigation went
          # looking for a sick engine that was healthy the whole time.
          classify_release_failure() {
            local log stale
            log="$RUNNER_TEMP/engine-release-$RUN_KEY.log"
            [ -r "$log" ] || return 0
            stale="$(sed -n 's/.*is stale; protected main requires \([0-9a-f]\{40\}\).*/\1/p' "$log" | tail -1)"
            [[ "$stale" =~ ^[0-9a-f]{40}$ ]] || return 0
            echo "result=superseded" >> "$GITHUB_OUTPUT"
            echo "superseded_by=$stale" >> "$GITHUB_OUTPUT"
            RESULT_EMITTED=true
          }
          uncertain_status() {
            local status="$1"
            [ "$status" -eq 255 ] || [ "$status" -eq 124 ] \
              || [ "$status" -eq 76 ] || [ "$status" -eq 75 ] \
              || [ "$status" -ge 128 ]
          }
          run_remote_intake() {
            local remaining transport_timeout
            remaining=$((RELEASE_DISPATCH_DEADLINE_EPOCH - $(date +%s) - DISPATCH_FINALIZE_RESERVE_SECONDS))
            [ "$remaining" -gt 5 ] \
              || { echo 'release intake exhausted its shared wall-clock budget' >&2; return 70; }
            transport_timeout=$((remaining - 5))
            [ "$transport_timeout" -le 360 ] || transport_timeout=360
            timeout --signal=TERM --kill-after=5s "${transport_timeout}s" \
              "$HSSH" "TARGET_SHA='$SHA' CONTROL_SHA='$CONTROL_SHA' RUN_KEY='$RUN_KEY' ACTOR_B64='$ACTOR_B64' NOT_AFTER_EPOCH='$RELEASE_DISPATCH_DEADLINE_EPOCH' GIT_NO_REPLACE_OBJECTS=1 bash -se" <<'REMOTE'
          set -euo pipefail
          export GIT_NO_REPLACE_OBJECTS=1
          STAGE="/var/lib/club-arena/control-staging/$RUN_KEY"
          ACTOR="$(printf '%s' "$ACTOR_B64" | base64 -d)"
          [[ "$NOT_AFTER_EPOCH" =~ ^[1-9][0-9]*$ ]]
          python3 "$STAGE/server/scripts/engine-release-activation-floor.py" admit \
            --repo /opt/club-arena --target "$TARGET_SHA" --control "$CONTROL_SHA" --deadline "$NOT_AFTER_EPOCH"
          "$STAGE/server/scripts/install-engine-intake.sh" \
            --target-sha "$TARGET_SHA" --control-sha "$CONTROL_SHA" \
            --run-id "$RUN_KEY" --actor "$ACTOR" \
            --not-after-epoch "$NOT_AFTER_EPOCH"
          REMOTE
          }
          observe_remote_release() {
            local remaining invocation_wait observe_seconds transport_timeout
            # The host observer rejects budgets above 10,200 seconds. Keep its
            # hard contract explicit here and reserve five seconds for SSH to
            # return after the observer reaches its own deadline.
            local observer_max_seconds=10200
            local observer_transport_grace_seconds=5
            remaining=$((RELEASE_DISPATCH_DEADLINE_EPOCH - $(date +%s) - DISPATCH_FINALIZE_RESERVE_SECONDS))
            [ "$remaining" -gt $((observer_transport_grace_seconds * 2)) ] \
              || { echo 'release observation exhausted its shared wall-clock budget' >&2; return 70; }
            transport_timeout=$((remaining - observer_transport_grace_seconds))
            if [ "$transport_timeout" -gt $((observer_max_seconds + observer_transport_grace_seconds)) ]; then
              transport_timeout=$((observer_max_seconds + observer_transport_grace_seconds))
            fi
            observe_seconds=$((transport_timeout - observer_transport_grace_seconds))
            invocation_wait=900
            [ "$invocation_wait" -le "$observe_seconds" ] || invocation_wait="$observe_seconds"
            timeout --signal=TERM --kill-after=5s "${transport_timeout}s" \
              "$HSSH" "ENGINE_RELEASE_OBSERVE_SECONDS='$observe_seconds' ENGINE_RELEASE_INVOCATION_WAIT_SECONDS='$invocation_wait' exec '/var/lib/club-arena/control-staging/$RUN_KEY/server/scripts/observe-engine-release.sh' --sha '$SHA' --run-id '$RUN_KEY'"
          }
          set +e
          RELEASE_STAGE=intake
          run_remote_intake | tee "$RUNNER_TEMP/engine-release-$RUN_KEY.log"
          SSH_RC=${PIPESTATUS[0]}
          if [ "$SSH_RC" -eq 0 ]; then
            RELEASE_STAGE=observe
            observe_remote_release | tee -a "$RUNNER_TEMP/engine-release-$RUN_KEY.log"
            SSH_RC=${PIPESTATUS[0]}
          fi
          set -e
          if uncertain_status "$SSH_RC"; then
            RELEASE_STAGE=reattach
            echo '::warning::Release intake transport/acknowledgement was uncertain; reattaching to durable host state.'
            for attempt in $(seq 1 40); do
              if [ "$attempt" -ne 1 ]; then
                RETRY_REMAINING=$((RELEASE_DISPATCH_DEADLINE_EPOCH - $(date +%s) - DISPATCH_FINALIZE_RESERVE_SECONDS))
                if [ "$RETRY_REMAINING" -le 0 ]; then
                  SSH_RC=70
                  break
                fi
                RETRY_DELAY=15
                [ "$RETRY_DELAY" -le "$RETRY_REMAINING" ] || RETRY_DELAY="$RETRY_REMAINING"
                sleep "$RETRY_DELAY"
              fi
              set +e
              run_remote_intake | tee -a "$RUNNER_TEMP/engine-release-$RUN_KEY.log"
              SSH_RC=${PIPESTATUS[0]}
              if [ "$SSH_RC" -eq 0 ]; then
                observe_remote_release | tee -a "$RUNNER_TEMP/engine-release-$RUN_KEY.log"
                SSH_RC=${PIPESTATUS[0]}
              fi
              set -e
              [ "$SSH_RC" -eq 0 ] && break
              if uncertain_status "$SSH_RC"; then
                continue
              fi
              classify_release_failure
              echo "::error::Hetzner release transaction failed while reattaching ($SSH_RC)"
              exit "$SSH_RC"
            done
          fi
          [ "$SSH_RC" -eq 0 ] \
            || { classify_release_failure; echo "::error::could not reattach to the durable Hetzner release transaction ($SSH_RC)"; exit "$SSH_RC"; }
          RELEASE_STAGE=receipt
          RESULT="$(sed -n 's/^ENGINE_RELEASE_RESULT=//p' "$RUNNER_TEMP/engine-release-$RUN_KEY.log" | tail -1)"
          UNIT_RESULT="$(sed -n 's/^ENGINE_RELEASE_UNIT_RESULT=//p' "$RUNNER_TEMP/engine-release-$RUN_KEY.log" | tail -1)"
          RESULT_SHA="$(sed -n 's/^ENGINE_RELEASE_SHA=//p' "$RUNNER_TEMP/engine-release-$RUN_KEY.log" | tail -1)"
          [ "$UNIT_RESULT" = success ] && [ "$RESULT_SHA" = "$SHA" ]
          case "$RESULT" in sealed|already-released) ;; *) echo '::error::invalid durable release receipt'; exit 1 ;; esac
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          RESULT_EMITTED=true
          echo 'completed=true' >> "$GITHUB_OUTPUT"

      - name: Independently prove the sealed local, public, and leader identity
        id: verify
        run: |
          set -euo pipefail
          PROOF_REMAINING=$((RELEASE_PROOF_DEADLINE_EPOCH - $(date +%s)))
          [ "$PROOF_REMAINING" -gt 35 ] \
            || { echo '::error::independent proof has no time left in its absolute budget'; exit 70; }
          # Preserve 30 seconds for the public proof and five seconds for a
          # forced SSH teardown. Every remote Docker inspection is therefore
          # covered by this outer wall-clock bound as well.
          REMOTE_PROOF_TIMEOUT=$((PROOF_REMAINING - 35))
          [ "$REMOTE_PROOF_TIMEOUT" -le 180 ] || REMOTE_PROOF_TIMEOUT=180
          REMOTE_PROOF="$(timeout --signal=TERM --kill-after=5s "${REMOTE_PROOF_TIMEOUT}s" \
            "$HSSH" "EXPECTED_SHA='$SHA' EXPECTED_CONTROL_SHA='$CONTROL_SHA' bash -se" <<'REMOTE'
          set -euo pipefail
          CONTROL=/usr/local/lib/club-arena/engine-control
          # A newer intake may advance the active symlink after this release
          # seals. Prove this request's immutable generation, then prove the
          # current active generation is the same or a protected descendant.
          GENERATIONS=/usr/local/lib/club-arena/engine-control-generations
          ACTIVE_CONTROL="$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).resolve(strict=True))' "$CONTROL")"
          ACTIVE_CONTROL_SHA="$(tr -d '\r\n' < "$ACTIVE_CONTROL/control-sha")"
          [[ "$EXPECTED_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACTIVE_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$ACTIVE_CONTROL" = "$GENERATIONS/$ACTIVE_CONTROL_SHA" ]
          CONTROL="$GENERATIONS/$EXPECTED_CONTROL_SHA"
          [ -d "$CONTROL" ] && [ ! -L "$CONTROL" ]
          [ -d "$ACTIVE_CONTROL" ] && [ ! -L "$ACTIVE_CONTROL" ]
          [ "$(tr -d '\r\n' < "$CONTROL/control-sha")" = "$EXPECTED_CONTROL_SHA" ]
          for CONTROL_PROOF_SHA in "$EXPECTED_CONTROL_SHA" "$ACTIVE_CONTROL_SHA"; do
            GIT_NO_REPLACE_OBJECTS=1 git -C /opt/club-arena merge-base --is-ancestor "$CONTROL_PROOF_SHA" origin/main
            GIT_NO_REPLACE_OBJECTS=1 git -C /opt/club-arena show "$CONTROL_PROOF_SHA:server/scripts/engine-release-transaction.sh" \
              | cmp -s - "$GENERATIONS/$CONTROL_PROOF_SHA/engine-release-transaction.sh"
          done
          GIT_NO_REPLACE_OBJECTS=1 git -C /opt/club-arena merge-base --is-ancestor "$EXPECTED_CONTROL_SHA" "$ACTIVE_CONTROL_SHA"
          python3 - "$CONTROL/engine-release-transaction.sh" "$ACTIVE_CONTROL/engine-release-transaction.sh" <<'PYTHON'
          import json, pathlib, subprocess, sys, urllib.request
          for gate_path in dict.fromkeys(sys.argv[1:]):
              source = pathlib.Path(gate_path).read_text()
              start = source.index('recovery_window_reason() {')
              end = source.index('\n}\n', start) + 3
              health = urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=15).read().decode()
              d = json.loads(health)
              if d.get('liveness') != 'ok' or d.get('wholeFleetStalled') is True:
                  raise SystemExit('live routine-admission proof requires a healthy engine')
              # Execute the installed decision with real live health and the old
              # urgency flag. This function is read-only and cannot announce a break.
              code = 'set -euo pipefail\nRECOVERY_URGENT=1\nRECOVERY_QUARANTINED_MANAGERS=100\n' + source[start:end] + '\nhealth=$(cat)\nrecovery_window_reason "$health"\n'
              result = subprocess.run(['bash', '-c', code], input=health, text=True, capture_output=True, timeout=10)
              if result.returncode != 0 or result.stdout.strip():
                  raise SystemExit('installed gate granted routine urgency: ' + result.stdout + result.stderr)
              print('Installed routine-admission gate refuses legacy urgency against live healthy play')
          PYTHON
          echo "__ENGINE_CONTROL_PROOF__ $EXPECTED_CONTROL_SHA"
          DESIRED_SHA="$($CONTROL/engine-release-seal.py get desired-sha)"
          DESIRED_IMAGE="$($CONTROL/engine-release-seal.py get desired-image-id)"
          ACTUAL_SHA="$(docker container inspect -f '{{index .Config.Labels "sp.release.sha"}}' club-arena-engine)"
          ACTUAL_IMAGE="$(docker container inspect -f '{{.Image}}' club-arena-engine)"
          ACTUAL_STATE="$(docker container inspect -f '{{.State.Status}}' club-arena-engine)"
          [ "$DESIRED_SHA" = "$EXPECTED_SHA" ] && [ "$ACTUAL_SHA" = "$EXPECTED_SHA" ]
          [ "$DESIRED_IMAGE" = "$ACTUAL_IMAGE" ] && [ "$ACTUAL_STATE" = running ]
          LOCAL_INSTANCE="$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache, no-store' \
            http://127.0.0.1:8080/health | EXPECTED_SHA="$EXPECTED_SHA" python3 -c '
          import json,os,re,sys
          d=json.load(sys.stdin); i=d.get("instanceId")
          ok=d.get("running") is True and d.get("releaseSha")==os.environ["EXPECTED_SHA"] and d.get("liveness")=="ok" and isinstance(i,str) and re.fullmatch(r"[1-9][0-9]*-[0-9a-f]{8}",i)
          if not ok: raise SystemExit(1)
          print(i)
          ' )"
          timeout --signal=TERM --kill-after=1s 62s \
            "$CONTROL/engine-release-database-proof.py" --env-file /opt/club-arena/server/.env \
            --sha "$EXPECTED_SHA" --instance-id "$LOCAL_INSTANCE" --timeout-seconds 60 \
            --poll-seconds 5 --max-heartbeat-age-seconds 15
          echo "__ENGINE_LOCAL_PROOF__ $DESIRED_SHA $DESIRED_IMAGE $ACTUAL_IMAGE $LOCAL_INSTANCE"
          REMOTE
          )"
          printf '%s\n' "$REMOTE_PROOF"
          PROOF_LINE="$(printf '%s\n' "$REMOTE_PROOF" | grep '^__ENGINE_LOCAL_PROOF__ ' | tail -1)"
          read -r _ DESIRED_SHA DESIRED_IMAGE ACTUAL_IMAGE LOCAL_INSTANCE EXTRA <<< "$PROOF_LINE"
          [ "$DESIRED_SHA" = "$SHA" ] && [ "$DESIRED_IMAGE" = "$ACTUAL_IMAGE" ] && [ -z "${EXTRA:-}" ]
          [[ "$DESIRED_IMAGE" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$LOCAL_INSTANCE" =~ ^[1-9][0-9]*-[0-9a-f]{8}$ ]]
          PUBLIC_BODY="$RUNNER_TEMP/engine-public-health-$RUN_KEY.json"
          trap 'rm -f -- "$PUBLIC_BODY"' EXIT
          PUBLIC_REMAINING=$((RELEASE_PROOF_DEADLINE_EPOCH - $(date +%s)))
          [ "$PUBLIC_REMAINING" -gt 3 ] \
            || { echo '::error::public proof has no time left in its absolute budget'; exit 70; }
          PUBLIC_TIMEOUT=$((PUBLIC_REMAINING - 2))
          [ "$PUBLIC_TIMEOUT" -le 20 ] || PUBLIC_TIMEOUT=20
          timeout --signal=TERM --kill-after=2s "${PUBLIC_TIMEOUT}s" \
            curl -fsS --max-time 15 -H 'Cache-Control: no-cache, no-store' \
              "$ENGINE_URL/health?nocache=$(date +%s%N)" -o "$PUBLIC_BODY"
          PARSE_REMAINING=$((RELEASE_PROOF_DEADLINE_EPOCH - $(date +%s)))
          [ "$PARSE_REMAINING" -gt 1 ] \
            || { echo '::error::public proof parsing exhausted its absolute budget'; exit 70; }
          PUBLIC_PARSE_TIMEOUT=$((PARSE_REMAINING - 1))
          PUBLIC_INSTANCE="$(timeout --signal=TERM --kill-after=1s "${PUBLIC_PARSE_TIMEOUT}s" \
            env EXPECTED_SHA="$SHA" python3 -c '
          import json,os,re,sys
          d=json.load(sys.stdin); i=d.get("instanceId")
          ok=d.get("running") is True and d.get("releaseSha")==os.environ["EXPECTED_SHA"] and d.get("liveness")=="ok" and isinstance(i,str) and re.fullmatch(r"[1-9][0-9]*-[0-9a-f]{8}",i)
          if not ok: raise SystemExit(1)
          print(i)
          ' < "$PUBLIC_BODY")"
          [ "$PUBLIC_INSTANCE" = "$LOCAL_INSTANCE" ]
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Read original sealed runtime for the post-deploy gameplay observer
        id: gameplay_receipt
        if: steps.release.outputs.result == 'sealed' && steps.verify.outputs.verified == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          [[ "$RUN_KEY" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          receipt="$(timeout 8s "$HSSH" "cat /var/lib/club-arena/engine-release-results/$RUN_KEY.json" | jq -ce --arg run "$RUN_KEY" --arg sha "$SHA" 'select(.runId==$run and .sha==$sha and .result=="sealed") | {runId,sha,result,instanceId,startedAt,completionRuntime:{instanceId:.completionRuntime.instanceId}}')"
          echo "receipt=$receipt" >> "$GITHUB_OUTPUT"

      - name: Remove exact staging and ephemeral SSH material
        if: always()
        env:
          RELEASE_COMPLETED: ${{ steps.release.outputs.completed || 'false' }}
        run: |
          set -euo pipefail
          cleanup_local_credentials() {
            rm -rf -- "${SSH_DIR:-$RUNNER_TEMP/club-arena-ssh-$RUN_KEY}" || true
            rm -f -- "${HSSH:-$RUNNER_TEMP/hssh-$RUN_KEY}" \
              "$RUNNER_TEMP/engine-release-$RUN_KEY.log" \
              "$RUNNER_TEMP/engine-public-health-$RUN_KEY.json" || true
          }
          # Local credentials are removed even when the remote cleanup cannot
          # start or is killed at its absolute deadline.
          trap cleanup_local_credentials EXIT
          REMOTE_CLEANUP_RC=0
          if [ "$RELEASE_COMPLETED" = true ] && [ -n "${HSSH:-}" ] && [ -x "$HSSH" ] && [[ "$RUN_KEY" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]; then
            CLEANUP_REMAINING=$((RELEASE_REMOTE_CLEANUP_DEADLINE_EPOCH - $(date +%s)))
            if [ "$CLEANUP_REMAINING" -le 5 ]; then
              echo '::error::remote staging cleanup has no time left in its absolute budget'
              REMOTE_CLEANUP_RC=70
            else
              REMOTE_CLEANUP_TIMEOUT=$((CLEANUP_REMAINING - 5))
              [ "$REMOTE_CLEANUP_TIMEOUT" -le 60 ] || REMOTE_CLEANUP_TIMEOUT=60
              set +e
              timeout --signal=TERM --kill-after=5s "${REMOTE_CLEANUP_TIMEOUT}s" \
                "$HSSH" "RUN_KEY='$RUN_KEY' bash -se" <<'REMOTE'
          set -euo pipefail
          [[ "$RUN_KEY" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          ! systemctl is-enabled "club-arena-engine-intake-v1@$RUN_KEY.service" >/dev/null 2>&1
          ! systemctl is-enabled "club-arena-engine-release-v1@$RUN_KEY.service" >/dev/null 2>&1
          rm -rf -- "/var/lib/club-arena/control-staging/$RUN_KEY"
          REMOTE
              REMOTE_CLEANUP_RC=$?
              set -e
            fi
          fi
          if [ "$REMOTE_CLEANUP_RC" -ne 0 ]; then
            echo "::error::remote staging cleanup failed inside its absolute budget ($REMOTE_CLEANUP_RC)"
            exit "$REMOTE_CLEANUP_RC"
          fi

      # EVERY EXIT PATH HAS A NAME (Phase 6, 2026-10-31). The first step that
      # did not succeed is this job's exit stage; record-receipt writes it,
      # with the error, outcome, target sha and run id, to
      # engine_deploy_exit_paths. Pure: reads step outcomes, touches nothing.
      - name: Name this deploy job's exit path
        id: exit_path
        if: always()
        env:
          STEP_OUTCOMES: >-
            deadline=${{ steps.deadline.outcome }}
            checkout=${{ steps.checkout.outcome }}
            freshness=${{ steps.freshness.outcome }}
            admit=${{ steps.admit.outcome }}
            ssh=${{ steps.ssh.outcome }}
            stage=${{ steps.stage.outcome }}
            prepare=${{ steps.prepare.outcome }}
            floor=${{ steps.floor.outcome }}
            release=${{ steps.release.outcome }}
            verify=${{ steps.verify.outcome }}
          RELEASE_RESULT: ${{ steps.release.outputs.result || '' }}
          RELEASE_FAILED_STAGE: ${{ steps.release.outputs.failed_stage || '' }}
          VERIFIED: ${{ steps.verify.outputs.verified || 'false' }}
        run: |
          set -euo pipefail
          STAGE=complete
          OUTCOME=success
          ERROR=''
          for pair in $STEP_OUTCOMES; do
            name="${pair%%=*}"
            outcome="${pair#*=}"
            case "$outcome" in
              success) continue ;;
              '' | skipped)
                # Skipped after an earlier failure is not its own exit.
                continue ;;
              *)
                STAGE="$name"
                OUTCOME="$outcome"
                ERROR="step $name ended $outcome"
                break ;;
            esac
          done
          if [ "$STAGE" = release ] && [ -n "$RELEASE_FAILED_STAGE" ]; then
            ERROR="release failed at $RELEASE_FAILED_STAGE"
          fi
          if [ "$STAGE" = complete ]; then
            case "$RELEASE_RESULT" in
              sealed | already-released)
                [ "$VERIFIED" = true ] && OUTCOME=shipped || OUTCOME=unverified ;;
              superseded) OUTCOME=superseded ;;
              *) OUTCOME="${RELEASE_RESULT:-unknown}" ;;
            esac
          elif [ "$RELEASE_RESULT" = superseded ]; then
            OUTCOME=superseded
          fi
          {
            echo "stage=$STAGE"
            echo "outcome=$OUTCOME"
            echo "error=$(printf '%s' "$ERROR" | tr -d '\r\n' | cut -c1-400)"
          } >> "$GITHUB_OUTPUT"
          echo "Deploy exit path: stage=$STAGE outcome=$OUTCOME ${ERROR:+error=$ERROR}"

  record-receipt:
    name: Record The Append-Only Engine Release Receipt
    needs: [preflight, engine-doors, deploy]
    if: always() && needs.preflight.result == 'success' && ((github.actor != 'github-actions[bot]' && github.triggering_actor != 'github-actions[bot]') || (github.event_name == 'repository_dispatch' && github.event.action == 'deploy-club-arena-engine')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout the exact workflow control
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Establish the receipt-job deadline
        if: always()
        run: |
          set -euo pipefail
          echo "RELEASE_RECEIPT_DEADLINE_EPOCH=$(($(date +%s) + 180))" >> "$GITHUB_ENV"

      - name: Record append-only deployment receipt
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          SHIPPED: ${{ needs.deploy.outputs.shipped }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          RUN_ACTOR: ${{ github.actor }}
          STRICT_RECEIPT: '1'
          # Prerequisite refusal, skipped/cancelled deployment and sealed-release
          # proof are distinct outcomes. A job that never reached host intake
          # cannot claim the transaction sealed or describe production identity.
          REASON: ${{ needs['engine-doors'].result != 'success' && format('release refused before host intake; production database prerequisite job ended {0}; {1}', needs['engine-doors'].result, needs['engine-doors'].outputs.refusal || 'the refusal did not name itself') || needs.deploy.outputs.release_result == 'already-released' && needs.deploy.outputs.verified == 'true' && 'production already proved this exact release' || needs.deploy.outputs.release_result == 'sealed' && needs.deploy.outputs.verified == 'true' && 'Hetzner transaction sealed and independently verified' || needs.deploy.outputs.release_result == 'superseded' && format('stood down before cutover; protected main had moved to {0}', needs.deploy.outputs.superseded_by) || needs.deploy.result == 'cancelled' && 'deployment job cancelled before a sealed release was independently proved' || needs.deploy.result == 'skipped' && 'deployment job did not run; no host intake or production identity was proved' || needs.deploy.outputs.release_failure && format('the durable Hetzner release step failed at stage {0}; read its owning state and current production identity before retrying', needs.deploy.outputs.release_failure) || needs.deploy.outputs.release_result == 'not completed' && 'this attempt did not prove a completed durable Hetzner release transaction; read its owning state and current production identity before retrying' || (needs.deploy.outputs.release_result == 'sealed' || needs.deploy.outputs.release_result == 'already-released') && 'the release sealed but production identity could not be independently proved' || 'release outcome unknown; no sealed production identity was established' }}
        run: |
          set -euo pipefail
          RECEIPT_REMAINING=$((RELEASE_RECEIPT_DEADLINE_EPOCH - $(date +%s)))
          [ "$RECEIPT_REMAINING" -ge 90 ] \
            || { echo '::error::strict deployment receipt cannot run inside its absolute budget'; exit 70; }
          # Dependency setup may use at most two minutes and must leave at
          # least one minute for the strict append-only database write.
          INSTALL_TIMEOUT=$((RECEIPT_REMAINING - 65))
          [ "$INSTALL_TIMEOUT" -le 120 ] || INSTALL_TIMEOUT=120
          timeout --signal=TERM --kill-after=5s "${INSTALL_TIMEOUT}s" \
            npm install pg@8 --no-save --ignore-scripts --no-audit --no-fund >/dev/null 2>&1
          RECEIPT_REMAINING=$((RELEASE_RECEIPT_DEADLINE_EPOCH - $(date +%s)))
          [ "$RECEIPT_REMAINING" -gt 5 ] \
            || { echo '::error::strict deployment receipt exhausted its absolute budget'; exit 70; }
          RECEIPT_TIMEOUT=$((RECEIPT_REMAINING - 5))
          timeout --signal=TERM --kill-after=5s "${RECEIPT_TIMEOUT}s" \
            node scripts/ci/record-engine-deploy-attempt.mjs

      # Phase 6: one append-only row per deploy run naming where it exited.
      # Best-effort like the receipt's warnings: it never fails the run.
      - name: Record this run's deploy exit path
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          DOORS_RESULT: ${{ needs['engine-doors'].result }}
          DOORS_REFUSAL: ${{ needs['engine-doors'].outputs.refusal }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          EXIT_STAGE: ${{ needs.deploy.outputs.exit_stage }}
          EXIT_OUTCOME: ${{ needs.deploy.outputs.exit_outcome }}
          EXIT_ERROR: ${{ needs.deploy.outputs.exit_error }}
          RELEASE_RESULT: ${{ needs.deploy.outputs.release_result }}
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 60s node scripts/ci/record-engine-deploy-exit.mjs || true

      - name: Publish release summary
        if: always()
        env:
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          RELEASE_RESULT: ${{ needs.deploy.outputs.release_result }}
          VERIFIED: ${{ needs.deploy.outputs.verified }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          DOORS_VERDICT: ${{ needs['engine-doors'].outputs.verdict }}
          DOORS_CONDITIONAL: ${{ needs['engine-doors'].outputs.conditional }}
          DOORS_CONDITIONAL_MIGRATIONS: ${{ needs['engine-doors'].outputs.conditional_migrations }}
        run: |
          set -euo pipefail
          {
            echo '## Hetzner Club Arena Engine Release'
            echo "- Target: \`$TARGET_SHA\`"
            echo "- Run identity: \`$RUN_KEY\`"
            echo "- Durable transaction: \`$RELEASE_RESULT\`"
            echo "- Independent exact-SHA proof: \`$VERIFIED\`"
            echo '- Image build: owned and bounded by the durable Hetzner transaction'
            echo "- Production doors before the break: \`${DOORS_VERDICT:-unknown}\`"
            if [ "$DOORS_VERDICT" = conditional ]; then
              echo "- Admitted only on condition: \`$DOORS_CONDITIONAL\` from queued window migration(s) \`$DOORS_CONDITIONAL_MIGRATIONS\`, re-read in pg_proc inside the break before any cutover"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # A run that ships nothing must say so where a person actually looks.
      # On 2026-09-12 fourteen consecutive runs shipped nothing over four and a
      # half hours and the only trace was a red row in a list of 1,500 runs and
      # a ledger nobody was reading. A red tick says "a step failed"; it does
      # not say "production is still on last night's engine".
      - name: Say plainly when nothing shipped
        if: always()
        env:
          SHIPPED: ${{ needs.deploy.outputs.shipped }}
          TARGET_SHA: ${{ needs.preflight.outputs.target_sha }}
          RELEASE_RESULT: ${{ needs.deploy.outputs.release_result }}
          SUPERSEDED_BY: ${{ needs.deploy.outputs.superseded_by }}
          VERIFIED: ${{ needs.deploy.outputs.verified }}
        run: |
          set -euo pipefail
          if [ "$SHIPPED" = 'true' ]; then
            echo "Production is serving $TARGET_SHA."
            exit 0
          fi
          DETAIL="durable transaction result '$RELEASE_RESULT', independent proof '$VERIFIED'"
          if [ -n "$SUPERSEDED_BY" ]; then
            DETAIL="stood down before cutover; protected main had moved to $SUPERSEDED_BY"
          fi
          if [ "$RELEASE_RESULT" = sealed ] || [ "$RELEASE_RESULT" = already-released ]; then
            echo "::warning title=NOT VERIFIED::$TARGET_SHA has a sealed release outcome but no independent production proof ($DETAIL). Activation may have occurred; read current production identity before any retry."
          else
            echo "::warning title=NOT DEPLOYED::$TARGET_SHA was not proved shipped by this attempt ($DETAIL)."
          fi
          {
            echo
            echo '### RELEASE NOT VERIFIED'
            echo "\`$TARGET_SHA\` was not independently proved live by this attempt."
            echo "- Why: $DETAIL"
            echo '- Read current production identity and the durable owning operation before any retry.'
          } >> "$GITHUB_STEP_SUMMARY"

  certify-production:
    if: "!(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')"
    name: Dispatch Exact Cross-Artifact Production Certification
    needs: [preflight, deploy, record-receipt]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      # The receivers (post-deploy-e2e.yml, backup-engine.yml) honour this
      # job-token dispatch only when it is the exact intent recorded here:
      # scripts/ci/dispatch-intent.mjs, operation engine-certification.
      - name: Record the exact certification intent before sending it
        id: intent
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_SHA: ${{ needs.preflight.outputs.target_sha }}
          RELEASE_RESULT: ${{ needs.deploy.outputs.release_result }}
          GAMEPLAY_RECEIPT: ${{ needs.deploy.outputs.gameplay_receipt }}
        run: |
          set -euo pipefail
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::The sealed engine release did not expose one full lowercase SHA.'; exit 1; }
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/scripts/ci/dispatch-intent.mjs?ref=$GITHUB_SHA" > "$RUNNER_TEMP/dispatch-intent.mjs"
          ARGS=(--input "engine_sha=$ENGINE_SHA")
          if [ "$RELEASE_RESULT" = sealed ]; then
            ARGS+=(--input "release_run_key=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --input "gameplay_receipt=$GAMEPLAY_RECEIPT")
          fi
          node "$RUNNER_TEMP/dispatch-intent.mjs" write --operation engine-certification --dir "$RUNNER_TEMP/dispatch-intents" "${ARGS[@]}" > "$RUNNER_TEMP/certification-intent.json"
          jq -c .body "$RUNNER_TEMP/certification-intent.json" > "$RUNNER_TEMP/certification-dispatch.json"
          echo "nonce=$(jq -r .nonce "$RUNNER_TEMP/certification-intent.json")" >> "$GITHUB_OUTPUT"
      - name: Publish the intent on this exact run attempt
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-intents-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-intents
          if-no-files-found: error
          retention-days: 7
      - name: Dispatch and prove the exact post-deploy E2E receiver
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_SHA: ${{ needs.preflight.outputs.target_sha }}
          RELEASE_RESULT: ${{ needs.deploy.outputs.release_result }}
          GAMEPLAY_RECEIPT: ${{ needs.deploy.outputs.gameplay_receipt }}
          REPO: ${{ github.repository }}
          INTENT_NONCE: ${{ steps.intent.outputs.nonce }}
        run: |
          set -euo pipefail
          [[ "$ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo '::error::The sealed engine release did not expose one full lowercase SHA.'; exit 1; }
          [[ "$INTENT_NONCE" =~ ^[0-9a-f]{32}$ ]] || { echo '::error::No recorded certification intent.'; exit 1; }
          jq -e --arg sha "$ENGINE_SHA" '.event_type == "run-post-deploy-e2e" and .client_payload.engine_sha == $sha' \
            "$RUNNER_TEMP/certification-dispatch.json" >/dev/null
          SENT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh api --method POST "repos/$REPO/dispatches" --input "$RUNNER_TEMP/certification-dispatch.json"
          echo "Production E2E dispatch accepted for exact engine component $ENGINE_SHA."

          RECEIVER_ID=''
          for _ in $(seq 1 12); do
            RECEIVER_ID="$(gh api \
              "repos/$REPO/actions/workflows/post-deploy-e2e.yml/runs?event=repository_dispatch&per_page=30" \
              --jq "[.workflow_runs[] | select(.display_title == \"Post-Deploy E2E $ENGINE_SHA $INTENT_NONCE\" and .created_at >= \"$SENT_AT\")][0].id // empty")"
            [ -n "$RECEIVER_ID" ] && break
            sleep 5
          done
          [[ "$RECEIVER_ID" =~ ^[0-9]+$ ]] \
            || { echo '::error::GitHub accepted the exact certification event but no correlated post-deploy E2E run appeared.'; exit 1; }
          echo "Post-deploy E2E receiver $RECEIVER_ID accepted exact engine component $ENGINE_SHA."

          if [ "$RELEASE_RESULT" = sealed ]; then
            title="Backup after seal $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            backup_id=''
            for _ in $(seq 1 8); do
              backup_id=$(gh api "repos/$REPO/actions/workflows/backup-engine.yml/runs?event=repository_dispatch&per_page=30" |
                jq -r --arg title "$title" '[.workflow_runs[] | select(.display_title==$title)][0].id // empty')
              [ -z "$backup_id" ] || break
              sleep 5
            done
            [[ "$backup_id" =~ ^[1-9][0-9]*$ ]] || { echo '::error::No Backup run accepted the original sealed release event'; exit 1; }
            echo "Backup run $backup_id accepted sealed receiver $GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT for $ENGINE_SHA"
          fi
