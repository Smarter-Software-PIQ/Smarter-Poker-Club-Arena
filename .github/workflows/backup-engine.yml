                --jq "[.workflow_runs[] | select(.id > $RUN_ID and .head_sha != \"$SHA\" and .status != \"completed\") | .head_sha] | unique | .[]" 2>/dev/null) || newer_shas=unreadable
              if [ "$newer_shas" != unreadable ] && [ -n "$newer_shas" ]; then
                diff_newer=0
                has_identity_tool=0
                my_id=''
                if [ -f scripts/ci/engine-source-identity.sh ]; then
                  has_identity_tool=1
                  my_id=$(bash scripts/ci/engine-source-identity.sh "$SHA" 2>/dev/null || echo '')
                  git fetch -q origin +refs/heads/main:refs/remotes/origin/main 2>/dev/null || true
                fi
                while IFS= read -r other_sha; do
                  [ -n "$other_sha" ] || continue
                  if [ "$has_identity_tool" = 1 ]; then
                    if [[ ! "$my_id" =~ ^[0-9a-f]{64}$ ]] || [[ ! "$other_sha" =~ ^[0-9a-f]{40}$ ]]; then
                      echo "Could not verify engine-source-identity for newer active push run ($other_sha); keeping wait (CLAUDE.md 10.86)."
                      continue
                    fi
                    other_id=$(bash scripts/ci/engine-source-identity.sh "$other_sha" 2>/dev/null || echo '')
                    if [[ ! "$other_id" =~ ^[0-9a-f]{64}$ ]]; then
                      echo "Could not read engine-source-identity of newer active push run ($other_sha); keeping wait (CLAUDE.md 10.86)."
                      continue
                    fi
                    if [ "$other_id" = "$my_id" ] \
                       && git diff --quiet "$GITHUB_SHA" "$other_sha" -- .github/workflows/backup-engine.yml 2>/dev/null; then
                      echo "Newer active push run ($other_sha) shares identical engine-source-identity (${my_id:0:12}) and workflow; keeping wait."
                      continue
                    fi
                  fi
                  diff_newer=$((diff_newer + 1))
                done <<< "$newer_shas"
                if [ "$diff_newer" -gt 0 ]; then
                  priority=unknown; window=''
                  if [ ! -s "$priority_tool" ]; then
                    gh api -H 'Accept: application/vnd.github.raw' "repos/${GITHUB_REPOSITORY:-}/contents/scripts/ci/backup-candidate-priority.py?ref=$GITHUB_SHA" > "$priority_tool" 2>/dev/null || : > "$priority_tool"
                  fi
                  if [ -s "$priority_tool" ]; then
                    pverdict=$(python3 -B "$priority_tool" --repo "${GITHUB_REPOSITORY:-}" --sha "$SHA" 2>/dev/null) || pverdict=''
                    panswer=$(printf '%s\n' "$pverdict" | sed -n 's/^priority=//p')
