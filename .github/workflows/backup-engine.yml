                      none|booking|booking_pending|candidate|predates) priority="$panswer"; window=$(printf '%s\n' "$pverdict" | sed -n 's/^window=//p') ;;
                    esac
                  fi
                  if [ "$priority" = booking ]; then
                    echo "PRIORITY: $SHA is the booking commit of open owner engine window $window; keeping wait despite $diff_newer newer active push run(s)."
                  else
                    echo "SUPERSEDED: $diff_newer newer active push run(s) of this workflow arrived while waiting for the Backup host; $SHA yields cleanly without holding the lease or writing a status."
                    { echo "### Backup Engine"; echo ""; echo "- SUPERSEDED \`$SHA\` while waiting for the Backup host: $diff_newer newer active push run(s) arrived; yielded cleanly, no certificate written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
