                      fi
                      ;;
                    success)
                      echo "main's newest server commit $head already carries $STATUS_CONTEXT = success; keeping $SHA."
                      ;;
                    *)
                      echo "could not read $STATUS_CONTEXT on $head ($head_state); keeping $SHA (CLAUDE.md 10.86)."
                      ;;
                  esac
                fi
              else
                echo "main's newest server commit $head is not a fetched protected descendant of $SHA/$GITHUB_SHA; keeping $SHA."
              fi
            elif [ "$head" = unreadable ]; then
