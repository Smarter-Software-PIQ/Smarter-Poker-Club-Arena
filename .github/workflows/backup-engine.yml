name: Backup Engine (Clone, Stage, Certify)
run-name: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.release_run_key && format('Backup after seal {0}', github.event.client_payload.release_run_key) || github.event_name == 'workflow_dispatch' && inputs.after_cycle && format('Backup after keep-serving {0}{1}', inputs.after_cycle, inputs.intent_nonce && format(' {0}', inputs.intent_nonce) || '') || '' }}

# THE BACKUP ENGINE (owner order 2026-11-05). A 1:1 clone of the serving
# engine runs on its own Hetzner host against an isolated copy of the
# production database structure. Every engine change lands here first and is
# built, booted, crash-tested and soaked while the live engine keeps running.
# A version that passes gets the commit status "backup-engine/certified"; the
# 04:00 Chicago cutover accepts only a certified version. Nothing here can
# touch the live engine, its host, or production data: the standby host holds
# no production credential and its runtime network cannot reach the internet.
#
#   push to main (server tree)  certify the new main
#   00:01 Chicago nightly        refresh the production structure and seed,
#                                re-clone the serving engine, certify main
#   workflow_dispatch            certify one exact SHA
#   workflow_dispatch + after_cycle  Stage's certification of main after a
#                             cycle that did not seal (O27, O27b): intent
#                             proved, and red when it certified nothing
#   sealed receiver event     certify the NEXT candidate on a fresh copy,
#                             rehearsed against the build that just sealed
#                             (O24; nothing newer: the run ends in seconds)
#
# THE QUEUE DRAINS ITSELF (2026-11-07). Runs are serialized (one Backup host)
# and a certificate takes about forty-five minutes, while main receives
# engine pushes every few minutes. Each push queues its own run, so by the
# time a queued push run starts, a newer push has usually replaced its
# commit: the 04:00 cutover offers the NEWEST certified main commit, so the
# older one would be certified for nothing while the post-seal clone refresh
# waited hours behind it (4.5 h on 2026-11-07). The plan job therefore asks
# GitHub whether a newer push run of this workflow exists; if so the run
# ends in seconds with nothing planned and no status written (the commit
# stays uncertified, exactly as if its turn had never come). Only push runs
# are skipped: a manual, nightly or post-seal clone refresh is never skipped,
# and when GitHub cannot be read the run proceeds as before (CLAUDE.md
# 10.86: an unreadable answer is not a "yes"). The push run that does start
# certifies main's newest server commit (the release lane's offered tree)
# when that descends from its own push, and plans nothing when that commit
# already carries a success certificate, so no commit is certified twice.
#
# THE BOOKED CANDIDATE GOES FIRST (2026-11-14; hardened 2026-11-21). While an
# owner engine window booked on main is open or upcoming and its release is not
# yet serving, a push run asks scripts/ci/backup-candidate-priority.py
# (read-only) where its own commit stands. The BOOKING commit (the first main
# commit carrying main's release controls) is certified exactly: it is neither
# superseded by later ordinary pushes nor retargeted. A post-booking push commit
# whose booking commit does not yet carry backup-engine/certified = success gets
# `booking_pending` and ends as DEFERRED (never racing onto the single Backup
# host ahead of the booking commit); once the booking commit is certified,
# post-booking pushes proceed as `candidate`. A commit whose release controls
# differ from main's cannot be the owner window's selection while it is open; if it
# was neither superseded nor retargeted it ends as DEFERRED with nothing
# planned and no status written. Any unreadable answer is "unknown" and the
# run behaves exactly as before. Nothing here cancels a running certification.
#
# A CERTIFICATE FOLLOWS IDENTICAL ENGINE SOURCE (2026-11-07). Most server-tree
# pushes do not change a byte the engine image is built from (standby
# scripts, server/tests, sim and qualification tooling, workflow and doc
# edits beside them: 21 of the last 124 first-parent server commits). The
# image is built from `git archive <sha> server` with server/Dockerfile, so
# scripts/ci/engine-source-identity.sh hashes exactly the Dockerfile's COPY
# sources at a commit (and itself). A push run that is not superseded checks
# out the candidate, walks main's first-parent line back 60 commits, and for
# every ancestor with the SAME identity reads its newest backup-engine/
# certified status: success inherits (the candidate receives its own
# success status naming the source commit; nothing is built), failure, error
# or an unreadable read stops the walk and certifies in full, and missing or
# pending keeps walking. A different identity is never asked about. Only
# push runs inherit; dispatch, schedule and post-seal runs always build.
#
# NO LEASE STARVATION OR DUPLICATE SOAKS ON 3-HOURLY CADENCE (2026-11-21, E3;
# hardened 2026-11-21, O1 & O2; hardened 2026-11-22, O11).
# Waiting push runs previously timed out at 75 min behind an active refresh +
# 55-min certification and published no-verdict errors, while superseded runs
# kept competing for the lease and runs whose identical ancestor finished while
# they waited re-ran a duplicate 55-min soak. The lease-wait ceiling is 120 min
# (refresh timeout 180 min, host lease TTL 150 min). While STILL WAITING for
# the lease, non-booking, non-freeze-baseline push runs yield cleanly as
# SUPERSEDED only when a strictly newer ACTIVE (non-completed) push run exists
# with a different engine-source-identity, different backup_projection, or
# changed backup-engine.yml, avoiding unnecessary disruption from completed or
# inheritable pushes while preventing obsolete runs from racing runs that can
# never inherit their certificate (O2, O11). Immediately after acquiring the
# lease, eligible push runs never drop the lease for a newer push: instead
# `late_retarget` retargets in-place to main's newest uncertified server commit (when it descends from SHA/GITHUB_SHA
# without changing backup-engine.yml), then `late_inherit` checks ALREADY
# CERTIFIED and engine-source-identity + backup_projection on the retargeted
# SHA so any certificate earned while waiting is inherited in seconds and the
# host is freed at once (O2). During `certify`, the offline standby host stays
# completely network-free while a bounded runner-side check (every 60 s) yields
# cleanly as YIELDED_OBSOLETE (stopping the standby container, releasing the
# lease, writing no failure/error status, exit 0) ONLY when a non-booking,
# non-freeze-baseline push run has a newer active push run waiting, its
# projection(SHA) or supabase/migrations already diverged from origin/main,
# fewer than 75 min remain to the next scheduled cutoff, and every read
# succeeded (O1; CLAUDE.md 10.86).
#
# THE POST-SEAL BACKUP CERTIFIES THE NEXT CANDIDATE (2026-11-24, O24).
# Right after every seal the receiver starts "Backup after seal <run>-<attempt>".
# It used to spend about 48 minutes of the one Backup host re-certifying the
# build that had JUST SEALED (45370915542 held the host 10:02-10:50Z,
# 45399317563 13:02-13:48Z), a certificate nothing shippable needs: the
# selector walks only commits AFTER the serving release. The cycle's real
# candidate could start only afterwards, which left one attempt per three-hour
# cycle, and candidates certified before the seal had rehearsed against the
# previous engine ("serving rollback rehearsal unavailable"). After the
# unchanged custody proof (O15) the run now targets the newest first-parent
# commit of its own commit (main at the seal) touching server/ or a
# CONTROL_INPUTS path (the O13 rule) when that commit is ahead of the sealed
# build; the standby rehearses against live /health, which the custody proof
# has just shown to be the sealed release. Nothing ahead: custody is proven,
# the host is not taken, no status is written. The target is always at or
# behind this run's own commit and CONTROL_SHA stays github.sha, because
# select-daily-engine.py admits a retargeted control from push runs only.
# Inside tonight's freeze certification window the baseline rule
# (scripts/ci/backup-freeze-baseline.py) alone decides: `due` certifies the
# baseline exactly as a push run would; `claimed` or `done` certifies it again
# (2026-11-26: a certificate made before or across the seal rehearsed against
# the outgoing engine, 187d1ee1b4cf), unless the standing success already
# rehearsed against the sealed build; any other in-window answer certifies
# nothing. A next-candidate run is treated as a push run by late supersession
# while waiting (O11), the uninstalled-migration guard (O7) and the mid-soak
# yield (O1/O16); it waits (bounded, 25 minutes, in the existing `due` read)
# for migrations merged in the last day to install before its copy is taken,
# and hands the host back when its target already holds a success for
# production's current comparable set whose rollback rehearsal named the
# sealed build. Anything unreadable certifies the sealed build as before
# (CLAUDE.md 10.86).
#
# ONE BOUNDED RE-EXPORT (2026-11-24, O24). Run 45324579997 (04:18Z) lost its
# cycle because production installed a migration between the export's two
# schema-evidence captures. The export step repeats itself exactly once,
# after a fixed 45 s pause, only when the offline before/after comparison
# refuses; a capture, dump or seed error still fails at once and a second
# refusal fails exactly as before.
on:
  repository_dispatch:
    # The second event lets the owner deliver a previously lost seal to Backup alone.
    types: [run-post-deploy-e2e, refresh-sealed-engine-backup]
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'supabase/migrations/**'
      - '.github/workflows/engine-release-prequalification.yml'
      - '.github/workflows/stage-engine-release.yml'
      - '.github/workflows/auto-deploy-hetzner.yml'
      - '.github/workflows/backup-engine.yml'
      - 'scripts/ci/read-engine-prequalification.py'
      - 'scripts/ci/prestage-engine-image.sh'
      - 'scripts/ci/select-daily-engine.py'
      - 'scripts/ci/check-engine-doors-exist.mjs'
      - 'scripts/ci/window-migration-doors.mjs'
      - 'scripts/ci/recorded-migrations.manifest.json'
      - 'scripts/ci/record-engine-deploy-attempt.mjs'
      - 'scripts/ci/record-engine-deploy-exit.mjs'
      - 'scripts/ci/record-engine-release-alert.mjs'
  schedule:
    # Nightly refresh after midnight America/Chicago (05 UTC is CDT, 06 UTC
    # is CST). GitHub has delivered schedules hours late or not at all, so
    # there are three chances per DST twin; the refresh itself runs once per
    # Chicago date (it reads the standby's own restore stamp).
    - cron: '7,23,41 5 * * *'
    - cron: '7,23,41 6 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-hex commit to certify (default: main)'
        required: false
        default: ''
        type: string
      refresh:
        description: 'Refresh the production structure and seed first'
        required: false
        default: false
        type: boolean
      after_cycle:
        # O27 (2026-11-25), O27b (2026-11-26): set by Stage's
        # next-candidate-after-cycle job for a cycle that did not seal. It
        # names the run "Backup after keep-serving <cycle> <nonce>". That job
        # sends with the job token, so refresh and certify admit it only as
        # the exact intent the Stage run recorded (the three intent_* inputs,
        # scripts/ci/dispatch-intent.mjs receiver backup-after-keep-serving),
        # and keep-serving-outcome fails the run when it certified nothing.
        description: 'Internal: the Chicago cycle (YYYY-MM-DD or YYYY-MM-DDTHH) that did not seal'
        required: false
        default: ''
        type: string
      intent_run_id:
        description: 'Internal: set by Stage with after_cycle; the run whose dispatch-intents artifact binds this dispatch (empty for a person)'
        required: false
        default: ''
        type: string
      intent_run_attempt:
        description: 'Internal: set by Stage with after_cycle (empty for a person)'
        required: false
        default: ''
        type: string
      intent_nonce:
        description: 'Internal: set by Stage with after_cycle; the one-time intent key (empty for a person)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  statuses: write
  actions: read

concurrency:
  # UNRELATED PUSHES NEVER CANCEL A CERTIFICATION (incident 075013fd, Lane 1).
  # GitHub Actions concurrency groups hold at most 1 running + 1 pending run
  # (ignoring any unsupported `queue: max` key) and cancel the pending run when
  # a third arrives. Using a shared 'backup-engine' group caused unrelated
  # pushes to cancel pending manual/scheduled/post-seal certifications before
  # `plan` even ran. Each run therefore owns its own concurrency group with
  # cancel-in-progress: false, and exclusive access to STANDBY_HOST is
  # serialized across refresh -> certify by the standby host run-lease.
  group: ${{ github.event_name == 'repository_dispatch' && !github.event.client_payload.release_run_key && format('backup-no-seal-{0}', github.run_id) || format('backup-engine-{0}-{1}', github.event_name, github.run_id) }}
  cancel-in-progress: false

env:
  # The Backup Engine host (club-arena-engine-standby). Firewall: SSH key-only.
  STANDBY_HOST: 5.161.236.0
  # Pinned host key, so the lane never trusts a substituted machine.
  STANDBY_HOST_KEY: '5.161.236.0 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIRbg+oBuQofVZ4KWwVB9IK0vPU26+DjidHmQQ3Dprom'
  STATUS_CONTEXT: backup-engine/certified

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'repository_dispatch' || github.event.client_payload.release_run_key != '')
    permissions:
      contents: read
      actions: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      # An inherited certificate plans nothing, exactly like a superseded run.
      sha: ${{ steps.inherit.outputs.inherited != 'true' && steps.plan.outputs.sha || '' }}
      control_sha: ${{ steps.plan.outputs.control_sha || github.sha }}
      refresh: ${{ steps.inherit.outputs.inherited != 'true' && steps.plan.outputs.refresh || '' }}
      freeze_baseline: ${{ steps.plan.outputs.freeze_baseline }}
      priority: ${{ steps.plan.outputs.priority }}
      inherit_eligible: ${{ steps.plan.outputs.inherit_eligible }}
      # O24: '1' only when this post-seal run certifies the next candidate.
      post_seal: ${{ steps.next.outputs.post_seal }}
      sealed_sha: ${{ steps.seal.outputs.sha }}
    steps:
      - name: Prove the original sealed receiver and claim its first Backup run
        id: seal
        if: github.event_name == 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.client_payload.engine_sha }}
          RUN_KEY: ${{ github.event.client_payload.release_run_key }}
          RECEIPT: ${{ github.event.client_payload.gameplay_receipt }}
        run: |
          set -euo pipefail
          [[ "$RUN_KEY" =~ ^[1-9][0-9]*-[1-9][0-9]*$ && "$TARGET" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Sealed-release event has no exact run key ($RUN_KEY) and engine SHA ($TARGET)."; exit 1; }
          api="repos/$GITHUB_REPOSITORY/actions"
          parent="$api/runs/${RUN_KEY%-*}/attempts/${RUN_KEY#*-}"
          created=$(gh api "$parent" | jq -er --arg title "Engine Release $TARGET" --arg attempt "${RUN_KEY#*-}" '
            select(.path==".github/workflows/auto-deploy-hetzner.yml" and .event=="repository_dispatch" and
              .head_branch=="main" and .display_title==$title and (.run_attempt|tostring)==$attempt) | .created_at') \
            || { echo "::error::Run $RUN_KEY is not the protected Engine Release receiver attempt for $TARGET."; exit 1; }
          gh api "$parent/jobs?per_page=100" | jq -e '
            any(.jobs[]; .name=="Record The Append-Only Engine Release Receipt" and .conclusion=="success") and
            any(.jobs[]; .name=="Publish Through Hetzner Club Arena" and .conclusion=="success" and
              any(.steps[]; .name=="Read original sealed runtime for the post-deploy gameplay observer" and .conclusion=="success"))' >/dev/null \
            || { echo "::error::Receiver $RUN_KEY has not recorded a successful sealed receipt and publish."; exit 1; }
          instance=$(jq -er --arg key "$RUN_KEY" --arg sha "$TARGET" '
            select(.runId==$key and .sha==$sha and .result=="sealed") | .completionRuntime.instanceId |
            select(type=="string" and test("^[1-9][0-9]*-[0-9a-f]{8}$"))' <<< "$RECEIPT") \
            || { echo "::error::The event's receipt is not the sealed receipt of $RUN_KEY for $TARGET."; exit 1; }
          curl -fsS --max-time 15 https://engine.smarter.poker/health |
            jq -e --arg sha "$TARGET" --arg instance "$instance" '
              .running==true and .releaseSha==$sha and .instanceId==$instance' >/dev/null \
            || { echo "::error::Live /health is not running $TARGET on sealed instance $instance."; exit 1; }
          # Serialized Backup runs give the earliest delivery sole custody, including on retries.
          # THIS RUN IS ALWAYS ONE OF THEM (2026-11-22, O15). GitHub's created-filtered
          # run list lags a new run by several seconds: at 22:02:28Z Backup 45075415442
          # (created 22:02:24Z) did not yet list itself, read `null`, and refused the
          # 16:00 CST seal of 88b8dac0ebdc with a bare exit 1; the receiver's own poll
          # first saw it at 22:02:34Z (same on 2026-11-20, 44827012024). An earlier
          # delivery was created earlier and is listed; this run's own id joins the
          # set, so a lagging list can no longer disown the first delivery. An
          # unreadable list still refuses (pipefail).
          runs=$(gh api --paginate "$api/workflows/backup-engine.yml/runs?event=repository_dispatch&created=%3E%3D$created&per_page=100" |
            jq -s --arg title "Backup after seal $RUN_KEY" --argjson self "$GITHUB_RUN_ID" \
              '[.[].workflow_runs[] | select(.display_title==$title) | .id] + [$self] | min') \
            || { echo "::error::Could not read the Backup runs that answered sealed receiver $RUN_KEY (CLAUDE.md 10.86)."; exit 1; }
          if [[ "$runs" != "$GITHUB_RUN_ID" || "$GITHUB_RUN_ATTEMPT" != 1 ]]; then
            [[ "$runs" =~ ^[1-9][0-9]*$ && "$runs" -le "$GITHUB_RUN_ID" ]] \
              || { echo "::error::Backup custody of sealed receiver $RUN_KEY is unreadable ($runs)."; exit 1; }
            echo "Original Backup run $runs owns sealed receiver $RUN_KEY"
            exit 0
          fi
          echo "Sealed receiver $RUN_KEY requests a fresh Backup of $TARGET on instance $instance"
          echo "sha=$TARGET" >> "$GITHUB_OUTPUT"
      # THE POST-SEAL BACKUP CERTIFIES THE NEXT CANDIDATE (2026-11-24, O24).
      # A failed checkout is "unreadable": the next step then certifies the
      # sealed build exactly as before instead of failing the plan. The
      # sparse set is the plan job's one set (the inherit checkout below).
      - uses: actions/checkout@v4
        if: github.event_name == 'repository_dispatch' && steps.seal.outputs.sha != ''
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts/ci/engine-source-identity.sh
            scripts/ci/read-engine-prequalification.py
          sparse-checkout-cone-mode: false
      - name: Choose the next candidate the post-seal Backup certifies
        id: next
        if: github.event_name == 'repository_dispatch' && steps.seal.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SEALED_SHA: ${{ steps.seal.outputs.sha }}
          RUN_KEY: ${{ github.event.client_payload.release_run_key }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sealed="$SEALED_SHA"
          [[ "$sealed" =~ ^[0-9a-f]{40}$ ]]
          as_before() {
            echo "POST-SEAL TARGET UNREADABLE: $1; certifying the sealed build $sealed exactly as before (CLAUDE.md 10.86)."
            echo "sha=$sealed" >> "$GITHUB_OUTPUT"
            exit 0
          }
          nothing() {
            echo "NOTHING TO CERTIFY AFTER THE SEAL: $1. Custody of sealed receiver ${RUN_KEY:-} is proven; the Backup host is not taken and no status is written."
            { echo "### Backup Engine"; echo ""; echo "- Nothing to certify after the seal of \`$sealed\`: $1; host not taken, no status written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          }
          # The target must be at or behind this run's own commit: CONTROL_SHA
          # stays github.sha for a dispatch run (select-daily-engine.py admits a
          # retargeted control from push runs only).
          git rev-parse --verify --quiet "$GITHUB_SHA^{commit}" >/dev/null 2>&1 \
            || as_before "this run has no checkout of its own commit $GITHUB_SHA"
          git merge-base --is-ancestor "$sealed" "$GITHUB_SHA" 2>/dev/null \
            || as_before "the sealed build is not an ancestor of this run's commit $GITHUB_SHA"
          # INSIDE TONIGHT'S FREEZE THE BASELINE RULE DECIDES (O6/O17/O22). The
          # same read-only reader the push and schedule runs ask. `due`: this
          # run claims and certifies the baseline exactly as they would. Any
          # other in-window answer: the baseline is certified, claimed by an
          # active run, already serving, refused or unselectable, and no other
          # build can ship at 04:00, so the host is left to the baseline's run.
          # `outside` or unreadable: the next-candidate rule below.
          tool=$(mktemp); baseline_state=unknown; baseline=''
          if gh api -H 'Accept: application/vnd.github.raw' "repos/${GITHUB_REPOSITORY:-}/contents/scripts/ci/backup-freeze-baseline.py?ref=main" > "$tool" 2>/dev/null; then
            verdict=$(python3 -B "$tool" --repo "${GITHUB_REPOSITORY:-}" 2>/dev/null) || verdict=''
            baseline_state=$(printf '%s\n' "$verdict" | sed -n 's/^state=//p')
            baseline=$(printf '%s\n' "$verdict" | sed -n 's/^baseline=//p')
          fi
          rm -f "$tool"
          echo "freeze baseline: ${baseline_state:-unknown}${baseline:+ ($baseline)}"
          case "${baseline_state:-unknown}" in
            due)
              if [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] && [ "$baseline" != "$sealed" ] \
                 && git merge-base --is-ancestor "$sealed" "$baseline" 2>/dev/null \
                 && git merge-base --is-ancestor "$baseline" "$GITHUB_SHA" 2>/dev/null; then
                gh api "repos/$GITHUB_REPOSITORY/statuses/$baseline" -f state=pending -f context="$STATUS_CONTEXT" \
                  -f description="Backup Engine claimed tonight's freeze baseline (run $RUN_ID)" \
                  -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" >/dev/null \
                  || echo "::warning::could not write the freeze-baseline claim; certifying anyway"
                echo "FREEZE BASELINE: $baseline is tonight's shippable 04:00 build and is ahead of the sealed build $sealed; the post-seal run certifies it on a copy restored now, not superseded."
                { echo "### Backup Engine"; echo ""; echo "- FREEZE BASELINE \`$baseline\` after the seal of \`$sealed\`: certified on tonight's frozen copy (refresh forced)."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                echo "sha=$baseline" >> "$GITHUB_OUTPUT"
                echo "freeze_baseline=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              nothing "tonight's freeze baseline ${baseline:-unknown} is due but is not a build ahead of the sealed build on this run's commit"
              ;;
            claimed|done)
              # A CERTIFICATE THAT SPANS THE SEAL IS RE-CERTIFIED (2026-11-26).
              # On 2026-11-25 the freeze baseline 187d1ee1b4cf was certified
              # 06:33-07:26Z, across the 07:00Z seal, so its rollback rehearsal
              # named the outgoing engine d2833d21 and the selector refused it
              # for good ("serving rollback rehearsal unavailable"); this run
              # (45565107439, 07:03Z) read `claimed` and certified nothing.
              # A baseline that is claimed (its run started before this seal)
              # or done (certified before it, or while it happened) is now
              # planned again, without a new claim status, so that it is never
              # left without a certificate the new engine can roll back to. The
              # refresh job's standing-certificate check hands the host back,
              # with no soak, when the standing success already rehearsed
              # against the sealed build and names production's current set.
              if [[ "$baseline" =~ ^[0-9a-f]{40}$ ]] && [ "$baseline" != "$sealed" ] \
                 && git merge-base --is-ancestor "$sealed" "$baseline" 2>/dev/null \
                 && git merge-base --is-ancestor "$baseline" "$GITHUB_SHA" 2>/dev/null; then
                echo "FREEZE BASELINE RE-CERTIFIED AFTER THE SEAL: $baseline answers $baseline_state, so its certificate rehearsed (or will rehearse) its rollback against the engine before $sealed; this run certifies it again with the rollback rehearsed against $sealed, unless the standing success already names $sealed."
                { echo "### Backup Engine"; echo ""; echo "- FREEZE BASELINE \`$baseline\` ($baseline_state) re-certified after the seal of \`$sealed\` (refresh forced; host handed back if its standing success already rehearsed against \`$sealed\`)."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                echo "sha=$baseline" >> "$GITHUB_OUTPUT"
                echo "freeze_baseline=1" >> "$GITHUB_OUTPUT"
                echo "post_seal=1" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              nothing "tonight's freeze baseline ${baseline:-unknown} answers $baseline_state but is not a build ahead of the sealed build on this run's commit"
              ;;
            served|refused|unselectable)
              nothing "inside tonight's release schema freeze the baseline rule decides the one shippable build and answers $baseline_state${baseline:+ for $baseline}"
              ;;
          esac
          # The O13 rule, read at this run's own commit: the newest first-parent
          # commit touching server/ or any CONTROL_INPUTS path. Unreadable
          # CONTROL_INPUTS follow the newest server commit only.
          control_paths=()
          while IFS= read -r control_path; do
            [ -n "$control_path" ] && control_paths+=("$control_path")
          done < <(python3 -B -c 'import runpy; m=runpy.run_path("scripts/ci/read-engine-prequalification.py"); print("\n".join(m["CONTROL_INPUTS"]))' 2>/dev/null || true)
          if [ "${#control_paths[@]}" -eq 0 ]; then
            echo "could not read CONTROL_INPUTS; following the newest server commit only (CLAUDE.md 10.86)."
          fi
          head=$(git log -1 --first-parent --format=%H "$GITHUB_SHA" -- server ${control_paths[@]+"${control_paths[@]}"} 2>/dev/null || echo '')
          [[ "$head" =~ ^[0-9a-f]{40}$ ]] \
            || as_before "the newest server or release-control commit at $GITHUB_SHA could not be read"
          if [ "$head" = "$sealed" ] || git merge-base --is-ancestor "$head" "$sealed" 2>/dev/null; then
            nothing "main's newest server or release-control commit $head is the sealed build or behind it"
          fi
          git merge-base --is-ancestor "$sealed" "$head" 2>/dev/null \
            || as_before "the newest server or release-control commit $head does not descend from the sealed build"
          echo "POST-SEAL NEXT CANDIDATE: $sealed sealed and is serving; certifying $head, the newest server or release-control commit on main at $GITHUB_SHA, on a fresh copy with its rollback rehearsed against $sealed."
          { echo "### Backup Engine"; echo ""; echo "- POST-SEAL NEXT CANDIDATE \`$head\` (sealed and serving: \`$sealed\`); refresh forced."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "sha=$head" >> "$GITHUB_OUTPUT"
          echo "post_seal=1" >> "$GITHUB_OUTPUT"
      - id: plan
        if: github.event_name != 'repository_dispatch' || steps.next.outputs.sha != ''
        env:
          NEXT_SHA: ${{ steps.next.outputs.sha }}
          NEXT_FREEZE_BASELINE: ${{ steps.next.outputs.freeze_baseline }}
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          INPUT_REFRESH: ${{ github.event.inputs.refresh }}
          SEALED_SHA: ${{ steps.seal.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "not an exact sha: $sha"; exit 1; }
          # THE 04:00 BUILD IS CERTIFIED AGAINST THE FROZEN COPY (incident
          # 076ff467, 2026-11-19). Inside tonight's release schema freeze the
          # one shippable build is the newest server commit merged before the
          # freeze began, and only a certificate made on a copy restored after
          # the freeze began can pass the 03:30 contents judge. A push run is
          # otherwise superseded or retargeted to main's newest commit, which
          # the freeze makes unshippable, so the 04:00 cutover kept serving.
          # The first push or schedule run of the night certifies that build
          # once, refresh forced, never superseded (scripts/ci/backup-freeze-baseline.py).
          # Any answer but `due` plans exactly as before.
          if [ "$EVENT" = push ] || [ "$EVENT" = schedule ]; then
            tool=$(mktemp); baseline_state=unknown; baseline=''
            if gh api -H 'Accept: application/vnd.github.raw' "repos/${GITHUB_REPOSITORY:-}/contents/scripts/ci/backup-freeze-baseline.py?ref=main" > "$tool" 2>/dev/null; then
              verdict=$(python3 -B "$tool" --repo "${GITHUB_REPOSITORY:-}" 2>/dev/null) || verdict=''
              baseline_state=$(printf '%s\n' "$verdict" | sed -n 's/^state=//p')
              baseline=$(printf '%s\n' "$verdict" | sed -n 's/^baseline=//p')
            fi
            rm -f "$tool"
            echo "freeze baseline: ${baseline_state:-unknown}${baseline:+ ($baseline)}"
            # ONE CERTIFICATION PER BASELINE (incident 076ff467, 2026-11-20).
            # `claimed`: an active run is certifying it now; plan as before.
            # On `due` this run writes its claim (pending, naming this run)
            # before anything else, so a push merged while it soaks reads
            # `claimed` instead of queueing a duplicate that can publish a
            # refusal over the certificate minutes before the 03:30 selection.
            if [ "$baseline_state" = claimed ]; then
              echo "FREEZE BASELINE: $baseline is already being certified by an active run; planning as before."
            fi
            if [ "$baseline_state" = unselectable ]; then
              echo "FREEZE BASELINE: $baseline is unselectable (CONTROL_INPUTS diverged from main); skipping wasted certification and planning as before."
              { echo "### Backup Engine"; echo ""; echo "- FREEZE BASELINE \`$baseline\`: unselectable (\`CONTROL_INPUTS\` diverged from \`main\`); skipped wasted certification and planned as before."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
