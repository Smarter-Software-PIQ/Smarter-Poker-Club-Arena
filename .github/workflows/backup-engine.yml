                none|booking|booking_pending|candidate|predates) priority="$answer"; window=$(printf '%s\n' "$verdict" | sed -n 's/^window=//p') ;;
              esac
            fi
            rm -f "$tool"
            echo "owner window priority: $priority${window:+ ($window)}"
            if [ "$priority" = booking_pending ]; then
              # A post-booking push must not race onto the single Backup host
              # ahead of the booking commit while the booking commit is not yet
              # certified (T7, 2026-11-21). Nothing planned, no status written.
              echo "DEFERRED: owner engine window $window is booked and open on main, and its booking commit is not yet certified; post-booking push $sha yields the Backup host until the booking commit carries backup-engine/certified = success. Nothing planned, no status written."
              { echo "### Backup Engine"; echo ""; echo "- DEFERRED \`$sha\`: post-booking push yielded to uncertified booking commit of owner window \`$window\`; nothing built, no certificate written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "refresh=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$priority" = booking ]; then
              # The booking commit is the window's one deterministic candidate:
              # later ordinary pushes neither supersede nor replace it.
              echo "PRIORITY: $sha is the booking commit of open owner engine window $window; it is certified exactly and is not superseded or retargeted."
              { echo "### Backup Engine"; echo ""; echo "- PRIORITY \`$sha\`: booking commit of owner window \`$window\`; not superseded, not retargeted."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              newer=0
            else
            newer=$(gh api "repos/${GITHUB_REPOSITORY:-}/actions/workflows/backup-engine.yml/runs?event=push&branch=main&per_page=100" \
              --jq "[.workflow_runs[] | select(.id > $RUN_ID and .head_sha != \"$sha\")] | length" 2>/dev/null || echo unreadable)
            fi
            if [[ "$newer" =~ ^[0-9]+$ ]] && [ "$newer" -gt 0 ]; then
              echo "SUPERSEDED: $newer newer push run(s) of this workflow are already queued; $sha is no longer the newest engine push on main and the 04:00 cutover offers only the newest certified commit. Nothing planned, no status written; the Backup host goes to the newer run."
              { echo "### Backup Engine"; echo ""; echo "- SUPERSEDED \`$sha\`: $newer newer push run(s) queued; nothing built, no certificate written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "refresh=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$newer" =~ ^[0-9]+$ ]] || echo "could not read this workflow's newer push runs ($newer); proceeding as the newest push"
            # THE NEWEST PUSH RUN CERTIFIES WHAT CAN STILL SHIP (2026-11-07).
            # The release lane offers the newest main commit touching server/**
            # (stage-engine-release.yml TARGET_SHA, which always contains the
            # newest engine-runtime commit LATEST_REQUIRED) and admits the newest
            # certified commit at or behind it. When main already holds a newer
            # server commit than this push (its push run never came, or the
            # push head was not the server commit), certify that commit instead.
            # Only a strictly newer descendant replaces this push; anything
            # unreadable keeps the pushed commit, as before.
            repo="repos/${GITHUB_REPOSITORY:-}"
            if [ "$priority" = booking ]; then head="$sha"; else
            head=$(gh api "$repo/commits?sha=main&path=server&per_page=1" --jq '.[0].sha // ""' 2>/dev/null || echo unreadable)
            fi
            if [[ "$head" =~ ^[0-9a-f]{40}$ ]] && [ "$head" != "$sha" ]; then
              rel=$(gh api "$repo/compare/$sha...$head" --jq '.status' 2>/dev/null || echo unreadable)
              if [ "$rel" = ahead ]; then
                echo "RETARGETED: pushed $sha is superseded by $head, the newest server commit on main; certifying $head instead."
                { echo "### Backup Engine"; echo ""; echo "- RETARGETED \`$sha\` -> \`$head\` (newest server commit on main)."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
                sha="$head"
                retarget_control="$head"
              else
                echo "main's newest server commit $head is not a descendant of $sha ($rel); certifying $sha as pushed"
              fi
            fi
            # A commit whose release controls differ from main's cannot be the
            # open owner window's candidate (Stage refuses it). If it was not
            # retargeted to main's newest server commit, it must not occupy the
            # Backup host ahead of the candidate.
            if [ "$priority" = predates ] && [ -z "${retarget_control:-}" ]; then
              echo "DEFERRED: owner engine window $window is booked and open on main, and $sha carries release controls that differ from main's, so it can never be selected while the window is open. Nothing planned, no status written; the Backup host stays free for the window's candidate."
              { echo "### Backup Engine"; echo ""; echo "- DEFERRED \`$sha\`: predates open owner window \`$window\`; nothing built, no certificate written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "refresh=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Never certify twice: runs are serialized, so an earlier run for
            # this target has already finished. A success certificate stands;
            # a failure or a stale pending is certified again.
            state=$(gh api "$repo/commits/$sha/statuses?per_page=100" \
              --jq '[.[] | select(.context == "backup-engine/certified")][0].state // "missing"' 2>/dev/null || echo unreadable)
            if [ "$state" = success ]; then
              echo "ALREADY CERTIFIED: $sha already carries backup-engine/certified = success. Nothing planned, no status written."
              { echo "### Backup Engine"; echo ""; echo "- ALREADY CERTIFIED \`$sha\`: nothing built."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "refresh=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Only a push run that is still the newest may inherit a certificate.
            echo "priority=$priority" >> "$GITHUB_OUTPUT"
            echo "inherit_eligible=true" >> "$GITHUB_OUTPUT"
          fi
          # The refresh job decides from the standby's restore stamp whether a
          # refresh is due: forced, a new Chicago date, or a migration newer
          # than the copy. A schedule event certifies main after refreshing.
          refresh=auto
          [ "$INPUT_REFRESH" = true ] && refresh=force
          if [ "$EVENT" = schedule ]; then
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          fi
          if [ "$EVENT" = repository_dispatch ]; then
            sha="$SEALED_SHA"
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
            refresh=force
            # O24: the step above names the next candidate, tonight's freeze
            # baseline, or (unreadable) the sealed build itself.
            if [[ "${NEXT_SHA:-}" =~ ^[0-9a-f]{40}$ ]]; then sha="$NEXT_SHA"; fi
            if [ "${NEXT_FREEZE_BASELINE:-}" = 1 ]; then echo "freeze_baseline=1" >> "$GITHUB_OUTPUT"; fi
          fi
          if [ -n "${retarget_control:-}" ]; then echo "control_sha=$retarget_control" >> "$GITHUB_OUTPUT"; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"
      # The identity needs the candidate's trees and main's first-parent
      # history. Identity and qualification readers are checked out; tree inputs
      # and the Dockerfile are fetched on demand.
      - uses: actions/checkout@v4
        if: steps.plan.outputs.inherit_eligible == 'true'
        with:
          ref: ${{ steps.plan.outputs.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts/ci/engine-source-identity.sh
            scripts/ci/read-engine-prequalification.py
          sparse-checkout-cone-mode: false
      - name: Inherit the certificate of an identical engine source
        id: inherit
        if: steps.plan.outputs.inherit_eligible == 'true'
        env:
          SHA: ${{ steps.plan.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          DEPTH: '60'
        run: |
          set -euo pipefail
          inherited=false
          identity=$(bash scripts/ci/engine-source-identity.sh "$SHA") || identity=''
          if [[ ! "$identity" =~ ^[0-9a-f]{64}$ ]]; then
            echo "engine source identity of $SHA is unreadable; certifying in full"
            echo "inherited=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          qualification_inputs() {
            python3 -B -c 'import runpy,sys; m=runpy.run_path("scripts/ci/read-engine-prequalification.py"); print(m["backup_projection"](sys.argv[1]))' "$1"
          }
          inputs=$(qualification_inputs "$SHA") || {
            echo "Backup qualification inputs are unreadable; certifying in full"
            echo "inherited=false" >> "$GITHUB_OUTPUT"; exit 0
          }
          echo "engine source identity of $SHA: $identity"
          source=''; stopped=''
          for ancestor in $(git rev-list --first-parent --skip=1 --max-count="$DEPTH" "$SHA"); do
            # An ancestor whose identity cannot be read (it predates the
            # identity script, or its Dockerfile is missing) cannot be
            # identical to this candidate; it is passed over, never asked about.
            ancestor_identity=$(bash scripts/ci/engine-source-identity.sh "$ancestor" 2>/dev/null) || continue
            [ "$ancestor_identity" = "$identity" ] || continue
            # A changed authority/harness/schema is a boundary, not permission
            # to skip its verdict and inherit a still older physical proof.
            ancestor_inputs=$(qualification_inputs "$ancestor") || {
              stopped="$ancestor qualification inputs are unreadable"; break
            }
            if [ "$ancestor_inputs" != "$inputs" ]; then
              stopped="$ancestor qualification inputs differ"; break
            fi
            state=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ancestor/statuses?per_page=100" \
              --jq "[.[] | select(.context == \"$STATUS_CONTEXT\")][0].state // \"missing\"" 2>/dev/null) || state=unreadable
            case "$state" in
              success) source=$ancestor; break ;;
              missing|pending) echo "identical ancestor $ancestor has no verdict ($state); looking further back" ;;
              *) stopped="$ancestor is identical and its newest certificate is $state"; break ;;
            esac
          done
          if [ -z "$source" ]; then
            echo "no inherited certificate: ${stopped:-no identical ancestor within $DEPTH first-parent commits holds a success certificate}; certifying in full"
            echo "inherited=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          description="Inherited from $source: identical engine source (${identity:0:12})"
          if gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=success -f context="$STATUS_CONTEXT" \
               -f description="$description" \
               -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null; then
            inherited=true
            echo "INHERITED: $description. Nothing built; the Backup host is free for the next candidate."
            { echo "### Backup Engine"; echo ""; echo "- INHERITED \`$SHA\` <- \`$source\`: identical engine source \`$identity\`; nothing built, success certificate written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          else
            echo "could not write the inherited certificate on $SHA; certifying in full"
          fi
          echo "inherited=$inherited" >> "$GITHUB_OUTPUT"

  refresh:
    needs: plan
    if: needs.plan.outputs.sha != '' && (!((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) || (github.event_name == 'repository_dispatch' && github.event.action == 'run-post-deploy-e2e') || (github.event_name == 'workflow_dispatch' && inputs.after_cycle != '')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: ci-main
    # Whether this run ever held the Backup host. A run that never got its
    # turn touched no copy and tested nothing (incident 076ff467, 2026-11-20).
    outputs:
      turn: ${{ steps.turn.outputs.acquired }}
      deferred: ${{ (steps.turn.outputs.superseded == '1' || steps.late_inherit.outputs.inherited == '1' || steps.due.outputs.deferred == '1' || steps.late_priority.outputs.deferred == '1') && '1' || '' }}
      sha: ${{ steps.due.outputs.sha || steps.late_retarget.outputs.sha || needs.plan.outputs.sha }}
      control_sha: ${{ steps.late_retarget.outputs.control_sha || needs.plan.outputs.control_sha }}
    timeout-minutes: 180
    steps:
      - name: Prove a job-token dispatch is the exact intent its trusted sender recorded
        if: ((endsWith(github.actor, '[bot]') && github.actor != 'smarter-poker-autopilot[bot]') || (endsWith(github.triggering_actor, '[bot]') && github.triggering_actor != 'smarter-poker-autopilot[bot]')) && (github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # scripts/ci/dispatch-intent.mjs: sender run, artifact, exact inputs and one-time title.
          # One transient provider answer must not fail a certification
          # (run 43565758486, HTTP 502): a 5xx or network error is retried a
          # bounded number of times inside this step; a 4xx fails at once.
          fetched=0
          for wait in 0 5 15 30; do
            sleep "$wait"
            if gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/scripts/ci/dispatch-intent.mjs?ref=$GITHUB_SHA" > "$RUNNER_TEMP/dispatch-intent.mjs" 2> "$RUNNER_TEMP/dispatch-intent.err"; then fetched=1; break; fi
            cat "$RUNNER_TEMP/dispatch-intent.err" >&2
            if grep -Eq 'HTTP 4[0-9][0-9]' "$RUNNER_TEMP/dispatch-intent.err"; then break; fi
          done
          [ "$fetched" = 1 ] || { echo "::error::could not fetch scripts/ci/dispatch-intent.mjs"; exit 1; }
