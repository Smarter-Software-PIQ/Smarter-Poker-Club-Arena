          done
      # IN-PLACE RETARGET AFTER LEASE ACQUISITION (2026-11-21, O2).
      # Once this push run holds the exclusive Backup host turn, never drop
      # the lease merely because a newer push arrived on main while it waited.
      # Instead, check main's newest server commit: when it descends from SHA
      # and GITHUB_SHA, preserves .github/workflows/backup-engine.yml, and is
      # not already certified, retarget in-place (updating SHA, CONTROL_SHA,
      # and the sparse checkout) so late_inherit, due, late_priority, and
      # certify operate on the newest server commit without forcing another
      # runner to re-acquire. Booking, freeze-baseline, manual, nightly, and
      # post-seal runs never retarget; unreadable answers keep SHA unchanged
