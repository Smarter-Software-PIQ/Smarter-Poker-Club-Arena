          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.plan.outputs.sha }}
          CONTROL_SHA: ${{ needs.plan.outputs.control_sha }}
          PLAN_PRIORITY: ${{ needs.plan.outputs.priority }}
        run: |
          set -euo pipefail
          target_sha="$SHA"
          target_control="$CONTROL_SHA"
          retargeted=0
          priority=unknown; window=''
          tool=$(mktemp)
          trap 'rm -f "$tool"' EXIT
          if gh api -H 'Accept: application/vnd.github.raw' "repos/${GITHUB_REPOSITORY:-}/contents/scripts/ci/backup-candidate-priority.py?ref=$GITHUB_SHA" > "$tool" 2>/dev/null; then
