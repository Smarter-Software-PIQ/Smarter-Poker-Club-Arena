            # A waiting push run yields cleanly ONLY when a strictly newer ACTIVE
            # (non-completed) push run exists with a different head AND a
            # different engine-source-identity (or changed backup-engine.yml),
            # without holding the lease or writing an error status. Completed
            # runs and identical-source pushes never disrupt a waiting run;
            # booking and freeze-baseline runs never supersede; unreadable API
            # or git answers keep waiting (CLAUDE.md 10.86).
            if [ "${EVENT:-}" = push ] && [ "${FREEZE_BASELINE:-}" != 1 ] && [ "${PLAN_PRIORITY:-}" != booking ] && [[ "${RUN_ID:-}" =~ ^[0-9]+$ ]]; then
