            esac
          done
          if [ -z "$source" ]; then
            echo "no late inherited certificate: ${stopped:-no identical ancestor within $DEPTH first-parent commits holds a success certificate}; certifying in full"
            echo "inherited=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
