              "python3 - '$RUN_ID' '$RUN_ATTEMPT' '$reclaim'" <<'PY'
          import fcntl, json, os, sys, time
          run_id, attempt, reclaim = sys.argv[1], sys.argv[2], sys.argv[3]
          lease_path = '/var/lib/club-arena-standby/run-lease.json'
          os.makedirs('/var/lib/club-arena-standby', exist_ok=True)
          os.makedirs('/var/lock', exist_ok=True)
          with open('/var/lock/club-arena-standby-lease.lock', 'w') as lf:
              fcntl.flock(lf, fcntl.LOCK_EX)
              now = int(time.time())
              cur = None
              if os.path.exists(lease_path):
                  try:
                      cur = json.load(open(lease_path))
                  except Exception:
                      cur = None
              if (cur is None
                  or (str(cur.get('runId')) == run_id and str(cur.get('attempt')) == attempt)
                  or int(cur.get('expiresAt', 0)) <= now
                  or (reclaim and str(cur.get('runId')) == reclaim)):
                  tmp = lease_path + '.tmp'
                  with open(tmp, 'w') as f:
                      json.dump({'runId': run_id, 'attempt': attempt, 'acquiredAt': now, 'expiresAt': now + 9000}, f)
                  os.replace(tmp, lease_path)
                  print('acquired')
              else:
                  print('held:' + str(cur.get('runId', 'unknown')))
          PY
