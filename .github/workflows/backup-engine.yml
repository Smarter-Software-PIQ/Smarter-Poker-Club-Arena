          # keep-serving certification; the seal's repository_dispatch is the other.
          if [ "${GITHUB_EVENT_NAME:-}" = workflow_dispatch ]; then
            node "$RUNNER_TEMP/dispatch-intent.mjs" prove --receiver backup-after-keep-serving
          else
            node "$RUNNER_TEMP/dispatch-intent.mjs" prove --receiver backup-after-seal
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.plan.outputs.control_sha }}
          filter: blob:none
          sparse-checkout: |
            .github/pgdg
            .github/actions/install-postgres-17
            scripts/ci/engine-source-identity.sh
            scripts/ci/read-engine-prequalification.py
            scripts/ci/ubuntu-apt.sh
            scripts/ci/ubuntu-apt-mirror.py
            scripts/ci/ubuntu-apt-mirrors.txt
            scripts/dr
            scripts/release/step-down-past-held-migration.py
            scripts/verification-harness/leaderboard-native-function-batch.mjs
            scripts/ci/test_native_supabase_export.py
            server/scripts/engine-release-installed-migrations.py
            server/standby
            supabase/migrations
      - name: Acquire exclusive Backup host turn
        id: turn
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ needs.plan.outputs.sha }}
          FREEZE_BASELINE: ${{ needs.plan.outputs.freeze_baseline }}
          PLAN_PRIORITY: ${{ needs.plan.outputs.priority }}
          POST_SEAL: ${{ needs.plan.outputs.post_seal }}
          KEEP_SERVING: ${{ github.event_name == 'workflow_dispatch' && inputs.after_cycle != '' && inputs.sha == '' && '1' || '' }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh; printf '%s\n' "$SSH_KEY" > ~/.ssh/standby; chmod 600 ~/.ssh/standby
          printf '%s\n' "$STANDBY_HOST_KEY" > ~/.ssh/known_hosts
          # 120-minute lease-wait ceiling (raised from 75 min on 2026-11-21, E3)
          # so a queued candidate behind an active refresh + 55-min soak does not
          # starve right before its turn; lease TTL is 150 min (> refresh + 75m certify).
          deadline=$(($(date +%s) + 7200))
          reclaim=''
          priority_tool=$(mktemp)
          trap 'rm -f "$priority_tool"' EXIT
          while true; do
            verdict=$(ssh -i ~/.ssh/standby -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "root@$STANDBY_HOST" \
              "python3 - '$RUN_ID' '$RUN_ATTEMPT' '$reclaim'" <<'PY'
          import fcntl, json, os, sys, time
          run_id, attempt, reclaim = sys.argv[1], sys.argv[2], sys.argv[3]
          lease_path = '/var/lib/club-arena-standby/run-lease.json'
          os.makedirs('/var/lib/club-arena-standby', exist_ok=True)
          os.makedirs('/var/lock', exist_ok=True)
          with open('/var/lock/club-arena-standby-lease.lock', 'w') as lf:
              fcntl.flock(lf, fcntl.LOCK_EX)
              now = int(time.time())
              cur = None
              if os.path.exists(lease_path):
                  try:
                      cur = json.load(open(lease_path))
                  except Exception:
                      cur = None
              if (cur is None
                  or (str(cur.get('runId')) == run_id and str(cur.get('attempt')) == attempt)
                  or int(cur.get('expiresAt', 0)) <= now
                  or (reclaim and str(cur.get('runId')) == reclaim)):
                  tmp = lease_path + '.tmp'
                  with open(tmp, 'w') as f:
                      json.dump({'runId': run_id, 'attempt': attempt, 'acquiredAt': now, 'expiresAt': now + 9000}, f)
                  os.replace(tmp, lease_path)
                  print('acquired')
              else:
                  print('held:' + str(cur.get('runId', 'unknown')))
          PY
            )
            reclaim=''
            if [ "$verdict" = acquired ]; then
              echo "Acquired exclusive Backup host turn for run $RUN_ID-$RUN_ATTEMPT."
              echo "acquired=1" >> "$GITHUB_OUTPUT"
              break
            fi
            # LATE SUPERSESSION WHILE WAITING (2026-11-21, E3; hardened O2, O11).
            # A waiting push run yields cleanly ONLY when a strictly newer ACTIVE
            # (non-completed) push run exists with a different head AND a
            # different engine-source-identity, different backup_projection, or
            # changed backup-engine.yml, without holding the lease or writing an
            # error status. Completed runs and inheritable pushes (identical
            # engine-source-identity, identical backup_projection, unchanged
            # backup-engine.yml) never disrupt a waiting run; booking and
            # freeze-baseline runs never supersede; unreadable API, git, or
            # projection answers keep waiting (CLAUDE.md 10.86). A post-seal
            # next-candidate run (O24) yields to a newer push run the same way.
            # So does a keep-serving next-candidate run (O27, workflow_dispatch
            # with after_cycle and no sha): it certifies main for the next cycle
            # exactly like a post-seal run. Before 2026-11-26 it never yielded:
            # run 45883490551 waited the whole 120-minute ceiling behind two
            # newer push runs that certified main (the second sealed the 16:00
            # CST cycle), then timed out red and wrote an `error` status.
            if { [ "${EVENT:-}" = push ] || [ "${POST_SEAL:-}" = 1 ] || [ "${KEEP_SERVING:-}" = 1 ]; } && [ "${FREEZE_BASELINE:-}" != 1 ] && [ "${PLAN_PRIORITY:-}" != booking ] && [[ "${RUN_ID:-}" =~ ^[0-9]+$ ]]; then
