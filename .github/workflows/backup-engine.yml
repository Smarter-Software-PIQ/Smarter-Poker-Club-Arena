                 && git merge-base --is-ancestor "$SHA" "$head" 2>/dev/null \
                 && git merge-base --is-ancestor "$GITHUB_SHA" "$head" 2>/dev/null \
                 && git merge-base --is-ancestor "$head" refs/remotes/origin/main 2>/dev/null; then
