            echo "inherited=0" >> "$GITHUB_OUTPUT"
          fi
      # THE COPY IS JUDGED BY WHAT IT HOLDS (2026-11-08). Backup 42519319251
      # restored at 20:38:05Z; migration 20261108193515 (merged 20:36:58Z)
      # installed at 20:38:11Z, and "newest migration commit <= restoredAt"
      # called the copy fresh. Due is decided by contents: the copy's own
      # schema evidence (installed set and required definitions, bound to its
      # dump by the export) against production's, read now through
      # DATABASE_URL. A copy with no bound evidence, or an unreadable answer,
      # is always due. Before reading, it waits (bounded) for migration files
      # main merged in the last day that production has not installed yet, so
      # a refresh does not copy in the minute before Apply Merged Migration.
      # Commit and restore times are printed as diagnostics only.
      - name: Decide whether the production copy is due
        id: due
        if: steps.turn.outputs.acquired == '1' && steps.late_inherit.outputs.inherited != '1'
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ needs.plan.outputs.refresh }}
          EVENT: ${{ github.event_name }}
          CONTROL: ${{ steps.late_retarget.outputs.control_sha || needs.plan.outputs.control_sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          SHA: ${{ steps.late_retarget.outputs.sha || needs.plan.outputs.sha }}
          FREEZE_BASELINE: ${{ needs.plan.outputs.freeze_baseline }}
          PLAN_PRIORITY: ${{ needs.plan.outputs.priority }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh; printf '%s\n' "$SSH_KEY" > ~/.ssh/standby; chmod 600 ~/.ssh/standby
          printf '%s\n' "$STANDBY_HOST_KEY" > ~/.ssh/known_hosts
