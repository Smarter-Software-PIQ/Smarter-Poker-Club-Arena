          SHA: ${{ steps.late_retarget.outputs.sha || needs.plan.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
