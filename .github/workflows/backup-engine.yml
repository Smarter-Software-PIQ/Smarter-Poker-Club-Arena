name: Backup Engine (Clone, Stage, Certify)

# THE BACKUP ENGINE (owner order 2026-11-05). A 1:1 clone of the serving
# engine runs on its own Hetzner host against an isolated copy of the
# production database structure. Every engine change lands here first and is
# built, booted, crash-tested and soaked while the live engine keeps running.
# A version that passes gets the commit status "backup-engine/certified"; the
# 04:00 Chicago cutover accepts only a certified version. Nothing here can
# touch the live engine, its host, or production data: the standby host holds
# no production credential and its runtime network cannot reach the internet.
#
#   push to main (server tree)  certify the new main
#   00:01 Chicago nightly        refresh the production structure and seed,
#                                re-clone the serving engine, certify main
#   workflow_dispatch            certify one exact SHA
#   sealed release (workflow_run) re-clone the serving engine (1:1 Backup)
#
# THE QUEUE DRAINS ITSELF (2026-11-07). Runs are serialized (one Backup host)
# and a certificate takes about forty-five minutes, while main receives
# engine pushes every few minutes. Each push queues its own run, so by the
# time a queued push run starts, a newer push has usually replaced its
# commit: the 04:00 cutover offers the NEWEST certified main commit, so the
# older one would be certified for nothing while the post-seal clone refresh
# waited hours behind it (4.5 h on 2026-11-07). The plan job therefore asks
# GitHub whether a newer push run of this workflow exists; if so the run
# ends in seconds with nothing planned and no status written (the commit
# stays uncertified, exactly as if its turn had never come). Only push runs
# are skipped: a manual, nightly or post-seal clone refresh is never skipped,
# and when GitHub cannot be read the run proceeds as before (CLAUDE.md
# 10.86: an unreadable answer is not a "yes").
on:
  workflow_run:
    workflows: ['Auto-Deploy Hetzner Engine (on server/ changes)']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/engine-release-prequalification.yml'
      - '.github/workflows/stage-engine-release.yml'
      - '.github/workflows/auto-deploy-hetzner.yml'
      - '.github/workflows/backup-engine.yml'
      - 'scripts/ci/read-engine-prequalification.py'
      - 'scripts/ci/prestage-engine-image.sh'
      - 'scripts/ci/select-daily-engine.py'
      - 'scripts/ci/check-engine-doors-exist.mjs'
      - 'scripts/ci/window-migration-doors.mjs'
      - 'scripts/ci/record-engine-deploy-attempt.mjs'
      - 'scripts/ci/record-engine-deploy-exit.mjs'
  schedule:
    # Nightly refresh after midnight America/Chicago (05 UTC is CDT, 06 UTC
    # is CST). GitHub has delivered schedules hours late or not at all, so
    # there are three chances per DST twin; the refresh itself runs once per
    # Chicago date (it reads the standby's own restore stamp).
    - cron: '7,23,41 5 * * *'
    - cron: '7,23,41 6 * * *'
  workflow_dispatch:
    inputs:
      sha:
        description: 'Exact 40-hex commit to certify (default: main)'
        required: false
        type: string
      refresh:
        description: 'Refresh the production structure and seed first'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  statuses: write

concurrency:
  group: backup-engine
  queue: max
  cancel-in-progress: false

env:
  # The Backup Engine host (club-arena-engine-standby). Firewall: SSH key-only.
  STANDBY_HOST: 5.161.236.0
  # Pinned host key, so the lane never trusts a substituted machine.
  STANDBY_HOST_KEY: '5.161.236.0 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIRbg+oBuQofVZ4KWwVB9IK0vPU26+DjidHmQQ3Dprom'
  STATUS_CONTEXT: backup-engine/certified

jobs:
  plan:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      refresh: ${{ steps.plan.outputs.refresh }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_SHA: ${{ github.event.inputs.sha }}
          INPUT_REFRESH: ${{ github.event.inputs.refresh }}
          RELEASE_TITLE: ${{ github.event.workflow_run.display_title }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-$GITHUB_SHA}"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "not an exact sha: $sha"; exit 1; }
          # A queued push run whose commit a newer push has already replaced
          # is superseded: a newer push run of this workflow (any state) exists.
          # Runs are serialized FIFO, so a newer run can only be queued or
          # running when this one starts; its id is always larger. Only push
          # runs are judged; an unreadable answer means "not superseded".
          if [ "$EVENT" = push ] && [[ "${RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            newer=$(gh api "repos/${GITHUB_REPOSITORY:-}/actions/workflows/backup-engine.yml/runs?event=push&branch=main&per_page=100" \
              --jq "[.workflow_runs[] | select(.id > $RUN_ID and .head_sha != \"$sha\")] | length" 2>/dev/null || echo unreadable)
            if [[ "$newer" =~ ^[0-9]+$ ]] && [ "$newer" -gt 0 ]; then
              echo "SUPERSEDED: $newer newer push run(s) of this workflow are already queued; $sha is no longer the newest engine push on main and the 04:00 cutover offers only the newest certified commit. Nothing planned, no status written; the Backup host goes to the newer run."
              { echo "### Backup Engine"; echo ""; echo "- SUPERSEDED \`$sha\`: $newer newer push run(s) queued; nothing built, no certificate written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "sha=" >> "$GITHUB_OUTPUT"
              echo "refresh=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            [[ "$newer" =~ ^[0-9]+$ ]] || echo "could not read this workflow's newer push runs ($newer); proceeding as the newest push"
          fi
          # The refresh job decides from the standby's restore stamp whether a
          # refresh is due: forced, a new Chicago date, or a migration newer
          # than the copy. A schedule event certifies main after refreshing.
          refresh=auto
          [ "$INPUT_REFRESH" = true ] && refresh=force
          if [ "$EVENT" = schedule ]; then
            sha=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          fi
          if [ "$EVENT" = workflow_run ]; then
            # A successful sealed receiver is the event that refreshes Backup.
            # Refused, cancelled, observation and withdrawal runs never do so.
            sha="${RELEASE_TITLE#Engine Release }"
            [[ "$RELEASE_TITLE" = "Engine Release $sha" && "$sha" =~ ^[0-9a-f]{40}$ ]] || exit 1
            served=$(curl -fsS --max-time 15 https://engine.smarter.poker/health | python3 -c 'import json,sys;print(json.load(sys.stdin).get("releaseSha",""))')
            [ "$served" = "$sha" ] || { echo 'Sealed release is no longer serving; refusing a stale clone refresh'; exit 1; }
            refresh=force
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "refresh=$refresh" >> "$GITHUB_OUTPUT"

  refresh:
    needs: plan
    if: needs.plan.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            scripts/dr
            scripts/verification-harness/leaderboard-native-function-batch.mjs
            scripts/ci/test_native_supabase_export.py
            server/standby
            supabase/migrations
      - name: Decide whether the production copy is due
        id: due
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          MODE: ${{ needs.plan.outputs.refresh }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh; printf '%s\n' "$SSH_KEY" > ~/.ssh/standby; chmod 600 ~/.ssh/standby
          printf '%s\n' "$STANDBY_HOST_KEY" > ~/.ssh/known_hosts
          owners_sha=$(sha256sum server/standby/standby-owners.sql | cut -d' ' -f1)
          stamp=$(ssh -i ~/.ssh/standby "root@$STANDBY_HOST" "python3 -c 'import json;print((lambda d,s: d[\"restoredAt\"] if d.get(\"ownersSha256\") == \"$owners_sha\" and d.get(\"restoreValidated\") is True and d.get(\"restoreErrors\") == 0 and s.get(\"tablesFailed\") == 0 and s[\"seededAt\"] >= d[\"restoredAt\"] else \"1970-01-01T00:00:00Z\")(json.load(open(\"/var/lib/club-arena-standby/database.json\")),json.load(open(\"/var/lib/club-arena-standby/seed.json\"))))'" 2>/dev/null || echo 1970-01-01T00:00:00Z)
          restored=$(date -d "$stamp" +%s)
          newest=$(git log -1 --format=%ct origin/main -- supabase/migrations 2>/dev/null || echo 0)
          today=$(TZ=America/Chicago date +%F); copy_day=$(TZ=America/Chicago date -d "$stamp" +%F)
          due=false
          [ "$MODE" = force ] && due=true
          [ "$newest" -gt "$restored" ] && due=true
          [ "$EVENT" = schedule ] && [ "$copy_day" != "$today" ] && due=true
          echo "copy=$stamp newestMigration=$(date -u -d @$newest +%FT%TZ) due=$due"
          echo "due=$due" >> "$GITHUB_OUTPUT"
      - name: Build the batched read-only export client
        if: steps.due.outputs.due == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-17 postgresql-client-17 libzstd-dev zstd pkg-config >/dev/null 2>&1 \
            || { sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'; \
                 curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg; \
                 sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-17 postgresql-client-17 libzstd-dev zstd pkg-config >/dev/null; }
          python3 scripts/dr/build-native-export-client.py --scratch "$RUNNER_TEMP" --pg-bin /usr/lib/postgresql/17/bin > client.log 2>&1 || true
          PG_DUMP=$(find "$RUNNER_TEMP" -path '*src/bin/pg_dump/pg_dump' -type f -perm -u+x | head -1)
          [ -n "$PG_DUMP" ] || { tail -40 client.log; exit 1; }
          echo "PG_DUMP=$PG_DUMP" >> "$GITHUB_ENV"
          echo "PG_LIB=$(dirname "$(dirname "$(dirname "$PG_DUMP")")")/interfaces/libpq" >> "$GITHUB_ENV"
      - name: Export the production structure and the horse-only seed (read-only, short reads)
        if: steps.due.outputs.due == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out/seed"
          # A held snapshot over five minutes is cancelled by production's guard,
          # and must never happen anyway: bounded at 270 s.
          PGOPTIONS='-c default_transaction_read_only=on' LD_LIBRARY_PATH="$PG_LIB" timeout 270 "$PG_DUMP" "$DATABASE_URL" \
            --schema-only --no-owner --lock-wait-timeout=2000 -Fc \
            -n public -n ca_archive -n discovery_private -n operational_source_intake -n ops -n ops_rollback -n smarter_private -n zz_archive \
            -f "$RUNNER_TEMP/out/schema.dump"
          SEED_DATABASE_URL="$DATABASE_URL" python3 server/standby/seed-extract.py "$RUNNER_TEMP/out/seed"
          tar -C "$RUNNER_TEMP/out" -czf "$RUNNER_TEMP/bundle.tgz" schema.dump seed
      - name: Ship to the standby host and restore
        if: steps.due.outputs.due == 'true'
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/standby "$RUNNER_TEMP/bundle.tgz" "root@$STANDBY_HOST:/var/lib/club-arena-standby/bundle.tgz"
          ssh -i ~/.ssh/standby "root@$STANDBY_HOST" 'set -e; cd /var/lib/club-arena-standby; rm -rf seed; tar -xzf bundle.tgz;
            git -C /opt/club-arena fetch -q origin; git -C /opt/club-arena show origin/main:server/standby/standby-engine.sh > /usr/local/sbin/standby-engine; chmod +x /usr/local/sbin/standby-engine; mkdir -p /usr/local/share/club-arena-standby; git -C /opt/club-arena show origin/main:server/standby/standby-owners.sql > /usr/local/share/club-arena-standby/owners.sql; git -C /opt/club-arena show origin/main:server/standby/standby-placeholders.sql > /usr/local/share/club-arena-standby/placeholders.sql && git -C /opt/club-arena show origin/main:server/standby/standby-trials.sh > /usr/local/share/club-arena-standby/standby-trials.sh && git -C /opt/club-arena show origin/main:server/standby/qualify-tournament-freeze-fixes.py > /usr/local/share/club-arena-standby/qualify-tournament-freeze-fixes.py;
            standby-engine restore schema.dump; standby-engine seed seed'

  certify:
    needs: [plan, refresh]
    # Publish a failure for this exact SHA if refresh failed, including when a
    # previous attempt left a success status. Never certify a partial copy.
    if: always() && needs.plan.outputs.sha != ''
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Mark the certification pending
        env: { GH_TOKEN: '${{ github.token }}', SHA: '${{ needs.plan.outputs.sha }}' }
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$STATUS_CONTEXT" \
            -f description='Backup Engine is building, booting and soaking this version' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          sparse-checkout: server/scripts
      - name: Check the protected activation policy before spending a Backup soak
        env:
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          git merge-base --is-ancestor "$SHA" "$GITHUB_SHA"
          python3 -B server/scripts/engine-release-activation-floor.py daily-compatibility \
            --repo . --target "$SHA" --control "$GITHUB_SHA" --deadline 0 > compatibility.json
      - name: Build, boot, crash, soak and judge on the Backup Engine
        id: certify
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SHA: ${{ needs.plan.outputs.sha }}
          REFRESH_RESULT: ${{ needs.refresh.result }}
        run: |
          set -uo pipefail
          if [ "$REFRESH_RESULT" != success ]; then
            printf '%s\n' '{"reasons":["database_refresh_failed"]}' > certificate.json
            echo 'rc=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh; printf '%s\n' "$SSH_KEY" > ~/.ssh/standby; chmod 600 ~/.ssh/standby
          printf '%s\n' "$STANDBY_HOST_KEY" > ~/.ssh/known_hosts
          if ssh -i ~/.ssh/standby -o ServerAliveInterval=30 "root@$STANDBY_HOST" \
            "git -C /opt/club-arena fetch -q origin && git -C /opt/club-arena show $GITHUB_SHA:server/standby/standby-engine.sh > /usr/local/sbin/standby-engine && chmod +x /usr/local/sbin/standby-engine && mkdir -p /usr/local/share/club-arena-standby && git -C /opt/club-arena show $GITHUB_SHA:server/standby/standby-owners.sql > /usr/local/share/club-arena-standby/owners.sql && git -C /opt/club-arena show $GITHUB_SHA:server/standby/standby-placeholders.sql > /usr/local/share/club-arena-standby/placeholders.sql && git -C /opt/club-arena show $GITHUB_SHA:server/standby/standby-trials.sh > /usr/local/share/club-arena-standby/standby-trials.sh && git -C /opt/club-arena show $GITHUB_SHA:server/standby/qualify-tournament-freeze-fixes.py > /usr/local/share/club-arena-standby/qualify-tournament-freeze-fixes.py && standby-engine certify $SHA 1800" \
            | tee certificate.out; then rc=0; else rc=1; fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          tail -1 certificate.out > certificate.json || true
          exit 0
      - name: Retain exact Backup schema, seed, policy and trial evidence
        if: steps.certify.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: backup-certificate-${{ needs.plan.outputs.sha }}-${{ github.run_attempt }}
          path: |
            certificate.json
            compatibility.json
          if-no-files-found: error
      - name: Publish the verdict on the exact commit
        if: always()
        env:
          {
            GH_TOKEN: '${{ github.token }}',
            SHA: '${{ needs.plan.outputs.sha }}',
            RC: '${{ steps.certify.outputs.rc }}',
            JOB_STATUS: '${{ job.status }}',
          }
        run: |
          set -euo pipefail
          if [ "$RC" = 0 ] && [ "$JOB_STATUS" = success ]; then state=success; desc='Certified on the Backup Engine: built, booted, crash-recovered and soaked'
          else state=failure; desc="Backup Engine refused: $(python3 -c 'import json;print(",".join(json.load(open("certificate.json")).get("reasons",[]))[:120])' 2>/dev/null || echo see run)"; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$STATUS_CONTEXT" -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          echo "$state: $desc"
          [ "$state" = success ]
