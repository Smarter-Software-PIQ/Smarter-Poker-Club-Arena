          # success with pending creates a 50-minute selection blackout. Only
          # write pending when current is missing|pending|failure|error.
          current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" \
            --jq "[.[] | select(.context == \"$STATUS_CONTEXT\")][0].state // \"missing\"" 2>/dev/null) || current=unreadable
          case "$current" in
            missing|pending|failure|error)
              gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state=pending -f context="$STATUS_CONTEXT" \
                -f description='Backup Engine is building, booting and soaking this version' \
                -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
              echo "wrote=1" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "PRESERVED: $SHA already holds $STATUS_CONTEXT = success (or status unreadable: $current); skipping pending overwrite so selection is never blacked out during re-certification."
              echo "wrote=0" >> "$GITHUB_OUTPUT"
              ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.refresh.outputs.control_sha || needs.plan.outputs.control_sha }}
          fetch-depth: 0
          sparse-checkout: |
            scripts/ci/read-engine-prequalification.py
            server/scripts
            server/standby/schema-evidence.py
          sparse-checkout-cone-mode: false
      - name: Check the protected activation policy before spending a Backup soak
        id: policy
        env:
          SHA: ${{ needs.refresh.outputs.sha || needs.plan.outputs.sha }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" "$CONTROL_SHA"
          git merge-base --is-ancestor "$CONTROL_SHA" refs/remotes/origin/main
          git diff --quiet "$GITHUB_SHA" "$CONTROL_SHA" -- .github/workflows/backup-engine.yml
          git merge-base --is-ancestor "$SHA" "$CONTROL_SHA"
          python3 -B server/scripts/engine-release-activation-floor.py daily-compatibility \
            --repo . --target "$SHA" --control "$CONTROL_SHA" --deadline 0 > compatibility.json
      - name: Build, boot, crash, soak and judge on the Backup Engine
        id: certify
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          SHA: ${{ needs.refresh.outputs.sha || needs.plan.outputs.sha }}
          REFRESH_RESULT: ${{ needs.refresh.result }}
          EVENT: ${{ github.event_name }}
          FREEZE_BASELINE: ${{ needs.plan.outputs.freeze_baseline }}
          PLAN_PRIORITY: ${{ needs.plan.outputs.priority }}
          POST_SEAL: ${{ needs.plan.outputs.post_seal }}
          SEALED_SHA: ${{ needs.plan.outputs.sealed_sha }}
          KEEP_SERVING: ${{ github.event_name == 'workflow_dispatch' && inputs.after_cycle != '' && inputs.sha == '' && '1' || '' }}
          RUN_ID: ${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -uo pipefail
          if [ "$REFRESH_RESULT" != success ]; then
            printf '%s\n' '{"reasons":["database_refresh_failed"]}' > certificate.json
            echo 'rc=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          install -m 700 -d ~/.ssh; printf '%s\n' "$SSH_KEY" > ~/.ssh/standby; chmod 600 ~/.ssh/standby
          printf '%s\n' "$STANDBY_HOST_KEY" > ~/.ssh/known_hosts
          # MID-SOAK YIELD FOR OBSOLETE UNSELECTABLE PUSH RUNS (2026-11-21, O1).
          # Keep cmd_certify on the offline standby host completely network-free:
          # run SSH certify in the background on this GitHub Actions runner while
          # a bounded runner-side check runs every 60 s for non-booking,
          # non-freeze-baseline push runs. Yield cleanly (stop standby container,
          # exit 0, write NO failure/error status) ONLY when ALL FOUR hold:
          #   (a) a newer active push run of backup-engine.yml is queued/in_progress on main,
          #   (b) projection(SHA) on origin/main already differs from SHA, or
          #       supabase/migrations differs AND production now holds a migration
          #       (or required definition) the soaking copy lacks (O16),
          #   (c) the time to the next scheduled 3-hourly/daily cutoff could be read
          #       (it is reported; since O35 it no longer has to be under 75 minutes),
          #   (d) every read succeeded (unreadable -> keep soaking, CLAUDE.md 10.86).
          #
          # AN UNSELECTABLE SOAK YIELDS AT ONCE, HOWEVER FAR THE CUTOFF (2026-11-26, O35).
          # Until O35 the yield also required fewer than 75 minutes to the next
          # cutoff. Backup 45938154669 began soaking e21eb7d915ed at 22:09 Chicago
          # on a copy read at 22:08; migrations 20261127005018 and 20261126222226
          # merged in the 22:10 merge window and installed at 22:13 and 22:16,
          # so from 22:16 that certificate could never be selected. The cutoff was
          # 134 minutes away, so the soak ran to 22:54 and the run for the
          # selectable commit (45940769729) waited 38 minutes for the host: one
          # attempt was left for the 01:00 cycle instead of two. A copy production
          # has moved past, or a diverged release-control projection, never
          # becomes selectable again by waiting, so with (a), (b) and (d) the
          # soak stops whatever the clock says.
          #
          # A NEW MIGRATION FILE IS NOT A NEW INSTALL (2026-11-23, O16). At
          # 02:44:02Z Backup 45099104481 stopped certifying a9fde5791f0a sixteen
          # seconds after main gained 20261123002808 (f2fa22672808), which
          # merged inside the O3 deferral (02:30-04:10Z): the dispatcher was
          # holding it and production had not installed it, so the soak was
          # still a selectable candidate when it was stopped. (Its author then
          # recorded that version by hand at 02:49Z as held, so the cycle was
          # lost either way; the yield rule was still wrong.) The selector
          # judges the copy against production's INSTALLED set, so a
          # migration-only divergence now yields only once production actually
          # holds a version or required definition the copy lacks (the same
          # refresh-due comparison the refresh job makes, read-only). Deferred,
          # window or unreadable answers keep soaking. The nightly freeze holds
          # migrations merged after 23:45 Chicago the same way.
          o1_copy_state() {
            local evidence_sha verdict due_answer production_digest
            ssh -i ~/.ssh/standby -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "root@$STANDBY_HOST" \
              'cat /var/lib/club-arena-standby/schema-evidence.json' > o1-copy-evidence.json 2>/dev/null || : > o1-copy-evidence.json
            evidence_sha=$(ssh -i ~/.ssh/standby -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "root@$STANDBY_HOST" \
              "python3 -c 'import json;print(json.load(open(\"/var/lib/club-arena-standby/database.json\")).get(\"schemaEvidenceSha256\") or \"\")'" 2>/dev/null) || evidence_sha=''
            if ! [ -s o1-copy-evidence.json ] || ! [[ "$evidence_sha" =~ ^[0-9a-f]{64}$ ]]; then
              echo unreadable
              return 0
            fi
            verdict=$(python3 -B server/scripts/engine-release-installed-migrations.py refresh-due \
              --copy-evidence o1-copy-evidence.json --copy-evidence-sha "$evidence_sha" \
              --control "${CONTROL_SHA:-}" 2> o1-copy-reason.txt) || verdict=''
            due_answer=$(printf '%s\n' "$verdict" | sed -n 's/^due=//p')
            production_digest=$(printf '%s\n' "$verdict" | sed -n 's/^production=//p')
            if ! [[ "$production_digest" =~ ^[0-9a-f]{64}$ ]]; then
              echo unreadable
            elif [ "$due_answer" = false ]; then
              echo current
            elif grep -qE "lacks installed migration|does not hold production's definition" o1-copy-reason.txt 2>/dev/null; then
              echo stale
            else
              echo unreadable
            fi
          }
          o1_noted=''
          : > certificate.out
          ssh -i ~/.ssh/standby -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 "root@$STANDBY_HOST" \
            "git -C /opt/club-arena fetch -q origin && git -C /opt/club-arena show $CONTROL_SHA:server/standby/standby-engine.sh > /usr/local/sbin/standby-engine && chmod +x /usr/local/sbin/standby-engine && mkdir -p /usr/local/share/club-arena-standby && git -C /opt/club-arena show $CONTROL_SHA:server/standby/schema-evidence.py > /usr/local/share/club-arena-standby/schema-evidence.py && git -C /opt/club-arena show $CONTROL_SHA:server/standby/standby-owners.sql > /usr/local/share/club-arena-standby/owners.sql && git -C /opt/club-arena show $CONTROL_SHA:server/standby/standby-placeholders.sql > /usr/local/share/club-arena-standby/placeholders.sql && git -C /opt/club-arena show $CONTROL_SHA:server/standby/standby-trials.sh > /usr/local/share/club-arena-standby/standby-trials.sh && git -C /opt/club-arena show $CONTROL_SHA:server/standby/qualify-tournament-freeze-fixes.py > /usr/local/share/club-arena-standby/qualify-tournament-freeze-fixes.py && git -C /opt/club-arena show $CONTROL_SHA:server/standby/player-reconnect.mjs > /usr/local/share/club-arena-standby/player-reconnect.mjs && standby-engine certify $SHA 900" \
            > certificate.out 2>&1 &
          ssh_pid=$!
          yielded=0
          yield_reason=''
          check_interval="${YIELD_CHECK_INTERVAL:-60}"
          if { [ "${EVENT:-}" = push ] || [ "${POST_SEAL:-}" = 1 ] || [ "${KEEP_SERVING:-}" = 1 ]; } && [ "${FREEZE_BASELINE:-}" != 1 ] && [ "${PLAN_PRIORITY:-}" != booking ] && [[ "${RUN_ID:-}" =~ ^[0-9]+$ ]]; then
            while kill -0 "$ssh_pid" 2>/dev/null; do
              elapsed=0
              while [ "$elapsed" -lt "$check_interval" ] && kill -0 "$ssh_pid" 2>/dev/null; do
                sleep 1
                elapsed=$((elapsed + 1))
              done
              kill -0 "$ssh_pid" 2>/dev/null || break
              secs_to_cutoff=$(python3 -B -c '
          import os, runpy, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          m = runpy.run_path("scripts/ci/read-engine-prequalification.py")
          hours = m["THREE_HOURLY_START_HOURS"]
          now = int(os.environ.get("O1_NOW_EPOCH") or time.time())
          zone = ZoneInfo("America/Chicago")
          base_hour = ((now // 3600) + 1) * 3600
          for step in range(48):
              start = base_hour + step * 3600
              cutoff = start - 1800
              if cutoff <= now:
                  continue
              chicago = datetime.fromtimestamp(start, zone)
              if chicago.hour in hours and chicago.minute == 0 and datetime.fromtimestamp(start - 3600, zone).hour != chicago.hour:
                  print(cutoff - now)
                  raise SystemExit(0)
          raise SystemExit(1)
          ' 2>/dev/null) || secs_to_cutoff=unreadable
              if ! [[ "$secs_to_cutoff" =~ ^[0-9]+$ ]]; then
                continue
              fi
              newer_waiting=$(gh api "repos/${GITHUB_REPOSITORY:-}/actions/workflows/backup-engine.yml/runs?event=push&branch=main&per_page=100" \
                --jq "[.workflow_runs[] | select(.id > $RUN_ID and .head_sha != \"$SHA\" and (.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\" or .status == \"requested\"))] | length" 2>/dev/null) || newer_waiting=unreadable
              if ! [[ "$newer_waiting" =~ ^[0-9]+$ ]] || [ "$newer_waiting" -le 0 ]; then
                continue
              fi
              if ! git fetch -q origin +refs/heads/main:refs/remotes/origin/main 2>/dev/null; then
                echo "O1 mid-soak check: git fetch origin main unreadable; keeping soak (CLAUDE.md 10.86)."
                continue
              fi
              main_sha=$(git rev-parse --verify refs/remotes/origin/main^{commit} 2>/dev/null || echo '')
              if ! [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || [ "$main_sha" = "$SHA" ] || ! git merge-base --is-ancestor "$SHA" "$main_sha" 2>/dev/null; then
                continue
              fi
              diverged=$(python3 -B -c '
          import runpy, subprocess, sys
          m = runpy.run_path("scripts/ci/read-engine-prequalification.py")
          sha, main_sha = sys.argv[1], sys.argv[2]
          proj_sha = m["projection"](sha)
          proj_main = m["projection"](main_sha)
          mig_sha = subprocess.check_output(["git", "--no-replace-objects", "ls-tree", "-r", sha, "--", "supabase/migrations"], text=True, timeout=30).strip()
          mig_main = subprocess.check_output(["git", "--no-replace-objects", "ls-tree", "-r", main_sha, "--", "supabase/migrations"], text=True, timeout=30).strip()
          reasons = []
          if proj_sha != proj_main:
              reasons.append("control_projection_diverged")
          if mig_sha != mig_main:
              reasons.append("migrations_tree_diverged")
          print(",".join(reasons))
          ' "$SHA" "$main_sha" 2>/dev/null) || diverged=unreadable
              if [ "$diverged" = unreadable ] || [ -z "$diverged" ]; then
                continue
              fi
              if [ "$diverged" = migrations_tree_diverged ]; then
                copy_state=$(o1_copy_state)
                case "$copy_state" in
                  stale) diverged="migrations_tree_diverged,migrations_installed_after_copy" ;;
                  current)
                    if [ "$o1_noted" != current ]; then
                      echo "O1 mid-soak check: main carries migration file(s) $SHA lacks, but production has not installed them (deferred or not yet sent), so the copy still holds production's installed set; keeping soak (O16)."
                      o1_noted=current
                    fi
                    continue ;;
                  *)
                    if [ "$o1_noted" != unreadable ]; then
                      echo "O1 mid-soak check: could not tell whether production installed a migration the copy lacks; keeping soak (CLAUDE.md 10.86, O16)."
                      o1_noted=unreadable
                    fi
                    continue ;;
                esac
              fi
              yielded=1
              yield_reason="$diverged (main=$main_sha, ${secs_to_cutoff}s to next cutoff, $newer_waiting newer active push run(s))"
              echo "YIELDED_OBSOLETE: $SHA became unselectable mid-soak: $yield_reason. Stopping standby certification cleanly so the waiting selectable commit can acquire the host."
              kill -TERM "$ssh_pid" 2>/dev/null || true
              for _ in 1 2 3 4 5; do
                kill -0 "$ssh_pid" 2>/dev/null || break
                sleep 1
              done
              kill -KILL "$ssh_pid" 2>/dev/null || true
              wait "$ssh_pid" 2>/dev/null || true
              ssh -i ~/.ssh/standby -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "root@$STANDBY_HOST" \
                "pids=\$(pgrep -f '[s]tandby-engine certify $SHA' || true); for p in \$pids; do pkill -TERM -P \"\$p\" 2>/dev/null || true; kill -TERM \"\$p\" 2>/dev/null || true; done; bash -c '. /usr/local/sbin/standby-engine && stop_for_restore' >/dev/null 2>&1 || true" || true
              break
            done
          fi
          if [ "$yielded" = 1 ]; then
            tail -n 40 certificate.out || true
            { echo "### Backup Engine"; echo ""; echo "- YIELDED_OBSOLETE \`$SHA\` mid-soak: $yield_reason; standby container stopped, host lease released, no failure or error certificate written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "yielded=1" >> "$GITHUB_OUTPUT"
          else
            if wait "$ssh_pid"; then rc=0; else rc=1; fi
            cat certificate.out || rc=1
            if [ "$rc" = 0 ]; then
              scp -i ~/.ssh/standby -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "root@$STANDBY_HOST:/var/lib/club-arena-standby/schema-evidence.json" schema-evidence.json || rc=1
            fi
            echo "rc=$rc" >> "$GITHUB_OUTPUT"
            tail -1 certificate.out > certificate.json || true
            if [ "$rc" = 0 ] && [ "${POST_SEAL:-}" = 1 ]; then
              # Diagnostic only (O24): the standby rehearses against live /health.
              echo "post-seal next candidate $SHA rehearsed its rollback against $(python3 -c 'import json;print(json.load(open("certificate.json")).get("rehearsedServingSha") or "none")' 2>/dev/null || echo unreadable) (sealed: ${SEALED_SHA:-unknown})"
            fi
            # THE CERTIFICATE NAMES THE SET THE COPY HOLDS (2026-11-08). The
            # retained schema evidence must be the file the certified copy
            # recorded and bound to its dump; its installed set (less this
            # target's own break-window files) is named in the verdict, so the
            # release host compares production with it at cutover. No bound
            # set, no success (the verdict step below requires it).
            if [ "$rc" = 0 ] && installed=$(python3 -B server/scripts/engine-release-installed-migrations.py certified-digest \
                --evidence schema-evidence.json --certificate certificate.json --sha "$SHA" \
                --control "${CONTROL_SHA:-}"); then
              echo "installed=$installed" >> "$GITHUB_OUTPUT"
            fi
          fi
          exit 0
      - name: Retain exact Backup schema, seed, policy and trial evidence
        if: steps.certify.outputs.rc == '0'
        uses: actions/upload-artifact@v4
        with:
          name: backup-certificate-${{ needs.refresh.outputs.sha || needs.plan.outputs.sha }}-${{ github.run_attempt }}
          path: |
            certificate.json
            compatibility.json
            schema-evidence.json
          if-no-files-found: error
      - name: Publish the verdict on the exact commit
        if: always()
        env:
          {
            GH_TOKEN: '${{ github.token }}',
            SHA: '${{ needs.refresh.outputs.sha || needs.plan.outputs.sha }}',
            RC: '${{ steps.certify.outputs.rc }}',
            YIELDED: '${{ steps.certify.outputs.yielded }}',
            JOB_STATUS: '${{ job.status }}',
            INSTALLED: '${{ steps.certify.outputs.installed }}',
            PENDING: '${{ steps.pending.outcome }}',
            WROTE_PENDING: '${{ steps.pending.outputs.wrote }}',
            POLICY: '${{ steps.policy.outcome }}',
            REFRESH: '${{ needs.refresh.result }}',
            TURN: '${{ needs.refresh.outputs.turn }}',
          }
        run: |
          set -euo pipefail
          if [ "${YIELDED:-}" = 1 ]; then
            echo "YIELDED_OBSOLETE: $SHA yielded mid-soak because it became unselectable before the next scheduled cutoff; writing no failure or error status."
            exit 0
          fi
          write=1; state=''; desc=''
          if [ "$RC" = 0 ] && [ "$JOB_STATUS" = success ] && [[ "$INSTALLED" =~ ^[0-9a-f]{64}$ ]]; then state=success; desc="Certified on the Backup Engine; installed migrations $INSTALLED"
          # A refresh that did not succeed is a refusal even when a later
          # provider answer stopped this job before the certify step turned it
          # into rc=1: its copy cannot back an earlier success (review of #10805).
          # NO TURN, NO VERDICT (incident 076ff467, 2026-11-20). A refresh that
          # failed because this run never held the Backup host (it timed out
          # waiting behind another certification) touched no copy and judged
          # no build. Publishing `failure` from it replaced a valid certificate
          # 12 minutes before the 03:30 selection. It reports `error` below,
          # which never replaces a success.
          elif [ "$REFRESH" != success ] && [ "${TURN:-}" != 1 ] && [ "$POLICY" != failure ]; then state=noturn
          elif [ -n "$RC" ] || [ "$POLICY" = failure ] || [ "$REFRESH" != success ]; then state=failure; desc="Backup Engine refused: $(python3 -c 'import json;print(",".join(json.load(open("certificate.json")).get("reasons",[]))[:120])' 2>/dev/null || echo see run)"
          fi
          if [ "$state" = noturn ] || { [ "$state" != success ] && [ "$state" != failure ]; }; then
            # NO VERDICT IS NOT A REFUSAL (2026-11-14, run 43565758486). The job
            # failed before the Backup host judged anything (a provider 5xx, the
            # dispatch proof, a checkout), so there is no certificate to report.
            # That is `error`, never `failure`, and it never replaces a success
            # this run did not itself overwrite with `pending`.
            reason=$state
            state=error; desc='Backup Engine reached no verdict: this run failed before certifying (provider, dispatch proof or checkout). See run.'
            if [ "$reason" = noturn ]; then desc='Backup Engine reached no verdict: this run never held the Backup host turn, so it tested nothing. See run.'; fi
            if [ "$PENDING" != success ] || [ "${WROTE_PENDING:-}" = 0 ]; then
              current=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/statuses?per_page=100" \
                --jq "[.[] | select(.context == \"$STATUS_CONTEXT\")][0].state // \"missing\"" 2>/dev/null) || current=unreadable
              case "$current" in
                success) write=0; echo "The existing $STATUS_CONTEXT = success on $SHA stands: this run produced no certificate and wrote no status." ;;
                missing|pending|failure|error) ;;
                *) write=0; echo "Could not read the existing $STATUS_CONTEXT on $SHA ($current); writing nothing rather than risk replacing a success." ;;
              esac
            fi
          fi
          if [ "$write" = 1 ]; then
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" -f state="$state" -f context="$STATUS_CONTEXT" -f description="$desc" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          fi
          echo "$state: $desc"
          [ "$state" = success ]
      - name: Release exclusive Backup host turn
        if: always()
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh; printf '%s\n' "$SSH_KEY" > ~/.ssh/standby; chmod 600 ~/.ssh/standby
          printf '%s\n' "$STANDBY_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/standby -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "root@$STANDBY_HOST" \
            "python3 - '$RUN_ID' '$RUN_ATTEMPT'" <<'PY' || true
          import fcntl, json, os, sys
          run_id, attempt = sys.argv[1], sys.argv[2]
          lease_path = '/var/lib/club-arena-standby/run-lease.json'
          os.makedirs('/var/lock', exist_ok=True)
          with open('/var/lock/club-arena-standby-lease.lock', 'w') as lf:
              fcntl.flock(lf, fcntl.LOCK_EX)
              if os.path.exists(lease_path):
                  try:
                      cur = json.load(open(lease_path))
                  except Exception:
                      cur = None
                  if cur and str(cur.get('runId')) == run_id and str(cur.get('attempt')) == attempt:
                      os.unlink(lease_path)
          PY

  keep-serving-outcome:
    # NEVER GREEN FOR NOTHING (O27b, 2026-11-26). Run 45775146770 ("Backup
    # after keep-serving 2026-11-26T01") planned a commit, had refresh and
    # certify skipped by the job-token refusal, and still completed "success"
    # in nine seconds: a certificate nobody made, reported as one (CLAUDE.md
    # 10.86). A run that carries after_cycle exists only to certify, so it is
    # green only when it certified, or ended in one of the two documented
    # nothing-to-certify outcomes: plan planned nothing, or refresh handed the
    # Backup host back (deferred). Reads job results only: no token, no secret.
    name: A Keep-Serving Backup Certified Or Says Why Not
    needs: [plan, refresh, certify]
    if: always() && github.event_name == 'workflow_dispatch' && inputs.after_cycle != ''
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse a keep-serving Backup whose work was skipped
        env:
          CYCLE: ${{ inputs.after_cycle }}
          PLAN: ${{ needs.plan.result }}
          PLANNED: ${{ needs.plan.outputs.sha }}
          REFRESH: ${{ needs.refresh.result }}
          DEFERRED: ${{ needs.refresh.outputs.deferred }}
          CERTIFY: ${{ needs.certify.result }}
        run: |
          set -euo pipefail
          say() { echo "$1"; { echo "### Keep-Serving Backup"; echo ""; echo "- $1"; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"; }
          [ "$PLAN" = success ] || { echo "::error::Keep-serving Backup for cycle $CYCLE: plan ended $PLAN; nothing was certified."; exit 1; }
          if [ -z "$PLANNED" ]; then say "Cycle $CYCLE: plan planned nothing; nothing to certify."; exit 0; fi
          if [ "$REFRESH" = success ] && [ "$DEFERRED" = 1 ]; then say "Cycle $CYCLE: refresh handed the Backup host back (deferred); nothing to certify."; exit 0; fi
          if [ "$REFRESH" = success ] && [ "$CERTIFY" = success ]; then say "Cycle $CYCLE: $PLANNED was refreshed and certified."; exit 0; fi
          echo "::error title=KEEP-SERVING BACKUP CERTIFIED NOTHING::Cycle $CYCLE planned $PLANNED but refresh ended $REFRESH and certify ended $CERTIFY. A skipped job means this dispatch was not admitted (a job-token dispatch must carry the exact intent Stage recorded); the next cycle has no fresh certificate from this run."
          exit 1
