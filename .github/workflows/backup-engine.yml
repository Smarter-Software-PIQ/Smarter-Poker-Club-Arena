               -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null; then
            release_turn
            echo "INHERITED: $description after waiting for the Backup host. Host handed back, nothing built."
            { echo "### Backup Engine"; echo ""; echo "- INHERITED \`$SHA\` <- \`$source\` after lease wait: identical engine source \`$identity\`; host handed back, nothing built, success certificate written."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            echo "inherited=1" >> "$GITHUB_OUTPUT"
