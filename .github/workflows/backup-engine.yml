          ssh -i ~/.ssh/standby -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=15 "root@$STANDBY_HOST" 'set -e; cd /var/lib/club-arena-standby; rm -rf seed; tar -xzf bundle.tgz;
