              gh api "repos/$GITHUB_REPOSITORY/statuses/$baseline" -f state=pending -f context="$STATUS_CONTEXT" \
                -f description="Backup Engine claimed tonight's freeze baseline (run $RUN_ID)" \
                -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" >/dev/null \
                || echo "::warning::could not write the freeze-baseline claim; certifying anyway"
              echo "FREEZE BASELINE: $baseline is tonight's shippable 04:00 build; certifying it on a copy restored now, not superseded, not retargeted."
              { echo "### Backup Engine"; echo ""; echo "- FREEZE BASELINE \`$baseline\`: certified on tonight's frozen copy (refresh forced)."; } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              echo "sha=$baseline" >> "$GITHUB_OUTPUT"
              echo "refresh=force" >> "$GITHUB_OUTPUT"
              echo "freeze_baseline=1" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
