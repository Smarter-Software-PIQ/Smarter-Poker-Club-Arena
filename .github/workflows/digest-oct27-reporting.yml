name: October 27 digest reporting regressions
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261028152402_fleet_reporting_preserves_unknown_stuck_counts.sql
      - scripts/ci/test-daily-fact-date-index.py
      - supabase/migrations/20261028162611_daily_reporting_facts_begin_with_their_selected_date.sql
      - scripts/ci/test-digest-oct27-reporting.py
      - scripts/ci/fixtures/digest-oct27-reporting-*
      - .github/workflows/digest-oct27-reporting.yml
permissions:
  contents: read
concurrency:
  group: digest-oct27-reporting-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Fleet reporting producer and attention native regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Run original and candidate reporting functions
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-digest-oct27-reporting.py
      - name: Daily fact input is admitted by its date index
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-daily-fact-date-index.py
      - name: Retain native accounting and query-plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest-oct27-reporting-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/digest-oct27-reporting/
          retention-days: 7
          if-no-files-found: error
