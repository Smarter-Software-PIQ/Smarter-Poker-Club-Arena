name: Promo play-through locks the grant until its fees are paid

# Owner ruling 2026-11-15: promo chips carry a 4x play-through in fees before
# they can be cashed out or claimed back; profit above the locked amount stays
# cashable after the original gift has earned 2x in fees. The same fees count
# toward both thresholds. Runs scripts/ci/test-promo-play-through.py against a throwaway
# PostgreSQL 17 cluster, never production: it applies the real migrations and
# proves the lock, the fee meter (cash rake share plus tournament fees net of
# refunds), oldest-first filling, expiry, the go-live boundary and that a
# browser role reaches only its own figure.
# No timer (CLAUDE.md 10.85): pull_request and merge_group only.
#
# Required, not advisory (2026-11-17). On 2026-11-17, the first day Promo Play
# Through was enforced, four production outages came from promo guards meeting
# a real tournament shape (between-hand add-on, zero-fee Spin entry, satellite
# remainder, Mystery Bounty champion residual). This workflow was path-filtered
# on promo migration names, so a migration that changed a promo caller never
# ran it, and no ruleset required it. Like weekly-refusal-cover.yml it now
# starts on every pull request, decides relevance itself from the path list
# below (any migration counts), fails open to running every proof when the
# diff cannot be read, and is a required status check on main.
on:
  pull_request:
    branches: [main]
  # Merge queue: the required check also runs on the queued merge-group commit.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: promo-play-through-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promo-play-through:
    name: Promo play-through lock ledger and fee meter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Configure the private runner temporary directory for every proof
        run: printf 'TMPDIR=%s\n' "${RUNNER_TEMP:?}" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - name: Does this change touch a promo play-through input?
        id: relevant
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          PROMO_PATHS: |
            supabase/migrations/**
            supabase/migrations/*_promo_play_through_*.sql
            supabase/migrations/*_signup_promo_*.sql
            supabase/migrations/*_promo_winnings_retain_*.sql
            supabase/migrations/*_returned_promo_ticket_*.sql
            supabase/migrations/*_promo_grant_notices_*.sql
            supabase/migrations/*_promo_tickets_require_cashable_wallets_*.sql
            supabase/migrations/*_promo_principal_follows_*.sql
            supabase/migrations/*_suspect_promo_chip_dumping_*.sql
            supabase/migrations/*_promo_tickets_*.sql
            supabase/migrations/*_promo_principal_*.sql
            supabase/migrations/*_promo_funded_fees_*.sql
            supabase/migrations/20260917230925_cash_funding_retains_original_participant_custody.sql
            supabase/migrations/*_tournament_winnings_retain_original_*.sql
            supabase/migrations/*_promo_expiry_keeps_*.sql
            supabase/migrations/*_a_spin_fee_source_agrees_*.sql
            supabase/migrations/*_a_refunded_entry_keeps_its_promo_*.sql
            scripts/ci/test-signup-promo-identity.py
            tests/fixtures/signup-promo-identity/**
            scripts/ci/test-promo-play-through.py
            scripts/ci/test-promo-activation.py
            scripts/ci/test-promo-profit*.py
            tests/fixtures/promo-profit-*/**
            scripts/ci/test-promo-principal-returns.py
            scripts/ci/test-promo-ticket-principal-returns.py
            tests/fixtures/promo-ticket-principal-returns/**
            tests/fixtures/promo-principal-returns/**
            scripts/ci/test-promo-tournament-earning-financial.py
            tests/fixtures/promo-tournament-earning-generation/**
            scripts/ci/test-promo-notices.py
            tests/fixtures/promo-notices/**
            scripts/ci/test-promo-custody.py
            scripts/ci/test-promo-custody-accepted-hand.py
            tests/fixtures/promo-custody-inventory-pin.json
            scripts/ci/migration-stale-pins.mjs
            scripts/ci/test-accepted-hand-roster.py
            scripts/ci/test-hand-submission.py
            scripts/ci/probes/accepted-hand-roster-fixture.sql
            scripts/ci/fixtures/hand-submission/**
            tests/fixtures/ev-cashout-lifecycle/captured-authorities.json
            scripts/ci/test-promo-tournament-earning-generation.py
            scripts/ci/test-promo-ticket-play-through.py
            scripts/ci/fixtures/promo-ticket-play-through/**
            tests/fixtures/promo-ticket-play-through/**
            scripts/ci/test-promo-fee-basis.py
            scripts/ci/test-promo-entry-fee-never-settles-progress.py
            supabase/migrations/*_a_promo_entry_fee_never_settles_*.sql
            scripts/ci/test-promo-winnings-credit-never-settles-progress.py
            tests/fixtures/promo-fee-basis/**
            scripts/ci/fixtures/unpaid-atomic-cash-contract-columns.json
            scripts/ci/fixtures/rakeback-cascade-real-guards/production-relations.json
            scripts/ci/fixtures/rakeback-cascade-real-guards/world.py
            scripts/ci/test-promo-expiry-thaw.py
            server/scripts/engine-release-database-proof.py
            scripts/ci/test-on-time-maintenance-thaw.py
            scripts/ci/test-thaw-preserves-retired-clubs.py
            scripts/ci/test-promo-integrity.py
            scripts/ci/test-promo-integrity-accepted-hand.py
            tests/fixtures/promo-integrity-*.json
            scripts/ci/test-mtt-unlimited.py
            scripts/ci/test-a-spin-fee-source-agrees-with-its-zero-fee-entry.py
            scripts/ci/test-a-rebuy-reads-promo-fee-state-outside-its-lane.py
            scripts/ci/fixtures/rebuy-promo-fee-state/**
            tests/fixtures/spin-fee-guard/**
            .github/workflows/promo-play-through.yml
            scripts/ci/test-promo-obligation-earning-matrix.py
            scripts/ci/test-promo-mystery-bounty-pool-residual.py
            scripts/ci/test-promo-weekly-statement-gross-rake.py
            tests/fixtures/promo-weekly-statement-gross-rake/**
            scripts/ci/test-promo-gross-rake-hardening.py
            tests/fixtures/promo-gross-rake-hardening/**
            scripts/ci/test-promo-sweep-idle-and-lateral-clock.py
            scripts/ci/test-promo-sweep-defers-an-overrunning-account.py
            supabase/migrations/20261124170034_promo_sweep_defers_an_account_that_outruns_its_budget.sql
            tests/fixtures/promo-obligation-earning-matrix/**
            scripts/ci/test-hot-path-no-history-scans.py
            tests/hot-path-never-scans-promo-history.law.test.ts
            tests/promo-play-through-is-a-required-proof.law.test.ts
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "No pull request diff: running every proof."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA" 2>/dev/null); then
            echo "::notice::The diff could not be read; running every proof."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          while IFS= read -r pattern; do
            [ -n "$pattern" ] || continue
            while IFS= read -r file; do
              [ -n "$file" ] || continue
              if [[ "$file" == $pattern ]]; then
                echo "$file matches $pattern: running every proof."
                echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
              fi
            done <<< "$changed"
          done <<< "$PROMO_PATHS"
          echo "No promo play-through input changed; the proofs have nothing new to verify."
          echo "run=false" >> "$GITHUB_OUTPUT"
      - name: Install PostgreSQL 17 from the signed PGDG source only
        if: steps.relevant.outputs.run == 'true'
        uses: ./.github/actions/install-postgres-17
        with:
          packages: postgresql-17 postgresql-17-plpgsql-check
      - name: Promo play-through lock ledger and fee meter
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-promo-play-through.py --output artifacts/promo-play-through
      - name: Programme activation is prospective and refuses missing prerequisites
        if: steps.relevant.outputs.run == 'true'
        run: python3 -B scripts/ci/test-promo-activation.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-activation
      - name: Promo notices use original fees and the existing push bridge
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-promo-notices.py --output artifacts/promo-notices
      - name: Promo tickets preserve their original grant through the money owners
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-ticket-play-through.py --output artifacts/promo-ticket-play-through --require-resolution-guard
      - name: Tournament earnings retain their original entry generation
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-tournament-earning-generation.py --output artifacts/promo-tournament-earning-generation
      - name: Promo principal follows wallet and table custody
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-custody.py --output artifacts/promo-custody
      - name: Promo custody runs in the original accepted hand
        if: steps.relevant.outputs.run == 'true'
        run: python3 -B scripts/ci/test-promo-custody-accepted-hand.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-custody-accepted-hand
      - name: Signup promo identity and credit transaction
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-signup-promo-identity.py --output artifacts/signup-promo-identity
      - name: Promo fees preserve gross rake and exclude free earnings
        if: steps.relevant.outputs.run == 'true'
        run: python3 -B scripts/ci/test-promo-fee-basis.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-fee-basis
      - name: A promo entry fee never settles promo progress inside a payout
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/ci/test-promo-entry-fee-never-settles-progress.py
      - name: A promo winnings credit never settles promo progress inside a payout
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/ci/test-promo-winnings-credit-never-settles-progress.py
      - name: A Spin's canonical fee agrees with its zero-fee entry (incident 002a0deb)
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/ci/test-a-spin-fee-source-agrees-with-its-zero-fee-entry.py --pg-bin /usr/lib/postgresql/17/bin
      - name: A rebuy reads promo fee state outside its event lane
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/ci/test-a-rebuy-reads-promo-fee-state-outside-its-lane.py
      - name: Every tournament obligation kind earns through the promo trigger exactly once (champion residual)
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          python3 -B scripts/ci/test-promo-obligation-earning-matrix.py --pg-bin /usr/lib/postgresql/17/bin | tee "$RUNNER_TEMP/promo-obligation-matrix.log"
          tail -n 1 "$RUNNER_TEMP/promo-obligation-matrix.log" | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v.get("status")=="passed" and v.get("checks",0)>=160 else "the matrix printed no passed verdict with its full case count")'
      - name: Settled Mystery Bounty pool residual earns from champion entry (5f8a23ea)
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          python3 -B scripts/ci/test-promo-mystery-bounty-pool-residual.py --pg-bin /usr/lib/postgresql/17/bin | tee "$RUNNER_TEMP/promo-mystery-pool-residual.log"
          tail -n 1 "$RUNNER_TEMP/promo-mystery-pool-residual.log" | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v.get("status")=="passed" and v.get("checks",0)>=20 else "the mystery pool residual proof printed no passed verdict")'
      - name: Promo expiry retains its original time through bounded maintenance thaw
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/ci/test-promo-expiry-thaw.py --output artifacts/promo-expiry-thaw
      - name: Build the stock PostgreSQL isolation client
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/build_pg17_isolationtester.py
      - name: Original promo returns preserve journal custody and concurrent replay
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_ISOLATION_TESTER: ${{ github.workspace }}/artifacts/postgresql-17-isolationtester/toolchain/lib/pgxs/src/test/isolation/isolationtester
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/ci/test-promo-principal-returns.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-principal-returns
      - name: Review holds follow actual restricted principal
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          PG_ISOLATION_TESTER: ${{ github.workspace }}/artifacts/postgresql-17-isolationtester/toolchain/lib/pgxs/src/test/isolation/isolationtester
        run: python3 -B scripts/ci/test-promo-integrity.py --output artifacts/promo-integrity
      - name: Actual accepted hands and response-loss replay preserve review custody
        if: steps.relevant.outputs.run == 'true'
        run: python3 -B scripts/ci/test-promo-integrity-accepted-hand.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-integrity-accepted-hand
      - name: Promo winnings retain the original gift and the overlapping fee milestones
        if: steps.relevant.outputs.run == 'true'
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-profit.py --output artifacts/promo-profit
      - name: Actual accepted hands preserve promo winnings and integrity holds
        if: steps.relevant.outputs.run == 'true'
        run: python3 -B scripts/ci/test-promo-profit-accepted-hand.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-profit-accepted-hand
      - name: Original jackpot recipients preserve source and transaction locks
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-profit-bbj.py --output artifacts/promo-profit-bbj
      - name: Original guarded money owners preserve promo custody through transfers and cashout
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-profit-movements-financial.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-profit-movements
      - name: Original noncash refunds return promo principal to its original fund
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-ticket-principal-returns.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-ticket-principal-returns
      - name: Hot-path functions never transitively scan promo fee history
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-hot-path-no-history-scans.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/hot-path-no-history-scans
      - name: Promo fee sweep skips idle accounts and short-circuits hand_atomic_commits (6efe4260)
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          python3 -B scripts/ci/test-promo-sweep-idle-and-lateral-clock.py --pg-bin /usr/lib/postgresql/17/bin | tee "$RUNNER_TEMP/promo-sweep-idle-lateral.log"
          tail -n 1 "$RUNNER_TEMP/promo-sweep-idle-lateral.log" | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v.get("status")=="passed" and v.get("checks",0)>=14 else "the sweep/lateral proof printed no passed verdict")'
      - name: Promo fee sweep defers an account that outruns its run budget instead of failing the run
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          python3 -B scripts/ci/test-promo-sweep-defers-an-overrunning-account.py --pg-bin /usr/lib/postgresql/17/bin | tee "$RUNNER_TEMP/promo-sweep-defers.log"
          tail -n 1 "$RUNNER_TEMP/promo-sweep-defers.log" | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v.get("status")=="passed" and v.get("checks",0)>=25 else "the sweep deferral proof printed no passed verdict")'
      - name: Weekly club statement and rake snapshot read gross original rake (605ea9ca)
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          python3 -B scripts/ci/test-promo-weekly-statement-gross-rake.py --pg-bin /usr/lib/postgresql/17/bin | tee "$RUNNER_TEMP/promo-weekly-statement-gross-rake.log"
          tail -n 1 "$RUNNER_TEMP/promo-weekly-statement-gross-rake.log" | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v.get("status")=="passed" and v.get("checks",0)>=20 else "the weekly statement gross rake proof printed no passed verdict")'
      - name: Fallback union earned-plan v3 and own-agent admission preserve gross basis and promo exclusion (605ea9ca hardening)
        if: steps.relevant.outputs.run == 'true'
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          set -o pipefail
          python3 -B scripts/ci/test-promo-gross-rake-hardening.py --pg-bin /usr/lib/postgresql/17/bin | tee "$RUNNER_TEMP/promo-gross-rake-hardening.log"
          tail -n 1 "$RUNNER_TEMP/promo-gross-rake-hardening.log" | python3 -c 'import json,sys; v=json.load(sys.stdin); sys.exit(0 if v.get("status")=="passed" and v.get("checks",0)>=16 else "the gross rake hardening proof printed no passed verdict")'
      - name: Retain the regression evidence
        if: always() && steps.relevant.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: promo-play-through-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/promo-play-through/RESULTS.json
            artifacts/promo-activation/RESULTS.json
            artifacts/promo-principal-returns/RESULTS.json
            artifacts/promo-principal-returns/source-manifest.json
            artifacts/promo-principal-returns/*race*.stdout
            artifacts/promo-principal-returns/*race*.stderr
            artifacts/promo-ticket-principal-returns/RESULTS.json
            artifacts/promo-profit*/RESULTS.json
            artifacts/promo-profit*/INPUTS.json
            artifacts/promo-profit-bbj/financial/RESULTS.json
            artifacts/promo-profit-bbj/financial/INPUTS.json
            artifacts/promo-tournament-earning-generation/public-financial/RESULTS.json
            artifacts/promo-tournament-earning-generation/public-financial/INPUTS.json
            artifacts/promo-expiry-thaw/RESULTS.json
            artifacts/promo-notices/RESULTS.json
            artifacts/promo-notices/INPUTS.json
            artifacts/promo-notices/PERFORMANCE.json
            artifacts/promo-ticket-play-through/RESULTS.json
            artifacts/promo-ticket-play-through/POSTIMAGES.json
            artifacts/promo-tournament-earning-generation/RESULTS.json
            artifacts/promo-tournament-earning-generation/INPUTS.json
            artifacts/promo-custody/RESULTS.json
            artifacts/promo-custody-accepted-hand/RESULTS.json
            artifacts/signup-promo-identity/RESULTS.json
            artifacts/promo-fee-basis/RESULTS.json
            artifacts/promo-integrity/RESULTS.json
            artifacts/promo-integrity/review-race-*.log
            artifacts/promo-integrity-accepted-hand/RESULTS.json
            artifacts/hot-path-no-history-scans/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
