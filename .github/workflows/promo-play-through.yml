name: Promo play-through locks the grant until its fees are paid

# Owner ruling 2026-11-15: promo chips carry a 4x play-through in fees before
# they can be cashed out or claimed back; profit above the locked amount stays
# cashable. Runs scripts/ci/test-promo-play-through.py against a throwaway
# PostgreSQL 17 cluster, never production: it applies the real migrations and
# proves the lock, the fee meter (cash rake share plus tournament fees net of
# refunds), oldest-first filling, expiry, the go-live boundary and that a
# browser role reaches only its own figure.
# No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/*_promo_play_through_*.sql
      - supabase/migrations/*_signup_promo_*.sql
      - scripts/ci/test-signup-promo-identity.py
      - tests/fixtures/signup-promo-identity/**
      - scripts/ci/test-promo-play-through.py
      - supabase/migrations/*_promo_grant_notices_*.sql
      - scripts/ci/test-promo-notices.py
      - supabase/migrations/*_promo_tickets_require_cashable_wallets_*.sql
      - supabase/migrations/*_promo_principal_follows_*.sql
      - supabase/migrations/*_suspect_promo_chip_dumping_*.sql
      - tests/fixtures/promo-notices/**
      - supabase/migrations/*_promo_tickets_*.sql
      - supabase/migrations/*_promo_principal_*.sql
      - scripts/ci/test-promo-custody.py
      - scripts/ci/test-promo-custody-accepted-hand.py
      - tests/fixtures/promo-custody-inventory-pin.json
      - scripts/ci/migration-stale-pins.mjs
      - scripts/ci/test-accepted-hand-roster.py
      - scripts/ci/test-hand-submission.py
      - scripts/ci/probes/accepted-hand-roster-fixture.sql
      - scripts/ci/fixtures/hand-submission/**
      - tests/fixtures/ev-cashout-lifecycle/captured-authorities.json
      - supabase/migrations/*_promo_funded_fees_*.sql
      - supabase/migrations/20260917230925_cash_funding_retains_original_participant_custody.sql
      - supabase/migrations/*_tournament_winnings_retain_original_*.sql
      - scripts/ci/test-promo-tournament-earning-generation.py
      - scripts/ci/test-promo-ticket-play-through.py
      - scripts/ci/fixtures/promo-ticket-play-through/**
      - tests/fixtures/promo-ticket-play-through/**
      - scripts/ci/test-promo-fee-basis.py
      - tests/fixtures/promo-fee-basis/**
      - scripts/ci/fixtures/unpaid-atomic-cash-contract-columns.json
      - scripts/ci/fixtures/rakeback-cascade-real-guards/production-relations.json
      - scripts/ci/fixtures/rakeback-cascade-real-guards/world.py
      - supabase/migrations/*_promo_expiry_keeps_*.sql
      - scripts/ci/test-promo-expiry-thaw.py
      - scripts/ci/test-on-time-maintenance-thaw.py
      - scripts/ci/test-thaw-preserves-retired-clubs.py
      - scripts/ci/test-promo-integrity.py
      - scripts/ci/test-promo-integrity-accepted-hand.py
      - tests/fixtures/promo-integrity-*.json
      - scripts/ci/test-mtt-unlimited.py
      - .github/workflows/promo-play-through.yml

permissions:
  contents: read

concurrency:
  group: promo-play-through-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promo-play-through:
    name: Promo play-through lock ledger and fee meter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Promo play-through lock ledger and fee meter
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-promo-play-through.py --output artifacts/promo-play-through
      - name: Promo notices use original fees and the existing push bridge
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-promo-notices.py --output artifacts/promo-notices
      - name: Promo tickets preserve their original grant through the money owners
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-ticket-play-through.py --output artifacts/promo-ticket-play-through
      - name: Tournament earnings retain their original entry generation
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-tournament-earning-generation.py --output artifacts/promo-tournament-earning-generation
      - name: Promo principal follows wallet and table custody
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-promo-custody.py --output artifacts/promo-custody
      - name: Promo custody runs in the original accepted hand
        run: python3 -B scripts/ci/test-promo-custody-accepted-hand.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-custody-accepted-hand
      - name: Signup promo identity and credit transaction
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-signup-promo-identity.py --output artifacts/signup-promo-identity
      - name: Promo fees preserve gross rake and exclude free earnings
        run: python3 -B scripts/ci/test-promo-fee-basis.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-fee-basis
      - name: Promo expiry retains its original time through bounded maintenance thaw
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/ci/test-promo-expiry-thaw.py --output artifacts/promo-expiry-thaw
      - name: Build the stock PostgreSQL isolation client
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/build_pg17_isolationtester.py
      - name: Review holds follow actual restricted principal
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          PG_ISOLATION_TESTER: ${{ github.workspace }}/artifacts/postgresql-17-isolationtester/toolchain/lib/pgxs/src/test/isolation/isolationtester
        run: python3 -B scripts/ci/test-promo-integrity.py --output artifacts/promo-integrity
      - name: Actual accepted hands and response-loss replay preserve review custody
        run: python3 -B scripts/ci/test-promo-integrity-accepted-hand.py --pg-bin /usr/lib/postgresql/17/bin --output artifacts/promo-integrity-accepted-hand
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-play-through-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/promo-play-through/RESULTS.json
            artifacts/promo-expiry-thaw/RESULTS.json
            artifacts/promo-notices/RESULTS.json
            artifacts/promo-notices/INPUTS.json
            artifacts/promo-notices/PERFORMANCE.json
            artifacts/promo-ticket-play-through/RESULTS.json
            artifacts/promo-tournament-earning-generation/RESULTS.json
            artifacts/promo-tournament-earning-generation/INPUTS.json
            artifacts/promo-custody/RESULTS.json
            artifacts/promo-custody-accepted-hand/RESULTS.json
            artifacts/signup-promo-identity/RESULTS.json
            artifacts/promo-fee-basis/RESULTS.json
            artifacts/promo-integrity/RESULTS.json
            artifacts/promo-integrity/review-race-*.log
            artifacts/promo-integrity-accepted-hand/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
