name: A stalled engine replacement is paged

# fn_ca_engine_release_stall_check() (migration 20261102135212). Runs
# scripts/ci/test-a-stalled-engine-replacement-is-paged.py against a throwaway
# PostgreSQL 17 cluster, never production. No timer (CLAUDE.md 10.85):
# pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261102135212_a_stalled_engine_replacement_is_paged.sql
      - supabase/migrations/20261105181559_the_stall_check_reads_the_alert_uuid.sql
      - scripts/ci/test-a-stalled-engine-replacement-is-paged.py
      - .github/workflows/a-stalled-engine-replacement-is-paged.yml

permissions:
  contents: read

concurrency:
  group: a-stalled-engine-replacement-is-paged-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a-stalled-engine-replacement-is-paged:
    name: A stalled engine replacement is paged once and resolved on recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: A stalled engine replacement is paged once and resolved on recovery
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-a-stalled-engine-replacement-is-paged.py
