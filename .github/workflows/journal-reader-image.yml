name: Journal reader image per engine release

# Publishes a read-only Horse decision-journal reader image, hvh-reader:<sha10>, for every engine release, so
# records can be re-read on their own build after the engine tag is retired (retain-engine-images.sh keeps only the
# sealed, running, leased and five newest club-arena-engine tags). The reader is the release's own engine image under
# a second tag; it is only ever run as its own container with no network, a read-only root filesystem and the
# journal mounted :ro (scripts/ops/journal-reader/publish-reader-image.sh).
#
# SEPARATE FROM THE RELEASE ON PURPOSE. It starts only after "Auto-Deploy Hetzner Engine (on server/ changes)"
# has COMPLETED (workflow_run), so it can never fail, delay or hold a lock in a cutover, and it changes no release
# control file. It never restarts, signals or execs into the serving container. Its proof run waits outside the
# hourly :48-:05 break and the 09:30-11:30Z nightly window (exit 75 = deferred, retried here for up to 100 min);
# the tag itself is applied at once, so a deferral never loses the image to retention.
# No timer (CLAUDE.md 10.85): release-completion events and manual backfill only.
on:
  workflow_run:
    workflows: ['Auto-Deploy Hetzner Engine (on server/ changes)']
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: 'Optional full engine SHA to publish a reader for (its club-arena-engine image must still exist on the host)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: journal-reader-image
  cancel-in-progress: false

jobs:
  publish:
    name: Publish and prove the release's journal reader
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'repository_dispatch' && startsWith(github.event.workflow_run.display_title, 'Engine Release ') && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 120
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
      SSH_USER: root
      REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/ops/journal-reader
      - name: Prove the publisher before it reaches the host
        run: bash scripts/ops/journal-reader/tests/test_publish_reader_image.sh
      - name: Establish existing pinned SSH service identity
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ]
          PRIVATE_DIR="$(mktemp -d "$RUNNER_TEMP/jr.XXXXXX")"; chmod 0700 "$PRIVATE_DIR"
          printf '%s\n' "$SSH_KEY" > "$PRIVATE_DIR/key"; chmod 0600 "$PRIVATE_DIR/key"
          ssh-keygen -y -f "$PRIVATE_DIR/key" >/dev/null
          printf '%s\n' "$HOST_KEY" > "$PRIVATE_DIR/known_hosts"; chmod 0600 "$PRIVATE_DIR/known_hosts"
          ssh-keygen -l -f "$PRIVATE_DIR/known_hosts" >/dev/null
          HSSH="$PRIVATE_DIR/hssh"
          printf '#!/usr/bin/env bash\nexec ssh -i %q -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=%q -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 %q "$@"\n' \
            "$PRIVATE_DIR/key" "$PRIVATE_DIR/known_hosts" "$SSH_USER@$HETZNER_HOST" > "$HSSH"
          chmod 0700 "$HSSH"
          echo "HSSH=$HSSH" >> "$GITHUB_ENV"
      - name: Publish hvh-reader for the sealed and running release (waits out break windows)
        run: |
          set -uo pipefail
          [ -z "$REQUESTED_SHA" ] || [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::sha must be 40 lowercase hex'; exit 1; }
          deadline=$(( $(date +%s) + 100 * 60 ))
          while :; do
            rc=0; out=$(timeout 300 "$HSSH" "bash -s -- publish $REQUESTED_SHA" < scripts/ops/journal-reader/publish-reader-image.sh) || rc=$?
            [ "$rc" = 75 ] || break
            [ "$(date +%s)" -lt "$deadline" ] || { echo '::warning title=Reader proof deferred::the reader tag is applied but its proof stayed inside a break window for 100 min; run this workflow again by hand'; exit 0; }
            echo "proof deferred by a break window; retrying in 5 min"; sleep 300
          done
          [ "$rc" = 0 ] || { echo "::error title=Journal reader not published::publish-reader-image.sh exited $rc"; exit "$rc"; }
          printf '%s\n' "$out" | tail -1 > published.json
          python3 -c "import json; d=json.load(open('published.json')); [print('%s %s %s readerVersion=%s' % (p['tag'], p['sha'], p['imageId'], p['proof'].get('readerVersion'))) for p in d['published']]; print('retired', d['retired'])" | tee -a "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-reader-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: published.json
          if-no-files-found: ignore
