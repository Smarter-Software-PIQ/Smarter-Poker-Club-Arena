name: Report Recovered Engine Seal
run-name: Report recovered engine seal ${{ inputs.original_run }}-${{ inputs.original_attempt }}
on:
  workflow_dispatch:
    inputs:
      original_run:
        description: Original failed engine receiver run ID (never rerun it)
        required: true
        type: string
      original_attempt:
        description: Original failed attempt
        required: true
        type: string
  pull_request:
    paths:
      - '.github/workflows/report-recovered-engine-seal.yml'
      - 'scripts/ci/recovered-seal-report.py'
      - 'scripts/ci/test-recovered-seal-report.py'
concurrency:
  group: recovered-seal-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B scripts/ci/test-recovered-seal-report.py
  report:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: regression
    runs-on: ubuntu-latest
    environment: "${{ github.event_name == 'pull_request' && 'ci-pull-request' || 'ci-main' }}"
    timeout-minutes: 5
    concurrency:
      group: recovered-seal-report-${{ inputs.original_run }}-${{ inputs.original_attempt }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      checks: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read original outcome and immutable seal without changing runtime
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ORIGINAL_RUN: ${{ inputs.original_run }}
          ORIGINAL_ATTEMPT: ${{ inputs.original_attempt }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.HETZNER_HOST }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$ORIGINAL_RUN" =~ ^[1-9][0-9]*$ && "$ORIGINAL_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          mkdir evidence
          gh api "repos/$REPO/actions/runs/$ORIGINAL_RUN/attempts/$ORIGINAL_ATTEMPT" > evidence/original.json
          jq -e --argjson id "$ORIGINAL_RUN" --argjson attempt "$ORIGINAL_ATTEMPT" '.id == $id and .run_attempt == $attempt and .path == ".github/workflows/auto-deploy-hetzner.yml" and .status == "completed" and .conclusion == "failure"' evidence/original.json >/dev/null
          install -m 700 -d "$RUNNER_TEMP/recovery-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/recovery-ssh/key"
          chmod 600 "$RUNNER_TEMP/recovery-ssh/key"
          printf '%s\n' "$HOST_KEY" > "$RUNNER_TEMP/recovery-ssh/known_hosts"
          trap 'rm -f "$RUNNER_TEMP/recovery-ssh/key"' EXIT
          ssh_args=(-i "$RUNNER_TEMP/recovery-ssh/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/recovery-ssh/known_hosts" -o ConnectTimeout=15)
          ssh "${ssh_args[@]}" "root@$HOST" "cat /var/lib/club-arena/engine-release-results/$ORIGINAL_RUN-$ORIGINAL_ATTEMPT.json" > evidence/seal.json
          ssh "${ssh_args[@]}" "root@$HOST" 'docker inspect --format '"'"'{"Id":{{json .Id}},"Image":{{json .Image}},"State":{"StartedAt":{{json .State.StartedAt}},"Running":{{json .State.Running}}}}'"'"' club-arena-engine' > evidence/runtime.json
          curl -fsS --max-time 20 "https://engine.smarter.poker/health?recovered-seal=$GITHUB_RUN_ID" | jq '{status,releaseSha,instanceId,leadership:{holder:.leadership.holder},maintenance:{active:.maintenance.active,phase:.maintenance.phase}}' > evidence/health.json
      - name: Verify the binding and publish a separate linked recovery check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 -B scripts/ci/recovered-seal-report.py --repo "$REPO" --reporter-url "$GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" --directory evidence
          cat evidence/summary.md >> "$GITHUB_STEP_SUMMARY"
          sha=$(jq -er .head_sha evidence/check.json)
          key=$(jq -er .external_id evidence/check.json)
          gh api --paginate "repos/$REPO/commits/$sha/check-runs?filter=all&per_page=100" --jq '.check_runs[] | {id,external_id,details_url}' | jq -s --arg key "$key" '[.[]|select(.external_id == $key)]' > evidence/existing-checks.json
          # Reporting is repeat-safe: retain any existing report rather than
          # replacing history or creating another successful check for the run.
          if [ "$(jq length evidence/existing-checks.json)" = 0 ]; then
            gh api --method POST "repos/$REPO/check-runs" --input evidence/check.json > evidence/published-check.json
          else
            echo 'A linked recovery check already exists; preserving it.'
            cat evidence/existing-checks.json
          fi
      - name: Retain linked recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovered-engine-seal-${{ inputs.original_run }}-${{ inputs.original_attempt }}
          path: evidence/
          if-no-files-found: error
