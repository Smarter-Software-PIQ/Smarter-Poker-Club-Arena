name: Union week-boundary certificates are kept

# Migration 20261115015159. Runs scripts/ci/test-pnl-boundary-capture.py
# against a throwaway PostgreSQL 17 cluster, never production: every ready
# pnl_boundary certificate is copied at install and in the statement that
# writes a later one, the copy is append-only and outlives the certificate's
# eight-day retirement, and a copy that raises never refuses the certificate.
# No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261115015159_union_pnl_boundary_certificates_are_kept.sql
      - tests/fixtures/pnl-boundary-capture/**
      - scripts/ci/test-pnl-boundary-capture.py
      - .github/workflows/union-pnl-boundaries-are-kept.yml

permissions:
  contents: read

concurrency:
  group: union-pnl-boundaries-are-kept-${{ github.ref }}
  cancel-in-progress: true

jobs:
  union-pnl-boundaries-are-kept:
    name: Union week-boundary certificates are kept
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root).
      - name: Week-boundary certificates are kept
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-pnl-boundary-capture.py
