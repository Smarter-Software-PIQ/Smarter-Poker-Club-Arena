name: An idle floor is not a lagging stats index

# ca_stats_health() indexLagSeconds (migration 20261015223846). Runs
# scripts/ci/test-an-idle-floor-is-not-index-lag.py against a throwaway
# PostgreSQL 17 cluster, never production: production's exact text
# (pg_get_functiondef md5 equal to the live function) must read an idle floor
# as lag, and the migration must read it as 0, read a fresh hand as its own
# age, still read a stalled roller as lag, and reproduce production's derived
# postimage md5. No timer (CLAUDE.md 10.85): pull_request only, scoped to the
# paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015223846_an_idle_floor_is_not_a_lagging_stats_index.sql
      - supabase/migrations/20261007212545_the_stats_gap_reads_count_a_pending_projection_as_pending.sql
      - supabase/migrations/20260904222705_stats_phase_3_pulse_timezone_and_ev_coverage.sql
      - scripts/ci/fixtures/stats-witness-real-gaps/**
      - scripts/ci/test-an-idle-floor-is-not-index-lag.py
      - .github/workflows/an-idle-floor-is-not-index-lag.yml

permissions:
  contents: read

concurrency:
  group: an-idle-floor-is-not-index-lag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  an-idle-floor-is-not-index-lag:
    name: An idle floor reads zero index lag, a stalled roller still reads lag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: An idle floor reads zero index lag, a stalled roller still reads lag
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-an-idle-floor-is-not-index-lag.py --output artifacts/an-idle-floor-is-not-index-lag
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: an-idle-floor-is-not-index-lag-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/an-idle-floor-is-not-index-lag/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
