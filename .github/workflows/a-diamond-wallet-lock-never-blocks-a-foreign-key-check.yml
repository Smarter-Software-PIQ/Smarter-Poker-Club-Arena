name: A Diamond wallet lock never blocks a foreign key check

# Migration 20261021234940. Runs
# scripts/ci/test-a-diamond-wallet-lock-never-blocks-a-foreign-key-check.py
# against a throwaway PostgreSQL 17 cluster, never production: production's
# exact fn_poker_diamond_release, fn_poker_diamond_reserve and
# add_diamonds_to_balance (md5 equal to the live functions on 2026-10-21) must
# deadlock with a hand commit's foreign-key check before the migration and
# commit cleanly after it, while still refusing every other wallet writer.
# No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261022000330_a_diamond_wallet_lock_never_blocks_a_foreign_key_check.sql
      - scripts/ci/fixtures/diamond-wallet-locks/**
      - scripts/ci/test-a-diamond-wallet-lock-never-blocks-a-foreign-key-check.py
      - .github/workflows/a-diamond-wallet-lock-never-blocks-a-foreign-key-check.yml

permissions:
  contents: read

concurrency:
  group: a-diamond-wallet-lock-never-blocks-a-foreign-key-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a-diamond-wallet-lock-never-blocks-a-foreign-key-check:
    name: A Diamond wallet lock never blocks a foreign key check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: A Diamond wallet lock never blocks a foreign key check
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-a-diamond-wallet-lock-never-blocks-a-foreign-key-check.py --output artifacts/a-diamond-wallet-lock-never-blocks-a-foreign-key-check
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a-diamond-wallet-lock-never-blocks-a-foreign-key-check-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/a-diamond-wallet-lock-never-blocks-a-foreign-key-check/
          retention-days: 7
          if-no-files-found: warn
