name: Human vs Horse capture toolkit tests

on:
  pull_request:
    paths:
      - '.github/workflows/human-horse-capture-tests.yml'
      - 'scripts/ops/human-horse-capture/**'

concurrency:
  group: human-horse-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  toolkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - working-directory: scripts/ops/human-horse-capture
        run: |
          PYTHONPATH=. python3 -B -m unittest discover -s tests -p 'test_*.py'
          (cd manifest && python3 -B -m unittest test_fleet_reconciliation test_lightning_outcomes test_metrics_window test_postseal_census test_postseal_selection)
          bash tests/test_operator_lock.sh "$RUNNER_TEMP/hvh-lock"
          bash tests/test_verify_release.sh
          bash tests/test_preserve_window.sh
