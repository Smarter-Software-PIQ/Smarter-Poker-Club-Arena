name: Lightning card incident settlement
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261030161608_house_covers_kingfish_lightning_missing_card_losses.sql
      - scripts/qualification/lightning-card-incident/**
      - scripts/qualification/approved-agent-adjustment/fixtures/tally-owners.json
      - scripts/qualification/approved-agent-adjustment/fixtures/write-authorization-owners.json
      - .github/workflows/lightning-card-incident.yml
permissions:
  contents: read
concurrency:
  group: lightning-card-incident-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lightning-card-incident:
    name: Lightning card incident settlement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Original incident conservation, rollback, replay and concurrency
        run: python3 -B scripts/qualification/lightning-card-incident/native.py --pg-bin /usr/lib/postgresql/17/bin --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/lightning-card-incident-result.json"
