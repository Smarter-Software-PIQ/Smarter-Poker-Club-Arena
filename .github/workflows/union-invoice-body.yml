name: Union invoice body names the week and who pays

# Qualifies smarter_private.union_weekly_invoice_body from migration
# 20261115011424 in a throwaway PostgreSQL 17 cluster, never production:
# the Chicago week line (including a daylight-saving week), who pays whom,
# the square, house-club, credited and credit-note documents, exact figures
# and that a browser role cannot execute it. Runs
# scripts/ci/test-union-invoice-body.py. No timer (CLAUDE.md 10.85):
# pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261115011424_union_invoice_views_show_the_week_and_who_pays.sql
      - scripts/ci/test-union-invoice-body.py
      - .github/workflows/union-invoice-body.yml

permissions:
  contents: read

concurrency:
  group: union-invoice-body-${{ github.ref }}
  cancel-in-progress: true

jobs:
  union-invoice-body:
    name: Union invoice body names the week and who pays
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Union invoice body names the week and who pays
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-union-invoice-body.py --output artifacts/union-invoice-body
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: union-invoice-body-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/union-invoice-body/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
