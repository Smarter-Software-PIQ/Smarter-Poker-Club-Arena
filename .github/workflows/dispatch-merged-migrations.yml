# ─────────────────────────────────────────────────────────────────────────────
# DISPATCH MERGED MIGRATIONS — every merge into main installs what it added
# or modified (modified since 2026-11-08: a refused migration fixed in place).
#
# A WORKFLOW OF ITS OWN (2026-11-07). The dispatch used to be a job inside
# agent-autopilot.yml, and Agent Autopilot has been disabled_manually since
# 2026-10-28 by owner instruction (PUBLISHING.md: it "stays disabled"). A job
# in a disabled workflow never runs, so #9932's "every merge dispatches" rule
# never ran either: #9858 and #9957, merged by GitHub auto-merge armed by the
# owner account, both left their migrations uninstalled until a hand dispatch.
# The merge's own native `closed` event now has a workflow that is not tied to
# the retired merger. It is not a watcher, timer or retry: one run per merge,
# one attempt per file, and the one bounded wait happens before any send.
#
# TRUST. What makes a file installable is that it merged into the protected
# default branch from a branch of this repository - not who pressed merge.
# The job only runs for that, checks out the default branch (never PR code),
# and apply-merged-migration.yml re-checks the merged bytes, filename shape,
# schema_migrations, the break window and the certificate for every file.
#
# TOKEN. The job's own GITHUB_TOKEN. GitHub does not start workflows from
# events its token raises, EXCEPT workflow_dispatch and repository_dispatch,
# so the apply-merged-migration repository_dispatch it sends does start the
# applier. contents: write is the scope repository_dispatch needs.
# ─────────────────────────────────────────────────────────────────────────────
name: Dispatch Merged Migrations

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

# One run per merged PR, never cancelled: its bounded break-window wait must
# not be cut short.
concurrency:
  group: dispatch-merged-migrations-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dispatch-merged-migrations:
    name: Dispatch the migrations this merge added or modified
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.event.pull_request.base.ref == github.event.repository.default_branch
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Bounded: the one break-window wait is at most 22 minutes.
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed default-branch automation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # The applier honours this job-token dispatch only as the exact intent
      # recorded and uploaded here (scripts/ci/dispatch-intent.mjs).
      - name: Record one dispatch intent per migration
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          DISPATCH_PHASE: plan
          INTENT_DIR: ${{ runner.temp }}/dispatch-intents
          INTENT_STATE: ${{ runner.temp }}/merged-migration-intents.jsonl
        run: bash .github/scripts/dispatch-merged-migrations.sh

      - name: Publish the intents on this exact run attempt
        if: steps.plan.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-intents-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-intents
          if-no-files-found: error
          retention-days: 7

      - name: Dispatch each added or modified migration to the applier
        if: steps.plan.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          DISPATCH_PHASE: send
          INTENT_STATE: ${{ runner.temp }}/merged-migration-intents.jsonl
        run: bash .github/scripts/dispatch-merged-migrations.sh
