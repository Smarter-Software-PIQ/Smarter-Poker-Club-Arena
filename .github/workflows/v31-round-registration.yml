name: V31 round registration binds the approved composition

# Native proof of migration 20261110213931 against a throwaway PostgreSQL 17
# cluster (never production): scripts/ci/test-v31-round-registration.py, with
# its mutation checks. No timer (CLAUDE.md 10.85): pull_request only, scoped to
# the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261110213931_v31_a_round_is_registered_and_its_composition_is_enforced.sql
      - scripts/ci/test-v31-round-registration.py
      - scripts/ci/fixtures/v31-round-registration/**
      - scripts/ci/fixtures/v31-evaluation-contract-v3/00-schema.sql
      - .github/workflows/v31-round-registration.yml

permissions:
  contents: read

concurrency:
  group: v31-round-registration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v31-round-registration:
    name: V31 round registration refuses any composition it did not register
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root).
      - name: Native proof and mutation checks
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          python3 scripts/ci/test-v31-round-registration.py --mutations
