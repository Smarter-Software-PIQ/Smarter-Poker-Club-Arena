name: Release inputs hold
# During a booked engine window, a pull request that touches a release input
# (scripts/ci/release-freeze-scope.mjs GUARDED) shows this check red until the
# window ends. It is information for the agent, never a merge gate: the owner
# ruled on 2026-09-11 that no check may hold merges, and on 2026-11-19 that
# upgrades and fixes must not wait on an engine cutover. Do not add it to the
# required checks of any ruleset.
on:
  pull_request:
    branches: [main]
concurrency:
  group: release-inputs-hold-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  scope:
    name: Release inputs are steady for the engine window
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            scripts/ci
            server/release
      - name: List the changed files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}/files" --paginate --jq '.[].filename' > "$RUNNER_TEMP/files.txt" || rm -f "$RUNNER_TEMP/files.txt"
      - name: Judge against the live engine window
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_RELEASE_FREEZE: ${{ vars.MAIN_RELEASE_FREEZE }}
          FREEZE_SCOPE_FILES: ${{ runner.temp }}/files.txt
        run: node scripts/ci/release-freeze-scope.mjs
