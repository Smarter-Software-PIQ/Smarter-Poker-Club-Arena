name: Engine release prequalification
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'supabase/migrations/**'
      - '.github/workflows/engine-release-prequalification.yml'
      - '.github/workflows/stage-engine-release.yml'
      - '.github/workflows/auto-deploy-hetzner.yml'
      - '.github/workflows/backup-engine.yml'
      - 'scripts/ci/read-engine-prequalification.py'
      - 'scripts/ci/prestage-engine-image.sh'
      - 'scripts/ci/select-daily-engine.py'
      - 'scripts/ci/check-engine-doors-exist.mjs'
      - 'scripts/ci/window-migration-doors.mjs'
      - 'scripts/ci/recorded-migrations.manifest.json'
      - 'scripts/ci/record-engine-deploy-attempt.mjs'
      - 'scripts/ci/record-engine-deploy-exit.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    if: github.ref == 'refs/heads/main'
    name: Qualify exact engine (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use the production Node major
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Compile and test the exact server tree
        working-directory: server
        env:
          RELEASE_TEST_SHARD: ${{ matrix.shard }}
          # npm run build is a full tsc over server/src: over Node's default heap on this runner since 2026-11-27
          # (4,314 MB on main 84749b1c). tests/a-full-server-typecheck-gets-the-heap-it-needs.law.test.ts
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          set -euo pipefail
          [[ "$RELEASE_TEST_SHARD" =~ ^[1-8]$ ]]
          npm ci --no-audit --no-fund
          npm run build
          # Run this nested historical qualification once on shard 7 (fastest shard ~7m54s vs shard 2's ~14m)
          # before CPU-heavy tests, cutting ~2.8m off critical-path prequalification.
          if [ "$RELEASE_TEST_SHARD" = 7 ]; then
            npm test -- src/engine/RetainedHistoricalCheckpointQualification.test.ts
          fi
          npm test -- --exclude src/engine/RetainedHistoricalCheckpointQualification.test.ts --shard="$RELEASE_TEST_SHARD/8"

  prestage:
    if: github.ref == 'refs/heads/main' && !((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    name: Stage immutable candidate and rollback images
    runs-on: ubuntu-24.04
    environment: ci-main
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the exact candidate on the isolated runner
        run: |
          set -euo pipefail
          ENGINE_BUILD_CONTEXT_ROOT="$RUNNER_TEMP/build" ENGINE_BUILD_LOCK_FILE="$RUNNER_TEMP/build.lock" \
            bash server/scripts/build-engine-image.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA" "club-arena-engine:$GITHUB_SHA"
      - name: Transfer immutable image and prove local rollback
        id: stage
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          dir="$(mktemp -d "$RUNNER_TEMP/stage.XXXXXXXX")"
          trap 'rm -rf -- "$dir"' EXIT
          [[ "$HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          printf '%s\n' "$HOST_KEY" > "$dir/hosts"
          printf '%s\n' "$SSH_KEY" > "$dir/key"
          ssh-keygen -l -f "$dir/hosts" >/dev/null
          image="$(docker image inspect -f '{{.Id}}' "club-arena-engine:$GITHUB_SHA")"
          size="$(docker image inspect -f '{{.Size}}' "$image")"
          [[ "$size" =~ ^[1-9][0-9]{0,10}$ ]]
          tree="$(git rev-parse "$GITHUB_SHA:server")"
          [[ "$image" =~ ^sha256:[0-9a-f]{64}$ && "$tree" =~ ^[0-9a-f]{40}$ ]]
          transport="club-arena-prestage:$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag "$image" "$transport"
          docker image save -o "$dir/image.tar" "$transport"
          config="$(python3 -B server/scripts/engine-prestage-config-proof.py "$transport" "$image" < "$dir/image.tar")"
          [[ "$config" =~ ^sha256:[0-9a-f]{64}$ ]]
          # The target's protected policy decides which cycles close the host door.
          hours="$(python3 server/scripts/engine-release-seal.py schedule-policy --repo . --sha "$GITHUB_SHA" \
            | python3 -c 'import json,sys; p=json.load(sys.stdin); print("1,4,7,10,13,16,19,22" if p.get("frequency")=="three-hourly" else "4")')"
          [[ "$hours" = 4 || "$hours" = 1,4,7,10,13,16,19,22 ]]
          # Single-pass, strictly bounded pre-transfer wait when the host prestage
          # door is closed ([start - 1800, start + 300)) or within the final 60s
          # before cutoff where transfer would not finish ([start - 1860, start - 1800)).
          # Sleeps at most once until start + 305 (<= 2165s); never loops or retries.
          # The host guard in scripts/ci/prestage-engine-image.sh stays fail-closed.
          wait_seconds="$(START_HOURS="$hours" python3 - <<'PRESTAGE_WAIT_PY'
          import os, time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          zone = ZoneInfo("America/Chicago")
          raw_hours = os.environ["START_HOURS"]
          if raw_hours == "1,4,7,10,13,16,19,22":
              hours = (1, 4, 7, 10, 13, 16, 19, 22)
          elif raw_hours == "4":
              hours = (4,)
          else:
              raise SystemExit(f"unsupported START_HOURS: {raw_hours!r}")
          now = int(time.time())
          starts = [h for h in ((now // 3600 + k) * 3600 for k in range(-1, 25))
                    if datetime.fromtimestamp(h, zone).hour in hours
                    and datetime.fromtimestamp(h - 3600, zone).hour != datetime.fromtimestamp(h, zone).hour]
          wait = 0
          for start in starts:
              if start - 1860 <= now < start + 300:
                  wait = (start + 305) - now
                  break
          assert 0 <= wait <= 2165, f"unexpected prestage wait: {wait}"
          print(wait)
          PRESTAGE_WAIT_PY
          )"
          [[ "$wait_seconds" =~ ^(0|[1-9][0-9]*)$ ]] && (( wait_seconds <= 2165 ))
          if (( wait_seconds > 0 )); then
            echo "Host prestage door is closed or closing within 60s (START_HOURS=$hours); sleeping once for ${wait_seconds}s until cycle+305s before SSH transfer"
            sleep "$wait_seconds"
          fi
          code="$(base64 -w0 scripts/ci/prestage-engine-image.sh)"
          proof="$(base64 -w0 server/scripts/engine-prestage-config-proof.py)"
          gzip -1c "$dir/image.tar" | timeout -k 5s 660s ssh -i "$dir/key" -o BatchMode=yes \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o GlobalKnownHostsFile=/dev/null \
            -o UserKnownHostsFile="$dir/hosts" -o ConnectTimeout=15 "root@$HOST" \
            "PROOF_B64='$proof' bash -c \"\$(printf '%s' '$code' | base64 -d)\" bash '$GITHUB_SHA' '$config' '$tree' '$size' '$transport' '$hours'" > "$dir/result"
          python3 - "$dir/result" "$GITHUB_OUTPUT" "$tree" <<'PYTHON'
          import pathlib, re, sys
          data = pathlib.Path(sys.argv[1]).read_text()
          assert re.fullmatch(r'image=sha256:[0-9a-f]{64}\nrollback=sha256:[0-9a-f]{64}\ntree=' + sys.argv[3] + r'\n', data)
          with open(sys.argv[2], 'a') as output:
              output.write(data)
          PYTHON
      - name: Prepared image ${{ steps.stage.outputs.image }} rollback ${{ steps.stage.outputs.rollback }} tree ${{ steps.stage.outputs.tree }}
        run: 'true'

  prequalification:
    name: Retire superseded prequalification runs
    needs: [qualify, prestage]
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.qualify.result == 'success' &&
      needs.prestage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        continue-on-error: true
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ci/retire-superseded-prequalification.mjs
          persist-credentials: false
      - name: Retire strictly older in-flight prequalification runs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFY_RESULT: ${{ needs.qualify.result }}
          PRESTAGE_RESULT: ${{ needs.prestage.result }}
        run: |
          if [ -f scripts/ci/retire-superseded-prequalification.mjs ]; then
            node scripts/ci/retire-superseded-prequalification.mjs
          else
            echo "::warning::retire-superseded-prequalification.mjs absent after sparse checkout; skipping non-blocking retirement"
          fi
