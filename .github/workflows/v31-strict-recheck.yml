name: V31 strict re-check binds a new engine only after it replays and retests

# Native proof of migration 20261107035438 against a throwaway PostgreSQL 17
# cluster (never production): scripts/ci/test-v31-strict-recheck.py, with its
# behavioural mutation checks. It builds on the contract v3 proof's fixtures,
# so changes to those re-run it too. No timer (CLAUDE.md 10.85): pull_request only, scoped to
# the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261107035438_v31_strict_recheck_binds_a_new_engine_only_after_it_replays_.sql
      - supabase/migrations/20261107024448_v31_evaluation_contract_v3_tests_the_playbooks_own_tables.sql
      - supabase/migrations/20261102180625_v31_serving_bindings_admit_only_verified_engines.sql
      - scripts/ci/test-v31-strict-recheck.py
      - scripts/ci/test-v31-evaluation-contract-v3.py
      - scripts/ci/fixtures/v31-strict-recheck/**
      - scripts/ci/fixtures/v31-evaluation-contract-v3/**
      - .github/workflows/v31-strict-recheck.yml

permissions:
  contents: read

concurrency:
  group: v31-strict-recheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v31-strict-recheck:
    name: V31 strict re-check refuses every weakened rule and retires on one loss
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        run: |
          set -euo pipefail
          pg_sources="$(mktemp -d "$RUNNER_TEMP/ca-postgres-apt.XXXXXX")"
          chmod 755 "$pg_sources"
          test -f /etc/apt/sources.list.d/ubuntu.sources
          cp /etc/apt/sources.list.d/ubuntu.sources "$pg_sources/ubuntu.sources"
          pg_apt=(-o "Dir::Etc::sourcelist=/dev/null" -o "Dir::Etc::sourceparts=$pg_sources" -o "Acquire::Retries=8" -o "Acquire::Retries::Delay::Maximum=60")
          sudo apt-get "${pg_apt[@]}" update
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-common curl ca-certificates
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo install -m 0644 "$GITHUB_WORKSPACE/.github/pgdg/apt.postgresql.org.asc" /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          printf 'Types: deb\nURIs: https://apt.postgresql.org/pub/repos/apt\nSuites: %s-pgdg\nComponents: main\nSigned-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc\n' \
            "$codename" > "$pg_sources/pgdg.sources"
          sudo apt-get "${pg_apt[@]}" update
          printf 'create_main_cluster = false\n' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get "${pg_apt[@]}" install -y --no-install-recommends postgresql-17
      # Runs as the runner user (non-root).
      - name: Native proof and mutation checks
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          python3 scripts/ci/test-v31-strict-recheck.py --mutations
