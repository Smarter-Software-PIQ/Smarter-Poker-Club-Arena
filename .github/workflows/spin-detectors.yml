name: Spin detectors measure what can fail

# fn_spin_metrics and fn_spin_fairness_check (migration 20261015025123).
# Runs scripts/ci/test-spin-detectors.py against a throwaway PostgreSQL 17
# cluster, never production: the exact production definitions captured
# 2026-10-15 (pg_get_functiondef md5 equal to the live functions) must page on
# thin pools that fund no Spin and on a chance p < 0.01 crossing, and the
# migration must count only a thin pool funding Spins today, raise a warning
# only when the preceding window confirms it, keep criticals, every other
# gauge, owner, security, settings and grants, and reproduce production's
# derived postimage md5. No timer (CLAUDE.md 10.85): pull_request only,
# scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015025123_spin_detectors_measure_what_can_fail.sql
      - scripts/ci/fixtures/spin-detectors/**
      - scripts/ci/test-spin-detectors.py
      - .github/workflows/spin-detectors.yml

permissions:
  contents: read

concurrency:
  group: spin-detectors-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spin-detectors:
    name: Spin detectors page only on what can fail
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Spin detectors page only on what can fail
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-spin-detectors.py --output artifacts/spin-detectors
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spin-detectors-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/spin-detectors/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
