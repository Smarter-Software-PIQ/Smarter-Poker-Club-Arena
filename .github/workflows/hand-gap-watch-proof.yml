name: Hand gap unintended-delay watch (PostgreSQL proof)

# Incident 075013fd lane E5. Runs scripts/ci/test-hand-gap-watch.py against a
# throwaway PostgreSQL 16 cluster (the runner image's own), never production:
# fn_ca_hand_gap_unintended_delay grades synthetic hand_history rows by shape,
# skips Lightning, breaks and gaps of 60 s or more, keeps cash busts and
# run-it-twice out of the over-budget figures; fn_ca_hand_gap_watch records
# each window, raises nothing for an on-time table or a single breached
# window, raises ONE critical alert for two consecutive breached windows
# (deduplicated across later windows and re-runs), and resolves it.
# Since 20261120034809 it also proves the watch pages nobody itself: a
# hand-delay episode pages the owner once through the owner page route
# (kind hand_delay) and a flap is held, not pushed.
# Since 20261121000757 it proves the alert names where the delay comes from
# (after a bust, after a tournament seat move, both) on production's own text.
# Since 20261124171043_the_hand_gap_grade_names_its_worst_hands it proves the grade names each cell's
# maximum and slowest hands, and runs Backup's sample judge
# (server/standby/standby-engine.sh check_soak_hand_gap_delay) against this
# cluster before and after that edit.
# No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261119052955_an_unintended_delay_between_hands_pages_within_minutes.sql
      - supabase/migrations/20261119180500_sustained_hand_delay_alerts_and_cadence_grading.sql
      - supabase/migrations/20261119211558_a_hand_for_hand_wait_is_an_owed_wait.sql
      - supabase/migrations/20261120034809_a_hand_delay_pages_through_the_owner_page_route.sql
      - supabase/migrations/20261121000757_the_hand_delay_alert_names_where_the_delay_comes_from.sql
      - scripts/ci/fixtures/owner-page-route-preimage-20261120.sql
      - supabase/migrations/20261122054826_mystery_bounty_and_addon_break_are_owed_waits.sql
      - supabase/migrations/20261122095254_all_in_showdown_sweep_and_award_groups_parity.sql
      - supabase/migrations/20261124171043_the_hand_gap_grade_names_its_worst_hands.sql
      - server/standby/standby-engine.sh
      - scripts/sql/hand-gap-unintended-delay.sql
      - scripts/ci/test-hand-gap-watch.py
      - .github/workflows/hand-gap-watch-proof.yml

permissions:
  contents: read

concurrency:
  group: hand-gap-watch-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: An unintended delay between hands pages within minutes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prove the watch on PostgreSQL 16
        env:
          PG_BIN: /usr/lib/postgresql/16/bin
        run: python3 scripts/ci/test-hand-gap-watch.py --output artifacts/hand-gap-watch
      - name: Retain the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hand-gap-watch-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hand-gap-watch/*.json
          retention-days: 7
          if-no-files-found: warn
