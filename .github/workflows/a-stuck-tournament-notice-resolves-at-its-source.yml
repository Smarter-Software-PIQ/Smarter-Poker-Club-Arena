name: A stuck tournament notice resolves at its source

# fn_sp_critical_scan() (migration 20261117173255). Runs
# scripts/ci/test-stuck-tournament-notices-resolve.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-11-17 (pg_get_functiondef md5 ef4c2c3d...) must show the
# defect (a CriticalPage/DailyDigest stuck_tournament notice of a tournament
# that stopped RUNNING stays firing), and the migration must resolve both sp
# notices in place through the intake status-change path, keep running,
# malformed, other-rule and other-source notices firing, be idempotent, keep
# the ACL, replay as a no-op and refuse a changed preimage. No timer:
# pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261117173255_stuck_tournament_pages_resolve_when_the_tournament_stops_running.sql
      - tests/fixtures/sp-critical-scan-preimage-20261117.sql
      - scripts/ci/test-stuck-tournament-notices-resolve.py
      - .github/workflows/a-stuck-tournament-notice-resolves-at-its-source.yml

permissions:
  contents: read

concurrency:
  group: a-stuck-tournament-notice-resolves-at-its-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a-stuck-tournament-notice-resolves-at-its-source:
    name: A stuck tournament notice resolves at its source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: A stuck tournament notice resolves at its source
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 -B scripts/ci/test-stuck-tournament-notices-resolve.py
