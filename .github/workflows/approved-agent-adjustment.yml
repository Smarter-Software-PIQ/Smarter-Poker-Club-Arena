name: Approved agent adjustment
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
      - scripts/qualification/approved-agent-adjustment/**
      - tests/approved-agent-adjustments-settle-once.law.test.ts
      - .github/workflows/approved-agent-adjustment.yml
permissions:
  contents: read
concurrency:
  group: approved-agent-adjustment-${{ github.ref }}
  cancel-in-progress: true
jobs:
  approved-agent-adjustment:
    name: Approved agent adjustment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Approved positive agent adjustment execution and truthful audit receipt
        run: python3 -B scripts/qualification/approved-agent-adjustment/native.py --pg-bin /usr/lib/postgresql/17/bin --scratch "${{ runner.temp }}" --output "${{ runner.temp }}/approved-agent-adjustment-result.json"
