name: Cert Residue Sweep

# 2026-10-31: 429 PostDeploy / crest_cert reserved identities and three live
# 'Crest Cert' clubs had leaked. Stale recovery refused outright above 20
# accounts and ran only inside certification jobs, so once the backlog passed
# 20 nothing could ever drain it. This sweep runs that recovery when an
# operator starts it, bounded by time (STALE_CLEANUP_BUDGET_MS) rather than a
# count, with the same 162-minute age floor and the same guarded doors:
#   - cleanupStaleProductionE2EAccounts: each stale reserved identity, after
#     retiring the certification clubs it owns;
#   - cleanupStaleCertificationClubs: stale 'Crest Cert' clubs whose owner is
#     gone or is a reserved certificate identity, through
#     retireCertificationClubWithRetry.
# A residue it cannot retire fails this run, loudly.

# Operator policy (2026-10-31): no new automated production-deleting loop.
# There is no timer here. Two starts only:
#   - an operator (Actions > Cert Residue Sweep > Run workflow): the full
#     sweep, stale accounts and then stale certification clubs;
#   - a completed Club Create Certification run (2026-11-08): the stale ACCOUNT
#     recovery only, which is exactly the recovery that certificate used to
#     embed in its own cleanup since 2026-10-08. It moved here so residue left
#     by OTHER runs no longer paints an unrelated club-creation certificate
#     red: that certificate's verdict is club creation, and this workflow is
#     the one reader of stale residue. Its red run on main is what
#     check-main-is-green (production-integrity-audit.yml) reports.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Club Create Certification']
    types: [completed]

concurrency:
  # Never two sweeps at once, and never cancel one mid-retirement.
  group: cert-residue-sweep
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # `pg` drives the long-budget retirement door when DATABASE_URL is set.
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Sweep Stale Certification Accounts And Clubs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # A stranded 'Cert RH' club is settled as its own owner through the
          # anon client (settleStrandedRabbitHuntClub); the publishable key is
          # the same one the certification workflows carry in the clear.
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
          # Per pass (accounts, then clubs): 2 x 22 minutes, plus the one
          # retirement already in flight when a budget runs out, fits the
          # 60-minute job. A backlog larger than one budget continues next hour.
          STALE_CLEANUP_BUDGET_MS: '1320000'
        # The same refusals either way; only the scope differs (see `on:`).
        run: node scripts/ci/production-e2e-account.mjs ${{ github.event_name == 'workflow_dispatch' && 'sweep-stale-residue' || 'sweep-stale-accounts' }}
