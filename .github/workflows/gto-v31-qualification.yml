name: Explicit V31 Offline Qualification
run-name: V31 qualification ${{ inputs.operation || 'admission contracts' }} ${{ inputs.dataset }}${{ inputs.intent_nonce && format(' {0}', inputs.intent_nonce) || '' }}

# One owner-dispatched operation. Never scheduled, never an engine publisher.
# evaluate: run the evaluator at the dataset's audited epoch pin (an epoch for a
#   new engine commit opens only with an explicit reason). A read-only plan
#   names the pin first and a few-minute pre-screen plays the first deals of
#   every component at it; a component that never reaches the playbook fails
#   the job before any epoch is opened or receipt recorded.
# prescreen: the same read-only plan and pre-screen on their own, then stop:
#   no epoch, no evaluation, no receipt. With engine empty it screens the
#   commit evaluate would pin; with engine set it screens that protected-main
#   commit (an earlier epoch pin, say). This is how an agent screens a dataset:
#   the database identity is the repository secret, never a local key.
# promote: one engine-locked host operation: promote the evaluated epoch, load
#   all eight workers, prove readiness. Re-run after a partial outcome resumes
#   without re-promoting.
# recheck: the strict re-check of a contract v3 playbook on the serving engine
#   (identical execution and replay digests, every certification table re-run
#   a win or a tie; one loss retires it for good). Run by the V31 lane after a
#   daily update; a passed round lets promote bind and load that engine.
# After every completed engine release run, whatever its verdict (a run can
# activate the engine and fail a later job), (workflow_run below, no timer) the
# recheck-after-release job reads production and dispatches `recheck` for a
# contract v3 playbook the new serving engine still needs; with no such
# playbook it does nothing (scripts/ci/gto-v31-recheck-dispatch.mjs).
on:
  pull_request:
    paths:
      - .github/workflows/gto-v31-qualification.yml
      - scripts/ci/gto-v31-qualification.mjs
      - scripts/ci/gto-v31-qualification.test.mjs
      - scripts/ci/gto-v31-prescreen.mjs
      - scripts/ci/gto-v31-prescreen-worker.mjs
      - scripts/ci/gto-v31-prescreen.test.mjs
      - scripts/ci/gto-v31-recheck-dispatch.mjs
      - scripts/ci/gto-v31-recheck-dispatch.test.mjs
      - scripts/ci/v31-decision-closure.mjs
      - scripts/ci/v31-decision-closure.test.mjs
      - scripts/ci/v31-execution-fingerprint.mjs
      - scripts/ci/v31-execution-fingerprint.test.mjs
      - server/src/engine/HorseV31CertifiedPolicy.ts
      - scripts/ci/v31-atomic-promotion-host.sh
      - scripts/ci/v31-atomic-promotion-container.mjs
      - scripts/ci/v31-atomic-promotion.test.mjs
      - scripts/ci/inspect-v31-worker-readiness.mjs
      - server/scripts/*evaluation-worker*.mjs
      - server/src/scripts/gtoV31Evaluate.ts
      - server/src/benchmark/GtoV31EvaluationConfig.ts
      - server/src/benchmark/GtoV31Recheck.ts
      - server/src/benchmark/GtoV31ReplayDigest.ts
      - server/scripts/gto-v31-evaluate-worker.mjs
      - server/scripts/build-public-hist215-native.mjs
      - server/native/**
  workflow_run:
    workflows: ['Auto-Deploy Hetzner Engine (on server/ changes)']
    types: [completed]
  workflow_dispatch:
    inputs:
      dataset:
        description: Exact sealed V31 dataset UUID
        required: true
        type: string
      operation:
        description: Evaluate first; promote only after reviewing all eight receipts of the epoch
        required: true
        default: evaluate
        type: choice
        options: [evaluate, promote, recheck, prescreen]
      reason:
        description: Audited reason (20-500 chars), required only to open a new epoch for a different engine commit
        required: false
        default: ''
        type: string
      engine:
        description: prescreen only - exact protected-main engine commit to screen (empty = the commit evaluate would pin)
        required: false
        default: ''
        type: string
      intent_run_id:
        description: recheck only - set by recheck-after-release; the run whose dispatch-intents artifact binds this recheck (empty for a person)
        required: false
        default: ''
        type: string
      intent_run_attempt:
        description: recheck only - set by recheck-after-release (empty for a person)
        required: false
        default: ''
        type: string
      intent_nonce:
        description: recheck only - set by recheck-after-release; the one-time intent key (empty for a person)
        required: false
        default: ''
        type: string

permissions:
  contents: read
  # Read-only: the dispatch-origin proof reads the sending run.
  actions: read
concurrency:
  group: gto-v31-qualification-${{ github.event.pull_request.number || inputs.dataset || format('after-release-{0}', github.event.workflow_run.id) }}
  # Admission checks retire per PR; explicit data operations keep their owner.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: V31 qualification admission contracts
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned protected-main commit the real-closure test reads
        run: git fetch --no-tags --depth=1 origin ee9fd8eded24d2f832cbe9de865e2d8932fa648f
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/ci/gto-v31-qualification.test.mjs scripts/ci/gto-v31-prescreen.test.mjs scripts/ci/v31-decision-closure.test.mjs scripts/ci/v31-execution-fingerprint.test.mjs scripts/ci/v31-atomic-promotion.test.mjs scripts/ci/gto-v31-recheck-dispatch.test.mjs
  recheck-after-release:
    name: Dispatch the strict re-check a new serving engine needs
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.path == '.github/workflows/auto-deploy-hetzner.yml' && github.event.workflow_run.event == 'repository_dispatch' && github.repository_id == '1132369872' && (github.repository == 'Smarter-Poker/Smarter-Poker-Club-Arena' || github.repository == 'Smarter-Software-PIQ/Smarter-Poker-Club-Arena')) && (!((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'recheck')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    environment: ci-main
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The qualify job honours this job-token recheck only as the exact intent
      # recorded and uploaded here (scripts/ci/dispatch-intent.mjs).
      - name: Decide from production and record an intent for each re-check the serving engine still needs
        id: decide
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          INTENT_DIR: ${{ runner.temp }}/dispatch-intents
          INTENT_STATE: ${{ runner.temp }}/gto-recheck-intents.json
        run: node scripts/ci/gto-v31-recheck-dispatch.mjs
      - name: Publish the intents on this exact run attempt
        if: steps.decide.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-intents-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dispatch-intents
          if-no-files-found: error
          retention-days: 7
      - name: Dispatch exactly the recorded re-checks
        if: steps.decide.outputs.send == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          INTENT_STATE: ${{ runner.temp }}/gto-recheck-intents.json
        run: node scripts/ci/gto-v31-recheck-dispatch.mjs send
  qualify:
    needs: contract
    if: (github.event_name == 'workflow_dispatch' && (inputs.operation == 'evaluate' || inputs.operation == 'recheck' || inputs.operation == 'prescreen') && github.ref == 'refs/heads/main' && github.repository_id == '1132369872' && (github.repository == 'Smarter-Poker/Smarter-Poker-Club-Arena' || github.repository == 'Smarter-Software-PIQ/Smarter-Poker-Club-Arena')) && (!((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'recheck')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    environment: ci-main
    timeout-minutes: 350
    steps:
      - name: Prove a job-token dispatch is the exact intent its trusted sender recorded
        if: ((endsWith(github.actor, '[bot]') && github.actor != 'smarter-poker-autopilot[bot]') || (endsWith(github.triggering_actor, '[bot]') && github.triggering_actor != 'smarter-poker-autopilot[bot]')) && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # scripts/ci/dispatch-intent.mjs: sender run, artifact, exact inputs and one-time title.
          gh api -H 'Accept: application/vnd.github.raw' "repos/$GITHUB_REPOSITORY/contents/scripts/ci/dispatch-intent.mjs?ref=$GITHUB_SHA" > "$RUNNER_TEMP/dispatch-intent.mjs"
          node "$RUNNER_TEMP/dispatch-intent.mjs" prove --receiver gto-recheck
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Plan the evaluation epoch pin without opening it (evaluate, prescreen - read-only)
        id: plan
        if: inputs.operation == 'evaluate' || inputs.operation == 'prescreen'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node control/scripts/ci/gto-v31-qualification.mjs plan
      - name: Prove the serving engine execution-identical (recheck)
        id: context
        if: inputs.operation == 'recheck'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node control/scripts/ci/gto-v31-qualification.mjs resolve
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.plan.outputs.source_sha || steps.context.outputs.source_sha }}
          path: runtime
          fetch-depth: 0
          persist-credentials: false
      - name: Install only the locked evaluator dependencies
        working-directory: runtime/server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build the receiving-platform exact public-state kernel
        working-directory: runtime/server
        run: node scripts/build-public-hist215-native.mjs
      - name: Pre-screen every component at the pin (evaluate, prescreen - read-only, minutes; fails on a component that never reaches the playbook)
        if: inputs.operation == 'evaluate' || inputs.operation == 'prescreen'
        timeout-minutes: 30
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EQUITY_GOVERNOR: 'off'
        run: node control/scripts/ci/gto-v31-prescreen.mjs
      - name: Select or open the audited evaluation epoch at the pre-screened pin (evaluate)
        if: inputs.operation == 'evaluate'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node control/scripts/ci/gto-v31-qualification.mjs resolve
      - name: Run the evaluator once at the epoch pin (recheck - at the serving engine)
        if: inputs.operation == 'evaluate' || inputs.operation == 'recheck'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node control/scripts/ci/gto-v31-qualification.mjs run
      - name: Retain metadata-only operation receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gto-v31-operation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gto-v31-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          if-no-files-found: warn
          retention-days: 7
  promote:
    needs: contract
    if: (github.event_name == 'workflow_dispatch' && inputs.operation == 'promote' && github.ref == 'refs/heads/main' && github.repository_id == '1132369872' && (github.repository == 'Smarter-Poker/Smarter-Poker-Club-Arena' || github.repository == 'Smarter-Software-PIQ/Smarter-Poker-Club-Arena')) && (!((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) || (github.event_name == 'workflow_dispatch' && inputs.operation == 'recheck')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-24.04
    environment: ci-main
    timeout-minutes: 20
    env:
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Promote, bind the serving engine, load eight workers and prove readiness (reverts to the empty store on failure)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ]
          V31_SSH_DIR="$RUNNER_TEMP/v31-promote-ssh-$GITHUB_RUN_ID"
          install -d -m 0700 "$V31_SSH_DIR"
          trap 'rm -rf "$V31_SSH_DIR"' EXIT
          printf '%s\n' "$SSH_KEY" > "$V31_SSH_DIR/key"
          printf '%s\n' "$HOST_KEY" > "$V31_SSH_DIR/known_hosts"
          chmod 0600 "$V31_SSH_DIR/key" "$V31_SSH_DIR/known_hosts"
          ssh-keygen -y -f "$V31_SSH_DIR/key" >/dev/null
          ssh-keygen -l -f "$V31_SSH_DIR/known_hosts" >/dev/null
          export V31_SSH_DIR
          node control/scripts/ci/gto-v31-qualification.mjs promote
      - name: Retain metadata-only promotion receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gto-v31-promotion-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gto-v31-${{ github.run_id }}-${{ github.run_attempt }}/receipt.json
          if-no-files-found: warn
          retention-days: 30
