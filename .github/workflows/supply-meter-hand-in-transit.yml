name: Supply meter counts a hand in transit

# fn_ca_supply_snapshot (migration 20261016172614). Runs
# scripts/ci/test-supply-meter-hand-in-transit.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definition
# captured 2026-10-16 (pg_get_functiondef md5 equal to the live function) must
# read a settled hand's rake and drop as unexplained while its post-commit
# obligations are still in flight, and the migration must read every phase of
# the same hands as zero, exclude tournament and Diamond tables, open a new
# basis, declare its guard redefinition, keep owner, security, settings and
# grants, and reproduce production's derived postimage md5. No timer
# (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261016172614_the_supply_meter_counts_a_hand_in_transit.sql
      - scripts/ci/fixtures/supply-meter-hand-in-transit/**
      - scripts/ci/test-supply-meter-hand-in-transit.py
      - .github/workflows/supply-meter-hand-in-transit.yml

permissions:
  contents: read

concurrency:
  group: supply-meter-hand-in-transit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-meter-hand-in-transit:
    name: Supply meter counts a hand in transit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Supply meter counts a hand in transit
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-supply-meter-hand-in-transit.py --output artifacts/supply-meter-hand-in-transit
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supply-meter-hand-in-transit-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/supply-meter-hand-in-transit/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
