name: Retired wallet transfer boundary
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
      - scripts/ci/test-retired-wallet-transfer-postgres.py
      - .github/workflows/retired-wallet-transfer.yml
# A newer push to the same pull request fully supersedes this pure check
# (pull_request runs on refs/pull/N/merge), and the job mutates nothing
# outside its runner. Cancel the stale run instead of queueing it.
concurrency:
  group: retired-wallet-transfer-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  retired-wallet-transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Retired transfer refuses without moving funds
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-retired-wallet-transfer-postgres.py
