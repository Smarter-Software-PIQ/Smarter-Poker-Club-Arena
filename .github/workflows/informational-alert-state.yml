name: Informational alert state

# fn_record_operational_alert() and the operational_alert_events
# investigation_status CHECK (migration 20261015183650). Runs
# scripts/ci/test-informational-alert-state.py against a throwaway PostgreSQL
# 17 cluster, never production: the exact production writer captured
# 2026-10-15 (pg_get_functiondef md5 equal to the live function) records an
# info/info summary as 'new', and the migration must record it
# 'informational', leave every incident 'new', reclassify only the info/info
# rows still 'new', keep grants and reproduce production's derived postimage
# md5. No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it
# proves. ci.yml has no push trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
      - scripts/ci/fixtures/alert-ledger-roots/**
      - scripts/ci/test-alert-ledger-roots.py
      - scripts/ci/test-explicit-incident-resolution.py
      - scripts/ci/test-post-commit-handoff-classification.py
      - scripts/ci/test-native-alert-event.py
      - tools/production-alerts-native-wakeup/**
      - tests/nativeAlertEvent.test.ts
      - tests/fixtures/native-alert-event/**
      - scripts/ci/fixtures/informational-alert-state/**
      - scripts/ci/test-informational-alert-state.py
      - .github/workflows/informational-alert-state.yml

permissions:
  contents: read

concurrency:
  group: informational-alert-state-${{ github.ref }}
  cancel-in-progress: true

jobs:
  informational-alert-state:
    name: An informational alert is recorded informational
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: An informational alert is recorded informational
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-informational-alert-state.py --output artifacts/informational-alert-state
      - name: Completed Mint receipts and explicit incident investigations
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-alert-ledger-roots.py
      - name: An explicit investigation replaces an unverified age-out atomically
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-explicit-incident-resolution.py
      - name: A post-commit handoff pages on harm, not on handoff
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-post-commit-handoff-classification.py
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informational-alert-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/informational-alert-state/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
