name: The hourly sweep reads each ledger leg once

# Migration 20261022162545. Runs
# scripts/ci/test-the-hourly-sweep-reads-each-leg-once.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definitions
# captured 2026-10-22 (pg_get_functiondef md5 equal to the live functions) are
# loaded twice, once where the migration replaces them and once untouched, and
# every replaced check must answer exactly as its untouched twin before and
# after every checkpoint advance, epoch and baseline move, and sweep run.
# No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261022162545_the_hourly_sweep_reads_each_ledger_leg_once.sql
      - scripts/ci/fixtures/hourly-sweep-incremental/**
      - scripts/ci/test-the-hourly-sweep-reads-each-leg-once.py
      - .github/workflows/the-hourly-sweep-reads-each-leg-once.yml

permissions:
  contents: read

concurrency:
  group: the-hourly-sweep-reads-each-leg-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  the-hourly-sweep-reads-each-leg-once:
    name: The hourly sweep reads each ledger leg once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: The hourly sweep reads each ledger leg once
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-the-hourly-sweep-reads-each-leg-once.py --output artifacts/hourly-sweep-incremental
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-sweep-incremental-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hourly-sweep-incremental/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
