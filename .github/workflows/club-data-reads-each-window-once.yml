name: Club Data and Union Data read each window once

# Migration 20261022165130. Runs
# scripts/ci/test-club-data-reads-each-window-once.py against a throwaway
# PostgreSQL 17 cluster, never production: every Club Data migration is
# installed in order, each replaced reader is proved to be the production text
# (pg_get_functiondef md5), every reader's output is recorded for union and
# club scope, and after 20261022165130 every output must be identical.
# No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261117193740_club_data_recent_games_read_visible_facts_once.sql
      - supabase/migrations/20261107031542_club_metric_page_uses_report_attribution.sql
      - supabase/migrations/20261029054242_club_data_player_search_matches_player_identities_before_its.sql
      - scripts/ci/fixtures/agent-data-boundary/data-player-search-contract.py
      - scripts/ci/test-agent-data-boundary-postgres.py
      - supabase/migrations/20261027145338_club_data_shows_member_earned_fees_from_the_player_managemen.sql
      - supabase/migrations/20261022165130_club_data_and_union_data_read_each_window_once.sql
      - supabase/migrations/20261027002505_legacy_rake_data_authorizes_every_club_separately.sql
      - supabase/migrations/20261114235606_club_data_reads_the_union_invoice_week.sql
      - supabase/migrations/20261114235607_a_renamed_club_keeps_its_old_slug.sql
      - tests/fixtures/club-data-union-weeks/**
      - supabase/migrations/20261115020010_club_data_accounting_read_model.sql
      - supabase/migrations/20261115020011_club_data_accounting_read_model_goes_live.sql
      - supabase/migrations/20261115034141_club_data_accounting_reader_views.sql
      - supabase/migrations/20261115034142_club_data_readers_route_union_clubs_to_the_accounting_model.sql
      - supabase/migrations/20261115063000_club_data_history_loads_a_day_in_bounded_parts.sql
      - supabase/migrations/20261115080136_club_data_boundary_side_reconciled_to_its_invoice.sql
      - supabase/migrations/20261115075440_club_data_history_load_reads_each_row_once.sql
      - supabase/migrations/20261115164547_club_data_union_screen_reads_the_window_twice_not_six_times.sql
      - supabase/migrations/20261115205153_club_data_union_screen_shows_each_club.sql
      - supabase/migrations/20261116021023_club_data_chicago_screen_reads_long_windows_in_one_pass.sql
      - supabase/migrations/20261115145150_every_club_reads_its_own_records_horses_included.sql
      - scripts/ci/club-data-accounting-seed.mjs
      - supabase/migrations/20261115015159_union_pnl_boundary_certificates_are_kept.sql
      - tests/fixtures/club-data-accounting/**
      - scripts/ci/test-club-data-accounting-read-model.py
      - scripts/ci/test-club-data-union-invoice-week.py
      - tests/fixtures/club-data-fact-db/**
      - tests/fixtures/club-data-report-db/**
      - scripts/ci/test-club-data-reads-each-window-once.py
      - scripts/ci/test-club-data-union-mtt-postgres.py
      - .github/workflows/club-data-reads-each-window-once.yml

permissions:
  contents: read

concurrency:
  group: club-data-reads-each-window-once-${{ github.ref }}
  cancel-in-progress: true

jobs:
  club-data-reads-each-window-once:
    name: Club Data and Union Data read each window once
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Club Data and Union Data read each window once
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-club-data-reads-each-window-once.py
      - name: Data ranks, recursive downlines and missing-club legacy APIs
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-club-data-union-mtt-postgres.py
      - name: Data player search uses authorized identities before its limit
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          AGENT_BOUNDARY_SCRATCH: ${{ runner.temp }}
        run: python3 scripts/ci/test-agent-data-boundary-postgres.py
      # 20261114235606 / 20261114235607: a union invoice week on Club Data is
      # the issued invoice, on the 02:00 Chicago boundary, and a renamed club
      # keeps its old slug.
      - name: Club Data reads the union invoice week from the invoice
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-club-data-union-invoice-week.py
      # 20261115020010 / 20261115020011: Club Data's accounting read model
      # carries the invoice's own records on the 02:00 Chicago day; the seed
      # and the live projection never overlap.
      - name: Club Data accounting read model
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-club-data-accounting-read-model.py
