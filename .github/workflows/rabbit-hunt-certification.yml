name: Rabbit Hunt Certification

# Daily live certification of VIP previous-hand rabbit hunting (#9233, #9314)
# on the supported certification route only: reserved accounts, a certification
# club's own opening grant, the audited self-expiring certification VIP, and
# guarded cleanup that always runs. While the serving engine does not carry the
# feature, the run ends UNKNOWN and creates nothing.

on:
  schedule:
    # 16:37 UTC = 10:37 Chicago / 09:37 Pacific: outside 06:00-09:00 Pacific and
    # outside the :50-:05 maintenance/migration freeze.
    - cron: '37 16 * * *'
  workflow_dispatch:

concurrency:
  # The run creates reserved fixtures and its own cleanup retires them; a later
  # run queues behind it and never cancels cleanup.
  group: rabbit-hunt-certification
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  certify:
    if: ${{ !((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]') }}
    runs-on: ubuntu-24.04
    environment: ci-main
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        timeout-minutes: 5
        run: |
          bash scripts/ci/ubuntu-apt.sh run npx playwright install --with-deps chromium
      - name: Certify Previous-Hand Rabbit Hunt On The Serving Engine
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_SUPABASE_ANON_KEY: 'sb_publishable__41LpJpzrfrb3hSUpEaYCA_tF53bBJx'
        run: node scripts/ci/certify-rabbit-hunt.mjs

  # A PRODUCTION CERTIFICATE THAT KEEPS FAILING REACHES A PERSON (2026-11-24).
  # Club Create Certification failed on every run for a week (2026-11-18 to
  # 2026-11-24) and Rabbit Hunt Certification on every daily run that week, and
  # each was only a red check run. This job rides the run: two failed
  # certificate runs in a row on main open one ProductionCertificationFailing
  # episode in public.operational_alert_events (later failures bump it), and a
  # passing run that covers it closes it. One failed run stays a red check.
  # Rules: scripts/ci/certification-failure-streak.mjs; route:
  # scripts/ci/record-post-deploy-verdict.mjs; pinned by
  # tests/unit/aProductionCertificateThatKeepsFailingReachesAPerson.test.ts.
  certification-verdict:
    needs: [certify]
    if: ${{ always() && needs.certify.result != 'skipped' && !((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]') }}
    name: This certificate admits a failure streak to the operational inbox
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 8
    permissions:
      # actions: read lets the streak step read earlier runs and this run's own
      # job record and log, and lets the recorder tell a replaced lane apart.
      actions: read
      contents: read
    steps:
      # Full commit history, no blobs: a pass closes an episode only when its
      # release descends from every release the episode failed on.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Decide whether this run starts or continues a failure streak
        id: streak
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_FILE: rabbit-hunt-certification.yml
          CERT_JOB: certify
          CERT_RESULT: ${{ needs.certify.result }}
        run: node scripts/ci/certification-failure-streak.mjs
      - name: Install the pinned database client
        if: steps.streak.outputs.record == 'yes'
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Record the certification verdict
        if: steps.streak.outputs.record == 'yes'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WORKFLOW_LABEL: Rabbit Hunt Certification
          ALERT_SOURCE: club-arena.rabbit-hunt-certification
          ALERT_NAME: ProductionCertificationFailing
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          LANES: |
            ${{ needs.certify.result }}|certify
          FAILURE_DETAIL: ${{ steps.streak.outputs.detail }}
        run: node scripts/ci/record-post-deploy-verdict.mjs
