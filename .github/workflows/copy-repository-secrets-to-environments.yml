name: Copy Repository Secrets To Environments
# One-shot move of repository-scoped secrets into main-only environments, so a
# merge-group run (whose workflow files can come from a fork pull request) can
# no longer read them. Values never leave GitHub: each secret is read inside
# this main-only job and written straight back through the API with an App
# installation token (secrets:write, environments:write). Nothing is printed.
# Owner authorization: 2026-11-11 03:19 America/Chicago. Delete this workflow
# once the repository-level copies are removed.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: copy-repository-secrets-to-environments
  cancel-in-progress: false

jobs:
  copy:
    if: github.ref == 'refs/heads/main' && github.repository == 'Smarter-Software-PIQ/Smarter-Poker-Club-Arena'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint the GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.AUTOPILOT_APP_ID }}
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
      - name: Copy each repository secret into its environments
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          S_AUTOPILOT_APP_PRIVATE_KEY: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          S_CA_ORIGIN_HOST: ${{ secrets.CA_ORIGIN_HOST }}
          S_CA_ORIGIN_HOST_KEY: ${{ secrets.CA_ORIGIN_HOST_KEY }}
          S_CA_ORIGIN_SSH_KEY: ${{ secrets.CA_ORIGIN_SSH_KEY }}
          S_CA_RECORD_GATEWAY_SSH_KEY: ${{ secrets.CA_RECORD_GATEWAY_SSH_KEY }}
          S_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          S_HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          S_HETZNER_HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
          S_HETZNER_SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          S_INTERNAL_API_KEY: ${{ secrets.INTERNAL_API_KEY }}
          S_PRIVATE_RECORD_GATEWAY_DB_PASSWORD: ${{ secrets.PRIVATE_RECORD_GATEWAY_DB_PASSWORD }}
          S_SP_EMAIL: ${{ secrets.SP_EMAIL }}
          S_SP_PASS: ${{ secrets.SP_PASS }}
          S_SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          S_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          S_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          set -euo pipefail
          ALL="AUTOPILOT_APP_PRIVATE_KEY CA_ORIGIN_HOST CA_ORIGIN_HOST_KEY CA_ORIGIN_SSH_KEY CA_RECORD_GATEWAY_SSH_KEY DATABASE_URL HETZNER_HOST HETZNER_HOST_KEY HETZNER_SSH_PRIVATE_KEY INTERNAL_API_KEY PRIVATE_RECORD_GATEWAY_DB_PASSWORD SP_EMAIL SP_PASS SUPABASE_DB_PASSWORD SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL"
          PR_SET="DATABASE_URL HETZNER_HOST HETZNER_HOST_KEY HETZNER_SSH_PRIVATE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL"
          HORSE_SET="DATABASE_URL HETZNER_HOST HETZNER_HOST_KEY HETZNER_SSH_PRIVATE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL"
          MONEY_SET="AUTOPILOT_APP_PRIVATE_KEY SUPABASE_SERVICE_ROLE_KEY SUPABASE_URL"
          # Every target must exist with exactly the expected branch rule.
          expect_policy() {
            got=$(gh api "repos/$REPO/environments/$1/deployment-branch-policies" --jq '[.branch_policies[].name]|sort|join(",")')
            [ "$got" = "$2" ] || { echo "::error::environment $1 branch rules are '$got', expected '$2'"; exit 1; }
          }
          expect_policy ci-main main
          expect_policy ci-pull-request 'refs/pull/*/merge'
          expect_policy HorseCorrectiveQualification main
          expect_policy money-trigger-recovery-trusted main
          copy() { # env, names...
            env_name=$1; shift
            for n in "$@"; do
              v="S_$n"
              if [ -z "${!v:-}" ]; then echo "skip $n -> $env_name (empty at repository scope)"; continue; fi
              printf '%s' "${!v}" | gh secret set "$n" --env "$env_name" --repo "$REPO" >/dev/null
              echo "copied $n -> $env_name"
            done
          }
          copy ci-main $ALL
          copy ci-pull-request $PR_SET
          copy HorseCorrectiveQualification $HORSE_SET
          copy money-trigger-recovery-trusted $MONEY_SET
          for e in ci-main ci-pull-request HorseCorrectiveQualification money-trigger-recovery-trusted; do
            echo "$e: $(gh api "repos/$REPO/environments/$e/secrets?per_page=100" --jq '[.secrets[].name]|join(" ")')"
          done
