# DRY RUN ONLY. This workflow validates the held-out plan boundary without
# reserving anything. It is not the qualification provider: reservation
# accounting in server/src/benchmark/IncrementalPressureQualification.ts is
# scoped to the real workflow's id (family.providerAnchor.workflowId) and to
# runs whose path is .github/workflows/horse-feature-ablation-qualification.yml,
# so a run of this file can never appear in that inventory or reserve a
# held-out partition. It performs the same operations tests and the same plan
# validation as the real plan job, with --preflight skipping only the
# assertions that the current process is itself a provider run. It writes no
# registry, deals no seed and dispatches nothing.
name: Horse Feature Ablation Preflight Dry Run
run-name: Preflight dry run (no reservation) ${{ inputs.target }} at ${{ inputs.source_sha }}
on:
  workflow_dispatch:
    inputs:
      target:
        description: One independently preregistered contrast to validate read-only
        required: true
        type: choice
        options:
          [
            plo6_v24,
            v53_pressure,
            combo_draw_pressure,
            targeted_river_bluff,
            river_position_defense,
            river_bluff_checkraise,
            barrel_continuation_outlook,
            pressure_package,
            small_pot_near_nut_value_raise,
            multiway_river_bluff_checkraise,
          ]
      source_sha:
        description: Exact protected-main commit to validate against the locked contract
        required: true
        type: string
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: horse-feature-ablation-preflight-dry-run
  cancel-in-progress: false
env:
  SUPABASE_URL: https://supabase.invalid
  SUPABASE_SERVICE_ROLE_KEY: feature-ablation-offline-placeholder
jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Admit exact protected source and declared target
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.target }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$TARGET" =~ ^(plo6_v24|v53_pressure|combo_draw_pressure|targeted_river_bluff|river_position_defense|river_bluff_checkraise|barrel_continuation_outlook|pressure_package|small_pot_near_nut_value_raise|multiway_river_bluff_checkraise)$ ]] || exit 1
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Select only a protected containing revision
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          git cat-file -e "$SOURCE_SHA^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          git checkout --detach "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - name: Run the plan job's operations tests and the read-only preflight
        # bash -eo pipefail: a crashed or refusing preflight must fail this step,
        # not hide behind tee's exit status (2026-11-11: a crash passed green).
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET: ${{ inputs.target }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --test tests/operations/feature-ablation-assemble.test.mjs tests/operations/feature-ablation-artifact-custody.test.mjs
          cd server
          npx tsx src/scripts/featureAblationQualify.ts --plan --preflight --target="$TARGET" --source-sha="$SOURCE_SHA" | tee "$RUNNER_TEMP/preflight-verdict.json"
          node -e 'const v = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").at(-1)); if (v.mode !== "preflight" || v.ok !== true) process.exit(1)' "$RUNNER_TEMP/preflight-verdict.json"
      - name: Retain the verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fa-preflight-${{ inputs.target }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/preflight-verdict.json
          if-no-files-found: ignore
          retention-days: 30
