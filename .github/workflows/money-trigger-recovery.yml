name: Trusted Money Trigger Recovery
run-name: Money trigger proof ${{ inputs.request_id || github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
on:
  workflow_dispatch:
    inputs:
      candidate_bundle:
        description: Bounded deflate/base64 committed migration data
        required: true
        type: string
      request_id:
        description: Unique local request identifier for bounded await
        required: true
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  # MERGE QUEUE (2026-11-11): a queued merge group is verified by the same
  # trusted default-branch code. workflow_run always runs main's copy of this
  # file, so the environment's main-only deployment policy holds and no code
  # from the queued commit ever runs with the reporter key.
  workflow_run:
    workflows: [Money Trigger Merge Group Request]
    types: [requested]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: money-trigger-recovery-${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha || github.run_id }}
  cancel-in-progress: false
jobs:
  verify:
    name: Trusted verifier execution
    # A fork pull request never mints the reporter App token (2026-11-11):
    # it gets no Money trigger check, so it cannot satisfy the required check
    # or enter the merge queue; fork-refused below says why. A workflow
    # dispatch sent by a job token (queued or pull request code) is refused.
    if: >-
      ${{ !(((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.triggering_actor == 'github-actions[bot]')) && ((github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.repo.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.triggering_actor != 'github-actions[bot]')) }}
    # MUST be configured for main-only deployment branches before activation.
    # Reporter app key is environment-scoped, never a repository/PR secret.
    environment: money-trigger-recovery-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mint check-only reporter
        if: github.event_name == 'pull_request_target'
        id: reporter
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MONEY_TRIGGER_REPORTER_APP_ID }}
          private-key: ${{ secrets.MONEY_TRIGGER_REPORTER_PRIVATE_KEY }}
          permission-checks: write
      - name: Start explicit captured-head check
        if: github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORTER_APP_ID: ${{ vars.MONEY_TRIGGER_REPORTER_APP_ID }}
          REPORTER_TOKEN: ${{ steps.reporter.outputs.token }}
        run: node scripts/ci/money-trigger-check-report.mjs begin
      - name: Verify exact live recovery with trusted code
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_BUNDLE: ${{ inputs.candidate_bundle }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/produce-money-trigger-recovery.mjs
      # GitHub reveals bypass_actors only to a ruleset writer. This existing
      # infrastructure App is restricted to this repository and Administration;
      # trusted finish code performs one GET, then immediately revokes it.
      # It is never the financial check reporter or a PR/SQL credential.
      - name: Mint short-lived protection reader
        if: success() && github.event_name == 'pull_request_target'
        id: protection-reader
        uses: actions/create-github-app-token@v3
        with:
          app-id: '4680372'
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Smarter-Poker-Club-Arena
          permission-administration: write
          # Keep automatic cancellation cleanup; normal finish revokes sooner.
          skip-token-revoke: false
      - name: Finish explicit captured-head check
        if: always() && github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPORTER_APP_ID: ${{ vars.MONEY_TRIGGER_REPORTER_APP_ID }}
          REPORTER_TOKEN: ${{ steps.reporter.outputs.token }}
          VERIFY_OUTCOME: ${{ steps.proof.outcome }}
          PROTECTION_READER_TOKEN: ${{ steps.protection-reader.outputs.token }}
        run: node scripts/ci/money-trigger-check-report.mjs finish
      - uses: actions/upload-artifact@v4
        if: success() && github.event_name == 'workflow_dispatch'
        with:
          name: money-trigger-recovery-${{ steps.proof.outputs.head }}
          path: money-trigger-recovery.json
          if-no-files-found: error
          retention-days: 1

  fork-refused:
    name: Fork pull requests are not admitted to the money trigger proof
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Refuse without minting the reporter token
        run: |
          echo '::error::A pull request from a fork is not admitted: recreate it as a branch in this repository after review.'
          exit 1

  verify_merge_group:
    name: Trusted merge-group verifier execution
    # Only GitHub's own workflow_run fields are trusted: the source run must be
    # a merge_group run of this repository on main's queue. A same-named
    # workflow from a pull request carries event pull_request and is refused.
    if: >-
      ${{ !(((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && github.triggering_actor == 'github-actions[bot]')) && (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'merge_group' && github.event.workflow_run.head_repository.full_name == github.repository && startsWith(github.event.workflow_run.head_branch, 'gh-readonly-queue/main/')) }}
    environment: money-trigger-recovery-trusted
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mint check-only reporter
        id: reporter
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.MONEY_TRIGGER_REPORTER_APP_ID }}
          private-key: ${{ secrets.MONEY_TRIGGER_REPORTER_PRIVATE_KEY }}
          permission-checks: write
      - name: Start explicit merge-group check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORTER_APP_ID: ${{ vars.MONEY_TRIGGER_REPORTER_APP_ID }}
          REPORTER_TOKEN: ${{ steps.reporter.outputs.token }}
          GROUP_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GROUP_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: node scripts/ci/money-trigger-check-report.mjs begin-group
      - name: Verify the merge group's migrations with trusted code
        id: proof
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROUP_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GROUP_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/ci/produce-money-trigger-recovery.mjs
      - name: Mint short-lived protection reader
        if: success()
        id: protection-reader
        uses: actions/create-github-app-token@v3
        with:
          app-id: '4680372'
          private-key: ${{ secrets.AUTOPILOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: Smarter-Poker-Club-Arena
          permission-administration: write
          skip-token-revoke: false
      - name: Finish explicit merge-group check
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPORTER_APP_ID: ${{ vars.MONEY_TRIGGER_REPORTER_APP_ID }}
          REPORTER_TOKEN: ${{ steps.reporter.outputs.token }}
          VERIFY_OUTCOME: ${{ steps.proof.outcome }}
          PROTECTION_READER_TOKEN: ${{ steps.protection-reader.outputs.token }}
        run: node scripts/ci/money-trigger-check-report.mjs finish-group
