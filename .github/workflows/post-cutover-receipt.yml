name: Post-Cutover Audit Receipt

# THE CUTOVER POSTS ITS OWN AUDIT RECEIPT (Horse SWITCH lane, 2026-11-26).
# When the engine receiver finishes (it seals or refuses a release and posts the cycle on issue #11599), or Stage
# finishes (it posts KEEP-SERVING), a secret-free gate asks whether that run posted a cycle result; only then does
# this run the read-only post-cutover audit against production and answers that cycle's comment once
# (scripts/ops/post-cutover-receipt.mjs). Reporting only: it never dispatches, retries or advances a release,
# writes nothing to the database (read-only transaction) and posts one comment. It is not a release control:
# no release workflow reads it and none waits for it.
on:
  workflow_run:
    workflows:
      - 'Auto-Deploy Hetzner Engine (on server/ changes)'
      - 'Stage Exact Club Arena Engine Release'
    types: [completed]
  workflow_dispatch:
    inputs:
      receiver_run_id:
        description: 'Run id of the receiver or Stage run whose cycle comment to answer'
        required: true

permissions: {}

concurrency:
  group: post-cutover-receipt-${{ github.event.workflow_run.id || inputs.receiver_run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Did This Run Post A Cycle Result
    # No secret here. Only this repository's own receiver (started by a cutover) or Stage file, on main, by hand.
    if: ${{ !((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) && (github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository && ((github.event.workflow_run.path == '.github/workflows/auto-deploy-hetzner.yml' && github.event.workflow_run.event == 'repository_dispatch') || github.event.workflow_run.path == '.github/workflows/stage-engine-release.yml'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      needed: ${{ steps.find.outputs.needed }}
      run_id: ${{ steps.find.outputs.run_id }}
      late: ${{ steps.find.outputs.late }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Find the cycle comment this run posted, or the oldest cycle still without a receipt
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIVER_RUN_ID: ${{ github.event.workflow_run.id || inputs.receiver_run_id }}
        run: node scripts/ops/post-cutover-receipt.mjs --find

  receipt:
    name: Audit Production And Answer The Cutover Comment
    needs: gate
    # A job-token dispatch or re-run never reaches the secret (tests/unit/aJobTokenCannotStartTrustedWork.law.test.ts).
    if: ${{ !((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) && needs.gate.outputs.needed == 'true' && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    environment: ci-main
    # One audit at a time across all runs, so two gates that found the same orphan never post twice (the audit
    # re-reads the log right before posting).
    concurrency:
      group: post-cutover-receipt-audit
      cancel-in-progress: false
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the live release and enough history for the ancestry check
        env:
          RECEIVER_RUN_ID: ${{ needs.gate.outputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RECEIVER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          sha=$(curl -fsS --max-time 15 https://engine.smarter.poker/health | python3 -c 'import json,sys; print(json.load(sys.stdin).get("releaseSha") or "")') || sha=''
          # A sealed or serving commit can sit a few hundred commits below the live one; fetch that much.
          if [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then git fetch -q --depth=500 origin "$sha" || true; fi

      - name: Audit and post the receipt
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIVER_RUN_ID: ${{ needs.gate.outputs.run_id }}
          RECEIPT_LATE: ${{ needs.gate.outputs.late }}
          AUDIT_DB_URL_ENV: AUDIT_DATABASE_URL
          AUDIT_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/ops/post-cutover-receipt.mjs

      - name: Compare pre-cutover (:45) vs post-cutover (:15) /health baseline diff
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIVER_RUN_ID: ${{ needs.gate.outputs.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$RECEIVER_RUN_ID" =~ ^[1-9][0-9]*$ ]] || exit 0
          DIFF_DIR="$RUNNER_TEMP/post-cutover-diff-$RECEIVER_RUN_ID"
          mkdir -p "$DIFF_DIR"
          PRE_FILE="$DIFF_DIR/pre-cutover-health.json"
          POST_FILE="$DIFF_DIR/post-cutover-health.json"
          DIFF_JSON="$DIFF_DIR/baseline-diff.json"
          DIFF_MD="$DIFF_DIR/baseline-diff.md"
          ART_ID="$(gh api "repos/$REPO/actions/runs/$RECEIVER_RUN_ID/artifacts?per_page=30" \
            --jq "[.artifacts[] | select((.name | startswith(\"pre-cutover-health-$RECEIVER_RUN_ID-\")) and (.expired | not))][0].id // empty" 2>/dev/null || true)"
          if [[ "$ART_ID" =~ ^[1-9][0-9]*$ ]]; then
            if gh api "repos/$REPO/actions/artifacts/$ART_ID/zip" > "$DIFF_DIR/pre.zip" 2>/dev/null; then
              unzip -oq "$DIFF_DIR/pre.zip" -d "$DIFF_DIR/pre-unpacked" 2>/dev/null || true
              FOUND="$(find "$DIFF_DIR/pre-unpacked" -maxdepth 2 -type f -name 'pre-cutover-health-*.json' | head -1 || true)"
              [ -n "$FOUND" ] && cp "$FOUND" "$PRE_FILE"
            fi
          fi
          curl -fsS --max-time 15 -H 'Cache-Control: no-cache, no-store' \
            "https://engine.smarter.poker/health?nocache=$(date +%s%N)" -o "$POST_FILE" || : > "$POST_FILE"
          set +e
          python3 -B scripts/release/post-cutover-baseline-diff.py \
            --pre "$PRE_FILE" --post "$POST_FILE" \
            --json-out "$DIFF_JSON" --markdown-out "$DIFF_MD"
          DIFF_RC=$?
          set -e
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -r "$DIFF_MD" ]; then
            cat "$DIFF_MD" >> "$GITHUB_STEP_SUMMARY" || true
          fi
          case "$DIFF_RC" in
            0) echo "Post-cutover :45 vs :15 baseline diff: HEALTHY." ;;
            2) echo "::warning title=Post-Cutover Baseline Regression Warning::Relative telemetry regression detected at :15 (non-fatal exit 2); see job summary." ;;
            1) echo "::error title=Post-Cutover Hard SLO Breach::Hard SLO breach detected at :15 in post-cutover baseline diff (exit 1); see job summary." ;;
            3) echo "::warning title=Post-Cutover Baseline Diff Unreadable::Pre-cutover (:45) or post-cutover (:15) snapshot unavailable/unreadable (fail-safe exit 3)." ;;
            *) echo "::warning title=Post-Cutover Baseline Diff Unexpected Exit::Unexpected exit code $DIFF_RC." ;;
          esac
