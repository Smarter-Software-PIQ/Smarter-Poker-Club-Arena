name: Diamond snapshot classifies holders once
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261028151339_diamond_snapshot_classifies_its_holder_set_once.sql
      - scripts/ci/test-diamond-snapshot-holder-set.py
      - scripts/ci/fixtures/diamond-snapshot-holder-*
      - .github/workflows/diamond-snapshot-holder-set.yml
permissions:
  contents: read
concurrency:
  group: diamond-snapshot-holder-set-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: Diamond snapshot holder-set native regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Run original and candidate snapshot writers
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-diamond-snapshot-holder-set.py
      - name: Retain native accounting and query-plan evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-snapshot-holder-set-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/diamond-snapshot-holder-set/
          retention-days: 7
          if-no-files-found: error
