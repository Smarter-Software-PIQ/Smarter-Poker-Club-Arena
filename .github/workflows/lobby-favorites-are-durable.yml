name: Lobby favorites and filters are durable

# Migration 20261105183133. Runs scripts/dev/test-lobby-favorites-postgres.sh
# against a throwaway PostgreSQL 17 cluster, never production: favorites follow
# the game (schedule, catalogue definition, cash game) through renames, finished
# runs and rebuilt tables without merging same-named games across clubs,
# variants or stakes; only the owner or account deletion changes a favorite,
# saved filter or page preference; and a late replay of an older choice cannot
# overwrite a newer one. No timer (CLAUDE.md 10.85): pull_request only, scoped
# to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261105183133_lobby_favorites_follow_the_game_not_the_row.sql
      - scripts/dev/test-lobby-favorites-postgres.sh
      - .github/workflows/lobby-favorites-are-durable.yml

permissions:
  contents: read

concurrency:
  group: lobby-favorites-are-durable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lobby-favorites-are-durable:
    name: Lobby favorites and filters are durable
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Favorites follow the game and only their owner changes them
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          set -euo pipefail
          bash scripts/dev/test-lobby-favorites-postgres.sh 2>&1 | tee "$RUNNER_TEMP/lobby-favorites.log"
          # The script exits 0 only after its last check; prove it got there.
          grep -q 'all checks passed' "$RUNNER_TEMP/lobby-favorites.log"
          echo "Checks passed: $(grep -c 'PASS:' "$RUNNER_TEMP/lobby-favorites.log")" >> "$GITHUB_STEP_SUMMARY"
