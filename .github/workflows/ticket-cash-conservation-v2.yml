name: The payout sweep never reads a cash paid ticket as pool money

# fn_pay_backed_payout_shortfalls (migration 20261015170338). Runs
# scripts/ci/test-ticket-cash-conservation-v2.py against a throwaway
# PostgreSQL 17 cluster, never production: the exact production definitions
# captured 2026-10-15 (pg_get_functiondef md5 equal to the live functions)
# must read a target whose only holding is a cash-paid satellite ticket as
# payable, and the migration must make the payer select exactly the events the
# corrected scalar reads above 0.01, keep a real shortfall payable, refuse
# ahead of the scalar and reproduce production's derived postimage md5. No
# timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
# ci.yml has no push trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015170338_the_payout_sweep_never_reads_a_cash_paid_ticket_as_pool_mone.sql
      - scripts/ci/fixtures/ticket-cash-conservation-v2/**
      - scripts/ci/fixtures/backed-payout-scan/diamond-book-scalar.sql
      - scripts/ci/test-ticket-cash-conservation-v2.py
      - .github/workflows/ticket-cash-conservation-v2.yml

permissions:
  contents: read

concurrency:
  group: ticket-cash-conservation-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ticket-cash-conservation-v2:
    name: A cash paid ticket is not pool money to the payout sweep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: A cash paid ticket is not pool money to the payout sweep
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-ticket-cash-conservation-v2.py --output artifacts/ticket-cash-conservation-v2
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket-cash-conservation-v2-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ticket-cash-conservation-v2/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
