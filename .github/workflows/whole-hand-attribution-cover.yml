name: Whole-hand attribution cover

on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
      - scripts/ci/fixtures/whole-hand-attribution-cover/**
      - scripts/ci/test-whole-hand-attribution-cover-postgres.py
      - .github/workflows/whole-hand-attribution-cover.yml
      - tests/whole-hand-quality-reads-the-attribution-cover.law.test.ts

permissions:
  contents: read

concurrency:
  group: whole-hand-attribution-cover-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whole-hand-attribution-cover:
    name: Whole-hand attribution cover
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Whole-hand attribution cover
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 -B scripts/ci/test-whole-hand-attribution-cover-postgres.py --pg-bin "$PG_BIN" --scratch "${{ runner.temp }}"
