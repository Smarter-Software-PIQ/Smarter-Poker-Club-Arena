name: Mutual friends are unique players
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/**
      - scripts/ci/fixtures/mutual-friends-baseline.sql
      - scripts/ci/test-mutual-friends-unique-postgres.py
      - .github/workflows/mutual-friends-unique.yml
# A newer push to the same pull request fully supersedes this pure check
# (pull_request runs on refs/pull/N/merge), and the job mutates nothing
# outside its runner. Cancel the stale run instead of queueing it.
concurrency:
  group: mutual-friends-unique-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  mutual-friends-unique:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Reciprocal edges return each mutual player once
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-mutual-friends-unique-postgres.py
