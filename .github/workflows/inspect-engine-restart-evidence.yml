name: Inspect Engine Restart Evidence (Read Only)
on:
  workflow_dispatch:
    inputs:
      expected_engine_sha:
        description: Exact full currently serving engine release SHA
        required: true
        type: string
      window_start_utc:
        description: Window start, UTC, YYYY-MM-DDTHH:MM:SSZ (within the last 7 days)
        required: true
        type: string
      window_minutes:
        description: Window length in minutes (5-60)
        required: true
        type: string
        default: '30'
      focus_prefix:
        description: Optional 8-character tournament or table id prefix to template, or - for none
        required: true
        type: string
        default: '-'
permissions:
  contents: read
jobs:
  inspect:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (github.actor != 'github-actions[bot]' && github.triggering_actor != 'github-actions[bot]') && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 4
    env:
      EXPECTED_ENGINE_SHA: ${{ inputs.expected_engine_sha }}
      WINDOW_START_UTC: ${{ inputs.window_start_utc }}
      WINDOW_MINUTES: ${{ inputs.window_minutes }}
      FOCUS_PREFIX: ${{ inputs.focus_prefix }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Read masked restart evidence with pinned SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected SHA refused'; exit 1; }
          [[ "$WINDOW_START_UTC" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$ ]] || { echo '::error::Window start refused'; exit 1; }
          [[ "$WINDOW_MINUTES" =~ ^[0-9]{1,2}$ ]] || { echo '::error::Window refused'; exit 1; }
          [[ "$FOCUS_PREFIX" =~ ^(-|[0-9a-f]{8})$ ]] || { echo '::error::Focus prefix refused'; exit 1; }
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::Configured host refused'; exit 1; }
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ] || { echo '::error::Configured SSH metadata unavailable'; exit 1; }
          SSH_DIR="$RUNNER_TEMP/engine-restart-ssh-$GITHUB_RUN_ID"
          install -d -m 0700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          ssh-keygen -y -f "$SSH_DIR/key" >/dev/null
          ssh-keygen -l -f "$SSH_DIR/known_hosts" >/dev/null
          timeout --signal=TERM --kill-after=5s 170s ssh \
            -i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=2 \
            "root@$HETZNER_HOST" "python3 - '$EXPECTED_ENGINE_SHA' '$WINDOW_START_UTC' '$WINDOW_MINUTES' '$FOCUS_PREFIX'" \
            < scripts/ci/inspect-engine-restart-evidence.py > "$RUNNER_TEMP/engine-restart-evidence.json"
          cat "$RUNNER_TEMP/engine-restart-evidence.json"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-restart-evidence-read-only-${{ github.run_id }}
          path: ${{ runner.temp }}/engine-restart-evidence.json
          if-no-files-found: error
          retention-days: 7
