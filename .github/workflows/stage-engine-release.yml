name: Stage Exact Club Arena Engine Release

# A reviewed server change must enter the existing Hetzner release lane as soon
# as it reaches protected main. The owning deploy workflow still builds, tests,
# waits for the certified table break, cuts over, and proves the release. This
# signal has no SSH, environment, source-write, or restart authority.
#
# The window-migrations job (2026-10-22) is the one database writer here: on
# the admitted daily preparation run only (03:30 America/Chicago, see the
# admission step), it installs migrations that declare
# "-- @install-window: daily-maintenance" inside the 04:00 freeze
# (scripts/ci/install-window-migrations.mjs). It sends no event, and never
# touches the engine or the host.
#
# The daily owner can reserve at most five elapsed hours before 03:30 Chicago.
# This removes the need for an event to arrive in one twenty-minute interval:
# GitHub delivered the November 8 scheduled event six hours late. Protected
# pushes, automatic push-Backup completions and the existing schedule compete
# for one dated reservation. Its original job waits once until the cutoff,
# refreshes protected source, then uses the same selection and receiver.
# A missed date or failed owner never gains a retry. Changed release authority
# is not a retry: the date belongs to the first run reserved under the release
# controls the cutoff binds, and a run reserved under older controls refuses.
run-name: ${{ github.event_name == 'repository_dispatch' && (github.event.action == 'prepare-daily-engine' && github.event.sender.type == 'User' && 'Original operator daily preparation' || 'Operator request outside election') || github.event_name == 'workflow_run' && (github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/backup-engine.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.conclusion == 'success' && 'Automatic Backup daily reservation' || 'Backup completion outside election') || 'Daily engine reservation' }}
on:
  repository_dispatch:
    types: [prepare-daily-engine]
  workflow_run:
    workflows: ['Backup Engine (Clone, Stage, Certify)']
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      owner_window_id:
        description: 'Exact protected owner window identity'
        required: true
        type: string
      request_engine_release:
        description: 'Explicit finite protected owner engine selection; requires completed exact qualification'
        required: false
        default: false
        type: boolean
      request_database_break:
        description: 'Explicit reviewed DB-only maintenance reservation; never replaces the engine'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  schedule:
    # Early UTC DST twins plus the existing preparation chances. A delivered
    # event outside the five-hour reservation / twenty-minute preparation
    # range does nothing. No second scheduler or publisher is introduced.
    - cron: '31,35,39,43 3,8 * * *'
    - cron: '31,35,39,43 4,9 * * *'

permissions: {}

jobs:
  detect:
    if: (github.event_name != 'workflow_dispatch' || (inputs.request_engine_release && !inputs.request_database_break && github.ref == 'refs/heads/main')) && (github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.path == '.github/workflows/backup-engine.yml' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.run_attempt == 1 && github.event.workflow_run.conclusion == 'success'))
    name: Prove Whether The Server Tree Changed
    runs-on: ubuntu-latest
    timeout-minutes: 315
    permissions:
      contents: read
      actions: read
    outputs:
      protected_sha: ${{ steps.cutoff.outputs.sha }}
      window_sha: ${{ steps.window_source.outputs.sha }}
      release_required: ${{ steps.change.outputs.release_required }}
      target_sha: ${{ steps.change.outputs.target_sha }}
      observed_live_sha: ${{ steps.change.outputs.observed_live_sha }}
      offer_reason: ${{ steps.change.outputs.offer_reason }}
      admission_allowed: ${{ steps.admission.outputs.allowed }}
      owner_window_id: ${{ steps.admission.outputs.owner_window_id }}
      daily_preparation: ${{ steps.admission.outputs.daily_preparation }}
      daily_preparation_date: ${{ steps.admission.outputs.daily_preparation_date }}
    steps:
      # Do not use push.paths here. GitHub only evaluates a bounded portion of
      # a very large diff for path filters, which can omit a real server change
      # and silently strand that SHA. Every main push enters this read-only
      # detector; only the exact tree comparison may suppress the signal.
      - name: Checkout the exact protected-main push
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          # blob:none keeps every one of the 7,223 commits and drops the blobs of old
          # revisions. Measured 2026-09-13, three runs each: 33-35s / 531MB against
          # 36-43s / 766MB, for identical ancestry. Nothing in this repo's workflows
          # reads a historical file version - they ask merge-base, rev-list, log and
          # cat-file -e, which are all commit-graph work - so those blobs were paid
          # for on every run and never read.
          filter: blob:none
          # Admission needs only these working-tree files. Historical policy,
          # source witnesses and server-tree selection still read full Git objects.
          # Avoid hydrating unrelated client/assets before the bounded reservation.
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/ci/read-engine-prequalification.py
            /server/scripts/engine-release-seal.py
            /server/release/owner-maintenance-windows.json
            /server/release/activation-floor.json

      # Owner 2026-10-20 explicitly requests daily routine updates. The daily
      # preparation window is 03:30-03:50 America/Chicago (DST aware). The
      # first eligible Stage run created up to five elapsed hours early
      # reserves that Chicago date and waits once until the cutoff; no repair timer, secondary
      # publisher or automatic deadline-emergency exists. Commit-message
      # urgency is not authorization to interrupt live games.
      - name: Admit daily preparation or a measured engine emergency
        id: admission
        env:
          EVENT_NAME: ${{ github.event_name }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          PUSHED_AT: ${{ github.event.repository.pushed_at || '' }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          OWNER_WINDOW_ID: ${{ inputs.owner_window_id }}
          REQUEST_ENGINE_RELEASE: ${{ inputs.request_engine_release }}
        run: |
          set -euo pipefail
          allowed=false
          owner_window_id=''
          POLICY=$(python3 server/scripts/engine-release-seal.py schedule-policy --repo . --sha "$GITHUB_SHA")
          PHASE1_ACTIVE=$(printf '%s' "$POLICY" | python3 -c 'import json,sys; print("true" if json.load(sys.stdin)["phase1Status"]=="active" else "false")')
          PHASE1_RESTORING=false
          if [ "$PHASE1_ACTIVE" = false ]; then
            HEALTH=$(curl -fsS --max-time 15 -H 'Cache-Control:no-cache' https://engine.smarter.poker/health) || HEALTH='{}'
            if printf '%s' "$HEALTH" | python3 server/scripts/engine-release-seal.py restoration-needed --repo . --sha "$GITHUB_SHA"; then
              PHASE1_RESTORING=true
            fi
          fi
          export PHASE1_ACTIVE PHASE1_RESTORING
          daily_preparation=false
          daily_date=''
          cutoff_epoch=''
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || { echo "::error::A daily reservation cannot be replayed."; exit 1; }
          # Original event time selects one bounded reservation date. A delayed
          # event cannot claim an expired date, and a rerun cannot reserve again.
          moment=''
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_run ] || { [ "$EVENT_NAME" = repository_dispatch ] && [ "$SENDER_TYPE" = User ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; }; then
            moment=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq .created_at) || moment=''
          elif [ "$EVENT_NAME" = push ]; then
            moment="${PUSHED_AT:-}"
          fi
          window=''
          if [ -n "$moment" ]; then
            window=$(MOMENT="$moment" python3 - <<'PYTHON'
          import os
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo
          # The daily preparation window, America/Chicago wall clock.
          START_HOUR, START_MINUTE, WINDOW_MINUTES = 3, 30, 20
          raw = os.environ["MOMENT"].strip()
          try:
              if raw.isdigit():
                  moment = datetime.fromtimestamp(int(raw), timezone.utc)
              else:
                  moment = datetime.fromisoformat(raw.replace("Z", "+00:00"))
          except ValueError:
              raise SystemExit(1)
          if moment.utcoffset() is None:
              raise SystemExit(1)
          local = moment.astimezone(ZoneInfo("America/Chicago"))
          start = local.replace(hour=START_HOUR, minute=START_MINUTE, second=0, microsecond=0).astimezone(timezone.utc)
          # Reserve at most five elapsed hours early, including DST transition days.
          if moment.astimezone(timezone.utc) >= start + timedelta(minutes=WINDOW_MINUTES):
              tomorrow = local.date() + timedelta(days=1)
              start = datetime.combine(tomorrow, datetime.min.time(), ZoneInfo("America/Chicago")).replace(hour=3, minute=30).astimezone(timezone.utc)
          end = start + timedelta(minutes=WINDOW_MINUTES)
          reservation = start - timedelta(hours=5)
          if os.environ["EVENT_NAME"] == "repository_dispatch" and moment.astimezone(timezone.utc) < start:
              raise SystemExit(1)
          if not (reservation <= moment.astimezone(timezone.utc) < end):
              raise SystemExit(1)
          print(start.astimezone(ZoneInfo("America/Chicago")).date().isoformat(), reservation.strftime("%Y-%m-%dT%H:%M:%SZ"), end.strftime("%Y-%m-%dT%H:%M:%SZ"), int(start.timestamp()))
          PYTHON
            ) || window=''
          fi
          if [ -n "$window" ]; then
            read -r daily_date window_start window_end cutoff_epoch <<< "$window"
            # ONCE PER CHICAGO DATE. The first eligible Stage run created in
            # the reservation/preparation interval owns the preparation; GitHub run ids only increase,
            # so "an earlier run in this window exists" is a lower id. A list
            # that cannot be read is UNKNOWN and prepares nothing (10.86).
            verdict=unknown
            runs_file=$(mktemp "$RUNNER_TEMP/daily-reservations.XXXXXXXX")
            trap 'rm -f -- "$runs_file"' EXIT
            if gh api --paginate --slurp "repos/$REPO/actions/workflows/stage-engine-release.yml/runs?created=${window_start}..${window_end}&per_page=100" > "$runs_file"; then
              verdict=$(RUNS_FILE="$runs_file" WINDOW_START="$window_start" WINDOW_END="$window_end" CUTOFF_EPOCH="$cutoff_epoch" python3 - <<'PYTHON'
          import importlib.util, json, os, re, sys
          from datetime import datetime
          def when(value):
              moment = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if moment.utcoffset() is None:
                  raise ValueError("run time has no timezone")
              return moment
          # THE DATE FOLLOWS THE RELEASE CONTROLS (2026-11-13). The cutoff step
          # refuses a run whose own source carries other release controls than
          # protected main at the cutoff ("never execute new release authority
          # under an old reservation owner"). The election used to hand the
          # date to the earliest run regardless, so one release-control merge
          # during the five-hour reservation (an owner-window booking in
          # server/release/owner-maintenance-windows.json, 2026-11-11 and
          # 2026-11-13) stranded the whole day: the owner refused at 03:30 and
          # every later run, which carried the new controls, had deferred to it.
          # EngineCutoverMissed fired both mornings. An earlier run reserved
          # under different release controls than this run's source is not an
          # owner, so the first run carrying the controls the cutoff binds owns
          # the date and nothing runs under older authority. A projection that
          # cannot be read keeps the earlier run as owner, as before.
          def authority_reader():
              try:
                  spec = importlib.util.spec_from_file_location("qualification", "scripts/ci/read-engine-prequalification.py")
                  module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
                  return module
              except Exception:
                  return None
          reader = authority_reader()
          def authority(sha):
              if reader is None or not isinstance(sha, str) or not re.fullmatch(r"[0-9a-f]{40}", sha):
                  return None
              try:
                  return reader.projection(sha, release_authority=True)
              except Exception:
                  return None
          try:
              me = int(os.environ["RUN_ID"])
              mine = authority(os.environ.get("GITHUB_SHA", ""))
              start, end = when(os.environ["WINDOW_START"]), when(os.environ["WINDOW_END"])
              with open(os.environ["RUNS_FILE"], encoding="utf-8") as source:
                  document = json.load(source)
              pages = document if isinstance(document, list) else [document]
              runs = [run for page in pages for run in page.get("workflow_runs", [])]
              if not pages or any(not isinstance(page.get("workflow_runs"), list) for page in pages):
                  raise ValueError("run list unreadable")
              ids = [run.get("id") for run in runs]
              if any(type(rid) is not int or rid <= 0 for rid in ids) or len(ids) != len(set(ids)):
                  raise ValueError("reservation run identities incomplete")
              earlier = []
              for run in runs:
                  stamp = when(run["created_at"])
                  original_window = stamp.timestamp() >= int(os.environ["CUTOFF_EPOCH"])
                  title = run.get("display_title")
                  automatic_backup = run.get("event") == "workflow_run" and (title == "Automatic Backup daily reservation" or (original_window and title == "Automatic protected Backup finished"))
                  ordinary = run.get("event") in ("push", "schedule") and (title == "Daily engine reservation" or original_window)
                  operator = run.get("event") == "repository_dispatch" and original_window and run.get("actor", {}).get("type") == "User" and title == "Original operator daily preparation"
                  if (not ordinary and not automatic_backup and not operator) or run.get("head_branch") != "main":
                      continue
                  if not (start <= when(run["created_at"]) < end):
                      continue
                  if type(run.get("id")) is not int:
                      raise ValueError("run id unreadable")
                  if run["id"] < me:
                      theirs = authority(run.get("head_sha")) if mine is not None else None
                      if theirs is not None and theirs != mine:
                          print(f"Earlier run {run['id']} reserved under other release controls; it cannot own this date.", file=sys.stderr)
                          continue
                      earlier.append(run["id"])
              if earlier:
                  print("false", min(earlier))
              elif all(type(page.get("total_count")) is int and page["total_count"] <= len(runs) for page in pages):
                  print("true", me)
              else:
                  print("unknown -")
          except (KeyError, TypeError, ValueError):
              print("unknown -")
          PYTHON
              ) || verdict=unknown
            fi
            read -r daily_preparation daily_owner <<< "$verdict"
            case "$daily_preparation" in
              true)
                allowed=true
                echo "Daily preparation for $daily_date (Chicago) is owned by this run ($RUN_ID)." ;;
              false)
                echo "Daily preparation for $daily_date (Chicago) belongs to earlier run $daily_owner; this run prepares nothing for it." ;;
              *)
                daily_preparation=unknown
                echo "::warning title=DAILY PREPARATION UNKNOWN::Could not read this workflow's runs in the $daily_date window; this run prepares nothing for it." ;;
            esac
          fi
          # Owner 2026-11-06: only the owned daily preparation can offer a
          # replacement. Hourly, degraded and historical owner-window routes
          # cannot override this rule. Backup qualification remains all day.
          allowed=false
          [ "$daily_preparation" = true ] && allowed=true
          if [ "$EVENT_NAME" = workflow_dispatch ] && [ "$REQUEST_ENGINE_RELEASE" = true ]; then
            [ "$GITHUB_RUN_ATTEMPT" = 1 ]
            python3 -B - "$GITHUB_SHA" "$OWNER_WINDOW_ID" "$REPO" "$RUN_ID" <<'PYTHON'
          import importlib.util, sys
          spec = importlib.util.spec_from_file_location('reader', 'scripts/ci/read-engine-prequalification.py')
          reader = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(reader)
          reader.owner_selection_policy(sys.argv[1], sys.argv[1], sys.argv[2], reader.selection_cutoff(sys.argv[3], sys.argv[4]))
          PYTHON
            allowed=true
            owner_window_id="$OWNER_WINDOW_ID"
          fi
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"
          echo "owner_window_id=$owner_window_id" >> "$GITHUB_OUTPUT"
          echo "daily_preparation=$daily_preparation" >> "$GITHUB_OUTPUT"
          echo "daily_preparation_date=$daily_date" >> "$GITHUB_OUTPUT"
          echo "cutoff_epoch=$cutoff_epoch" >> "$GITHUB_OUTPUT"
          if [ "$allowed" = false ]; then
            echo 'Routine engine updates are queued for 04:00 America/Chicago.'
          fi

      - name: Wait once for the reserved cutoff and bind protected source
        id: cutoff
        if: steps.admission.outputs.allowed == 'true'
        env:
          CUTOFF_EPOCH: ${{ steps.admission.outputs.cutoff_epoch }}
          OWNER_WINDOW_ID: ${{ steps.admission.outputs.owner_window_id }}
        run: |
          set -euo pipefail
          # Admission already validated the exact finite owner dispatch. It
          # retains its original protected source and never waits on a daily cutoff.
          if [ -n "${OWNER_WINDOW_ID:-}" ]; then
            [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          now=$(date +%s)
          [[ "$CUTOFF_EPOCH" =~ ^[1-9][0-9]*$ ]]
          remaining=$((CUTOFF_EPOCH - now))
          [ "$remaining" -le 18000 ] || { echo '::error::Reservation exceeds five hours.'; exit 1; }
          [ "$remaining" -le 0 ] || sleep "$remaining"
          now=$(date +%s)
          [ "$now" -ge "$CUTOFF_EPOCH" ] && [ "$now" -lt "$((CUTOFF_EPOCH + 1200))" ] || { echo '::error::Reserved preparation window missed.'; exit 1; }
          git fetch --no-tags origin main
          control=$(git rev-list --first-parent -1 --before="@$CUTOFF_EPOCH" refs/remotes/origin/main)
          [[ "$control" =~ ^[0-9a-f]{40}$ ]]
          # Never execute new release authority under an old reservation owner.
          CONTROL="$control" python3 - <<'PYTHON'
          import importlib.util, os
          spec = importlib.util.spec_from_file_location("qualification", "scripts/ci/read-engine-prequalification.py")
          module = importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          if module.projection(os.environ["GITHUB_SHA"], release_authority=True) != module.projection(os.environ["CONTROL"], release_authority=True):
              raise SystemExit("Release controls changed during reservation; keep serving.")
          PYTHON
          echo "sha=$control" >> "$GITHUB_OUTPUT"

      - name: Compare the complete server tree
        id: change
        if: steps.admission.outputs.allowed == 'true'
        env:
          AFTER_SHA: ${{ steps.cutoff.outputs.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          ENGINE_HEALTH_URL: https://engine.smarter.poker/health
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [[ "$AFTER_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Protected-main push did not provide one full lowercase commit SHA."; exit 1; }

          LATEST_REQUIRED=$(git log "$AFTER_SHA" -1 --format=%H -- \
            'server/**' ':(exclude)server/**/*.test.ts' ':(exclude)server/sim/**' ':(exclude)server/qualification/**')
          [[ "$LATEST_REQUIRED" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Could not resolve one engine-runtime commit from protected main."; exit 1; }

          # A TEST-ONLY FIX MOVES THE OFFERED TREE FORWARD (2026-10-09).
          #
          # LATEST_REQUIRED decides WHETHER a release is owed: only runtime code
          # owes one. But the receiver compiles and tests the tree of the SHA it
          # is offered, tests included. From 19:38 UTC on 2026-10-08 every
          # receiver failed on one stale test at c79f08d347 (the newest runtime
          # commit), and its fix 3353d64d5f was test-only, so every later push
          # offered c79f08d347 again with the same broken test: the release lane
          # could never ship, and the tournament self-heal in 27d2776a58 sat
          # merged and undeployed for ten hours. So the SHA offered is the
          # newest commit on main that touched anything under server/, which
          # always contains LATEST_REQUIRED and the newest server test fixes.
          TARGET_SHA=$(git log "$AFTER_SHA" -1 --format=%H -- 'server/**')
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Could not resolve one server-tree commit from protected main."; exit 1; }
          git merge-base --is-ancestor "$LATEST_REQUIRED" "$TARGET_SHA" \
            || { echo "::error::The offered server tree $TARGET_SHA does not contain engine $LATEST_REQUIRED."; exit 1; }

          RELEASE_REQUIRED=true
          if [[ "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]] && \
             [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] && \
             git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git diff --quiet "$BEFORE_SHA" "$AFTER_SHA" -- \
              'server/**' ':(exclude)server/**/*.test.ts' ':(exclude)server/sim/**' ':(exclude)server/qualification/**'; then
              RELEASE_REQUIRED=false
            fi
          else
            echo "::notice::Previous commit is missing or unreadable; failing closed by staging the exact SHA."
          fi

          # A RELEASE IS OWED UNTIL PRODUCTION HOLDS IT (2026-09-27).
          #
          # "Did this push touch engine code" is the question of the moment a
          # commit merges. The question the release lane actually owes is "does
          # production hold the newest engine code on main". From 15:09 UTC on
          # 2026-09-26 to 15:03 UTC on 2026-09-27 those two answers disagreed:
          # the only request (9e275e1c1a, run 36250934873) waited through two
          # shut certificates and ended at 17:22, and the next 42 pushes were
          # database, client and test changes, so each run here printed
          # "Engine runtime release required: false" and production fell 61
          # commits behind while nothing offered it anything.
          #
          # So when this push did not change the engine tree, ask the live
          # engine which release it runs. If that release does not contain the
          # newest engine commit on main, that commit is still owed and is
          # offered again - through the same single receiver, with every gate it
          # always had. The signal job below refuses to offer while a receiver
          # for the same SHA is still running, and offers the same SHA at most
          # once per OFFER_INTERVAL_SECONDS, so this is one offer per
          # maintenance window, not a retry loop. It is driven by protected-main
          # pushes, never by a timer (CLAUDE.md 10.85, no-workflow-gains-a-new-
          # timer). "Could not tell" is its own outcome (CLAUDE.md 10.86): an
          # unreadable /health, or a served SHA outside protected main, offers
          # nothing on that basis and says so.
          OFFER_REASON=changed
          SCHEDULED_CYCLE=false
          if [ "$EVENT_NAME" = schedule ] || [ "$EVENT_NAME" = workflow_run ] || [ "$EVENT_NAME" = repository_dispatch ]; then
            # A preparation event has no push-before SHA. Always prove the actual
            # protected live identity before offering a same-image reset.
            RELEASE_REQUIRED=false
            if python3 server/scripts/engine-release-seal.py schedule-policy --repo . --sha "$AFTER_SHA" | python3 -c 'import json,sys; raise SystemExit(0 if json.load(sys.stdin)["phase1Status"]=="active" else 1)'; then
              SCHEDULED_CYCLE=true
            fi
          fi
          if [ "$RELEASE_REQUIRED" = false ]; then
            LIVE_SHA=''
            if [ -n "${ENGINE_HEALTH_URL:-}" ]; then
              LIVE_SHA=$(curl -fsSL --max-time 15 \
                -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                "$ENGINE_HEALTH_URL" 2>/dev/null \
                | python3 -c 'import json, sys
          try:
              value = json.load(sys.stdin).get("releaseSha")
          except Exception:
              value = None
          print(value if isinstance(value, str) else "")' 2>/dev/null) || LIVE_SHA=''
            fi
            if ! [[ "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              OFFER_REASON=unknown
              echo "::warning title=LIVE ENGINE RELEASE UNKNOWN::The live engine did not report one full releaseSha, so whether production holds $LATEST_REQUIRED could not be told."
            elif ! git cat-file -e "${LIVE_SHA}^{commit}" 2>/dev/null \
              || ! git merge-base --is-ancestor "$LIVE_SHA" "$AFTER_SHA"; then
              OFFER_REASON=unknown
              echo "::warning title=LIVE ENGINE RELEASE UNKNOWN::The live engine reports $LIVE_SHA, which is not in protected-main history at $AFTER_SHA."
            elif git merge-base --is-ancestor "$LATEST_REQUIRED" "$LIVE_SHA"; then
              if [ "$SCHEDULED_CYCLE" = true ]; then
                RELEASE_REQUIRED=true
                OFFER_REASON=scheduled-cycle
                # Include the current protected policy and any newer server
                # tests; never offer an older component behind a serving SHA.
                TARGET_SHA="$AFTER_SHA"
              else
                OFFER_REASON=current
              fi
            else
              OFFER_REASON=behind
              RELEASE_REQUIRED=true
              echo "::notice title=ENGINE RELEASE STILL OWED::Production runs $LIVE_SHA, which does not contain protected-main engine $LATEST_REQUIRED; offering it again."
            fi
            echo "Live engine release: ${LIVE_SHA:-<unreadable>}"
          fi

          echo "release_required=$RELEASE_REQUIRED" >> "$GITHUB_OUTPUT"
          echo "target_sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
          echo "observed_live_sha=${LIVE_SHA:-}" >> "$GITHUB_OUTPUT"
          echo "offer_reason=$OFFER_REASON" >> "$GITHUB_OUTPUT"
          echo "Engine runtime release required: $RELEASE_REQUIRED ($OFFER_REASON)"
          echo "Exact engine component SHA: $LATEST_REQUIRED"
          echo "Offered server tree SHA: $TARGET_SHA"

      # A WINDOW MIGRATION DOES NOT WAIT ON THE ENGINE'S RELEASE CONTROLS
      # (2026-11-12). The cutoff step above refuses to bind source when the
      # release controls changed during the five-hour reservation, and that
      # failure (correctly) stops every engine job. On 2026-11-10 (run
      # 42756607383) and 2026-11-11 (run 42959839523) it also skipped the
      # database-only window-migrations job, so five merged window files
      # missed two daily breaks. This step changes nothing above it and no
      # engine job reads its output: it only names the protected-main commit
      # at the reserved cutoff for the window installer, and only once the
      # cutoff was actually reached inside the preparation window. Its own
      # failure never changes this job's result (continue-on-error).
      - name: Name the window-migration source at the reserved cutoff
        id: window_source
        if: >-
          always() && steps.admission.outputs.allowed == 'true' &&
          steps.admission.outputs.daily_preparation == 'true' &&
          (steps.cutoff.outcome == 'success' || steps.cutoff.outcome == 'failure')
        continue-on-error: true
        env:
          CUTOFF_EPOCH: ${{ steps.admission.outputs.cutoff_epoch }}
          BOUND_SHA: ${{ steps.cutoff.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "${BOUND_SHA:-}" ]; then
            [[ "$BOUND_SHA" =~ ^[0-9a-f]{40}$ ]]
            echo "sha=$BOUND_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$CUTOFF_EPOCH" =~ ^[1-9][0-9]*$ ]]
          now=$(date +%s)
          if [ "$now" -lt "$CUTOFF_EPOCH" ] || [ "$now" -ge "$((CUTOFF_EPOCH + 1200))" ]; then
            echo 'The reserved cutoff was not reached inside the preparation window; no window-migration source.'
            exit 0
          fi
          git fetch --no-tags origin main
          control=$(git rev-list --first-parent -1 --before="@$CUTOFF_EPOCH" refs/remotes/origin/main)
          [[ "$control" =~ ^[0-9a-f]{40}$ ]]
          echo "::warning title=ENGINE KEEPS SERVING, WINDOW MIGRATIONS STILL INSTALL::The engine release did not bind source at the cutoff; queued window migrations install from protected main $control."
          echo "sha=$control" >> "$GITHUB_OUTPUT"

  # A MIGRATION THAT NEEDS THE LIVE TABLES WAITS FOR THE DAILY BREAK
  # (2026-10-22). Migrations that need ACCESS EXCLUSIVE on clubs, tables or
  # hand_history cannot install during play (20261022030326). Such a file
  # declares the window, the ordinary applier refuses it as queued, and this
  # job installs every queued one inside the 04:00 freeze: one transaction
  # per file, one attempt, 1 s lock_timeout, 8 s budget, the documented
  # break-window override recorded, and the first refusal stops the run with
  # the rest still queued. Nothing queued: it exits at once. Its reader is the
  # job summary and the red-main detector (CLAUDE.md 10.83).
  window-migrations:
    name: Install Queued Daily-Maintenance Migrations
    needs: detect
    if: >-
      ((always() &&
      ((github.event_name == 'workflow_dispatch' && !inputs.request_engine_release && github.ref == 'refs/heads/main') ||
       (needs.detect.outputs.admission_allowed == 'true' &&
        needs.detect.outputs.daily_preparation == 'true' &&
        needs.detect.outputs.window_sha != '')))
      && !((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]'))) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 75
    concurrency:
      group: daily-maintenance-window-migrations
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.window_sha || github.sha }}
          fetch-depth: 0

      - name: Use the production Node major
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the Postgres client library
        run: npm i pg@8 --no-save --no-audit --no-fund

      # An explicit dispatch only consumes a reviewed migration window. The
      # detector is skipped, so it cannot signal an engine or request a break.
      # The existing installer validates the manifest/ancestry and requires
      # the database-owned freeze with all admission and commit reserves.
      - name: Install every queued window migration inside the certified break
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_WINDOW_ID: ${{ inputs.owner_window_id || needs.detect.outputs.owner_window_id }}
          REQUEST_DATABASE_BREAK: ${{ inputs.request_database_break }}
          HETZNER_HOST: ${{ inputs.request_database_break && secrets.HETZNER_HOST || '' }}
          HETZNER_SSH_PRIVATE_KEY: ${{ inputs.request_database_break && secrets.HETZNER_SSH_PRIVATE_KEY || '' }}
          HETZNER_HOST_KEY: ${{ inputs.request_database_break && secrets.HETZNER_HOST_KEY || '' }}
        run: |
          if [ "$REQUEST_DATABASE_BREAK" = true ]; then
            python3 -B scripts/ci/database-maintenance-window.py
            exit $?
          fi
          owner_args=()
          if [ -n "$OWNER_WINDOW_ID" ]; then owner_args=(--owner-window "$OWNER_WINDOW_ID"); fi
          node scripts/ci/install-window-migrations.mjs "${owner_args[@]}" \
            --ssl-root-cert scripts/ci/certificates/supabase-prod-ca-2021.crt

      - name: Retain the database-only terminal receipt
        if: always() && github.event_name == 'workflow_dispatch' && inputs.request_database_break
        uses: actions/upload-artifact@v4
        with:
          name: database-maintenance-${{ github.run_id }}
          path: artifacts/database-maintenance/receipt.json
          if-no-files-found: error
          retention-days: 7

  selection:
    name: Record the daily release evidence
    needs: detect
    if: (needs.detect.outputs.admission_allowed == 'true' && (needs.detect.outputs.release_required == 'true' || needs.detect.outputs.daily_preparation == 'true')) && !((github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') && (github.actor == 'github-actions[bot]' || github.triggering_actor == 'github-actions[bot]')) && !(github.run_attempt != '1' && github.triggering_actor == 'github-actions[bot]')
    runs-on: ubuntu-latest
    environment: ci-main
    timeout-minutes: 4
    permissions:
      actions: read
      contents: read
      statuses: read
    outputs:
      sha: ${{ steps.freeze.outputs.sha }}
      send: ${{ steps.freeze.outputs.send }}
      control: ${{ steps.freeze.outputs.control }}
    steps:
      - uses: actions/checkout@v4
        if: needs.detect.outputs.daily_preparation == 'true' || needs.detect.outputs.owner_window_id != ''
        with:
          ref: ${{ needs.detect.outputs.protected_sha }}
          fetch-depth: 0
          sparse-checkout: |
            scripts/ci
            server/scripts
            server/standby
      - name: Freeze the exact daily candidate and report inclusion
        id: freeze
        if: needs.detect.outputs.daily_preparation == 'true' || needs.detect.outputs.owner_window_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          # Read-only: production's installed migrations, compared with what
          # the certified Backup copy holds (select-daily-engine.py).
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RELEASE_DATE: ${{ needs.detect.outputs.daily_preparation_date }}
          RELEASE_REQUIRED: ${{ needs.detect.outputs.release_required }}
          OFFER_REASON: ${{ needs.detect.outputs.offer_reason }}
          OBSERVED_LIVE_SHA: ${{ needs.detect.outputs.observed_live_sha }}
          CUTOFF_CONTROL: ${{ needs.detect.outputs.protected_sha }}
          OWNER_WINDOW_ID: ${{ needs.detect.outputs.owner_window_id }}
        run: |
          set -euo pipefail
          [ "$GITHUB_RUN_ATTEMPT" = 1 ] || { echo "::error::Daily selection already attempted; retain the original decision."; exit 1; }
          serving=$(curl -fsS --max-time 15 -H 'Cache-Control: no-cache' https://engine.smarter.poker/health | jq -er .releaseSha) || serving=unknown
          if [ "$RELEASE_REQUIRED" = false ]; then
            outcome=blocked
            if [ "$OFFER_REASON" = current ] && [[ "$serving" =~ ^[0-9a-f]{40}$ ]] && [ "$serving" = "$OBSERVED_LIVE_SHA" ]; then
              outcome=keep-serving
            fi
            jq -n --arg outcome "$outcome" --arg reason "$OFFER_REASON" --arg sha "$serving" --arg stage "$GITHUB_SHA" \
              '{schema:1,outcome:$outcome,reason:$reason,servingSha:$sha,stageSha:$stage,controlSha:null,targetSha:null,deferredCandidates:[]}' > daily-selection.json
            echo "send=false" >> "$GITHUB_OUTPUT"
            [ "$outcome" = keep-serving ]
            exit
          fi
          selection_args=(--date "$RELEASE_DATE")
          if [ -n "$OWNER_WINDOW_ID" ]; then
            selection_args=(--owner-window "$OWNER_WINDOW_ID" --selection-run-id "$GITHUB_RUN_ID")
          fi
          python3 -B scripts/ci/select-daily-engine.py --repo "$GITHUB_REPOSITORY" --control "$CUTOFF_CONTROL" --stage "$GITHUB_SHA" \
            --serving "$serving" "${selection_args[@]}" --output daily-selection.json
          jq -r '"sha=" + (.targetSha // ""), "control=" + (.controlSha // ""), "send=" + ((.outcome == "selected") | tostring)' daily-selection.json >> "$GITHUB_OUTPUT"
      - name: Preserve the daily selection before offering the release
        if: always() && steps.freeze.outcome != 'skipped' && hashFiles('daily-selection.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.detect.outputs.owner_window_id != '' && format('owner-engine-selection-{0}', needs.detect.outputs.owner_window_id) || format('daily-engine-selection-{0}', needs.detect.outputs.daily_preparation_date) }}
          path: daily-selection.json
          if-no-files-found: error

  signal:
    name: Dispatch The Exact Main SHA
    needs: [detect, selection]
    if: needs.detect.outputs.release_required == 'true' && needs.detect.outputs.admission_allowed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      actions: read
      contents: write
    steps:
      - name: Decide whether an owed release still needs an offer
        id: offer
        if: needs.selection.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_PREPARATION: ${{ needs.detect.outputs.daily_preparation }}
          OFFER_REASON: ${{ needs.detect.outputs.offer_reason }}
          REF_SHA: ${{ needs.selection.outputs.sha }}
          REPO: ${{ github.repository }}
          OFFER_INTERVAL_SECONDS: '3000'
        run: |
          set -euo pipefail
          [[ "$REF_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Protected-main push did not provide one full lowercase commit SHA."; exit 1; }
          # Every daily offer must respect an existing owner for the selected SHA.
          # Other callers keep the prior event-driven offer semantics.
          if [ "${DAILY_PREPARATION:-false}" != true ] && [ "$OFFER_REASON" != behind ] && [ "$OFFER_REASON" != scheduled-cycle ]; then
            echo "send=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$OFFER_INTERVAL_SECONDS" =~ ^[1-9][0-9]*$ ]]
          # An unreadable run list fails this step: an offer that cannot see
          # the lane it would join must not guess that the lane is empty.
          RUNS=$(gh api \
            "repos/$REPO/actions/workflows/auto-deploy-hetzner.yml/runs?event=repository_dispatch&per_page=100")
          MINE=$(printf '%s' "$RUNS" | jq -c --arg title "Engine Release $REF_SHA" \
            '[.workflow_runs[] | select(.display_title == $title) | {id, status, created_at}]')
          ACTIVE=$(printf '%s' "$MINE" | jq -r '[.[] | select(.status != "completed")][0].id // empty')
          if [ -n "$ACTIVE" ]; then
            echo "::notice::Engine $REF_SHA is still owed, and receiver run $ACTIVE is already offering it."
            echo "send=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE=$(printf '%s' "$MINE" | jq -r \
            '[.[].created_at | fromdateiso8601] | if length == 0 then "" else (now - max | floor | tostring) end')
          if [ -n "$AGE" ]; then
            [[ "$AGE" =~ ^-?[0-9]+$ ]]
            if [ "$AGE" -lt "$OFFER_INTERVAL_SECONDS" ]; then
              echo "::notice::Engine $REF_SHA is still owed; it was last offered ${AGE}s ago, inside the ${OFFER_INTERVAL_SECONDS}s window."
              echo "send=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "Engine $REF_SHA is still owed and no receiver is offering it; offering it again."
          echo "send=true" >> "$GITHUB_OUTPUT"

      - name: Send the immutable engine release request
        if: steps.offer.outputs.send == 'true' && needs.selection.outputs.send == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REF_SHA: ${{ needs.selection.outputs.sha }}
          CONTROL_SHA: ${{ needs.selection.outputs.control }}
          OWNER_WINDOW_ID: ${{ needs.detect.outputs.owner_window_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REF_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::Protected-main push did not provide one full lowercase commit SHA."; exit 1; }
          SENT_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # A 204 proves only that GitHub accepted the HTTP request. Perform at
          # most one same-SHA redelivery when no correlated receiver exists;
          # the receiver's durable exact-release dedupe makes that retry inert
          # if GitHub merely delayed the first run. This is bounded delivery,
          # not a polling watcher or a second deployment authority.
          RECEIVER_ID=''
          for delivery in 1 2; do
            gh api --method POST "repos/$REPO/dispatches" \
              -f event_type=deploy-club-arena-engine \
              -F "client_payload[ref_sha]=$REF_SHA" \
              -F "client_payload[control_sha]=$CONTROL_SHA" \
              -F "client_payload[selection_run_id]=$GITHUB_RUN_ID" \
              -F "client_payload[owner_window_id]=$OWNER_WINDOW_ID"
            echo "Dispatch delivery $delivery accepted for Club Arena engine release $REF_SHA"
            for _ in $(seq 1 12); do
              RECEIVER_ID=$(gh api \
                "repos/$REPO/actions/workflows/auto-deploy-hetzner.yml/runs?event=repository_dispatch&per_page=30" \
                --jq "[.workflow_runs[] | select(.display_title == \"Engine Release $REF_SHA\" and .created_at >= \"$SENT_AT\")][0].id // empty")
              [ -n "$RECEIVER_ID" ] && break 2
              sleep 5
            done
            if [ "$delivery" = 1 ]; then
              echo '::warning::No correlated receiver appeared after the first delivery; issuing the one permitted exact-SHA retry.'
            fi
          done
          [[ "$RECEIVER_ID" =~ ^[0-9]+$ ]] \
            || { echo "::error::GitHub accepted two bounded deliveries but no exact correlated engine-release run appeared."; exit 1; }
          echo "Receiver run $RECEIVER_ID accepted exact engine component $REF_SHA."
