name: Lightning hand counts every player dealt in

# fn_lightning_settle_hand (migration 20261015222121). Runs
# scripts/ci/test-lightning-hand-counts-every-player-dealt-in.py against a
# throwaway PostgreSQL 17 cluster, never production: production's exact text,
# rebuilt from the Phase 6 definition and its later substitutions (md5 equal to
# the live function on 2026-10-15), must book a four-handed hand with two
# fast folders who never posted as num_players 2, and the migration must book
# it as 4 with the contribution map unchanged and reproduce production's
# derived postimage md5. The same command ci.yml would run, kept in its own
# file so the change does not edit ci.yml. No timer (CLAUDE.md 10.85):
# pull_request only, scoped to the paths it proves. ci.yml has no push
# trigger, so neither does this.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261015222121_a_lightning_hand_counts_every_player_dealt_in.sql
      - supabase/migrations/20261001154813_lightning_phase_6_settlement_the_hand_settles_onto_its_ancho.sql
      - supabase/migrations/20261001201216_lightning_phase_6_remediation_a_frozen_cluster_settles_nothi.sql
      - supabase/migrations/20261007212735_lightning_phase_8_multi_table_limits_session_statistics_pool.sql
      - supabase/migrations/20261018230728_lightning_settlement_names_zero_contribution_dealt_players.sql
      - supabase/migrations/20261025000729_lightning_hands_reach_the_stats_facts_and_the_collusion_scan.sql
      - supabase/migrations/20260821_ca_hand_facts.sql
      - supabase/migrations/20261003134650_stats_facts_outbox_and_corrections.sql
      - supabase/migrations/20261003140344_stats_cash_opportunity_facts.sql
      - server/src/lightning/LightningHandFacts.ts
      - server/src/services/supabase/handFacts.ts
      - supabase/migrations/*_lightning_top_up_original_intents_finish_at_the_final_hand_*.sql
      - scripts/ci/test-lightning-topup-postgres.py
      - supabase/migrations/*_lightning_terminal_trigger_keeps_its_private_top_up_authorit.sql
      - scripts/ci/fixtures/lightning-terminal-authority-preimage.json
      - supabase/migrations/*_lightning_retains_the_anchor_until_every_original_hand_is_te.sql
      - scripts/ci/test-lightning-unsettled-anchor-exit.py
      - scripts/ci/fixtures/lightning-unsettled-anchor-preimages.json
      - supabase/migrations/*_lightning_plo4_pool_recovers_after_the_unsettled_anchor_exit*.sql
      - scripts/ci/test-lightning-void-recovery.py
      - scripts/ci/fixtures/lightning-void-recovery-unfreeze.sql
      - scripts/ci/fixtures/lightning-topup-*.json
      - server/src/GameServer.ts
      - server/src/lightning/LightningHandHost.ts
      - server/src/lightning/LightningAutoRebuy.ts
      - src/components/table/CashierModal.tsx
      - src/components/table/TableModalsLayer.tsx
      - tests/a-top-up-is-charged-once.law.test.ts
      - server/src/lightning/LightningHorseTopUp.test.ts
      - server/src/lightning/LightningOperatorEvents.test.ts
      - src/hooks/useEngineTableState.ts
      - tests/lightning/lightning-topup-*.test.tsx
      - tests/lightning/lightning-auto-topup.test.tsx
      - server/src/lightning/LightningTopUp.test.ts
      - server/src/lightning/LightningTopUp.ts
      - server/src/lightning/LightningHorseTopUp.ts
      - server/src/lightning/LightningOperatorEvents.ts
      - server/src/engine/ServerTableEngineSeating.ts
      - src/lightning/useLightningTopUpReceipts.ts
      - src/lightning/useLightningAutoTopUp.ts
      - src/services/GameServerAPI.ts
      - src/services/SessionStatsService.ts
      - src/pages/TablePage.tsx
      - supabase/migrations/20261109224717_a_lightning_blind_off_always_completes.sql
      - supabase/migrations/20261106203853_hit_and_run_ten_hands_in_profit.sql
      - supabase/migrations/20261107040516_clubs_choose_their_hand_count_before_leaving.sql
      - scripts/qualify-lightning-blind-off.mjs
      - supabase/migrations/20261113225904_a_lightning_leave_that_owes_hands_returns_the_seat_to_the_po.sql
      - scripts/qualify-lightning-owed-leave.mjs
      - scripts/qualification/lightning-owed-leave/**
      - scripts/qualification/lightning-blind-off/**
      - scripts/qualification/stable-admin-floor/fixture.mjs
      - tests/a-lightning-blind-off-always-completes.law.test.ts
      - scripts/ci/test-lightning-stats-facts.py
      - scripts/ci/test-lightning-hand-counts-every-player-dealt-in.py
      - .github/workflows/lightning-hand-counts-every-player-dealt-in.yml

permissions:
  contents: read

concurrency:
  group: lightning-hand-counts-every-player-dealt-in-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lightning-hand-counts-every-player-dealt-in:
    name: Lightning hand counts every player dealt in, not every payer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # BUG-7C1347FF (migration 20261109224717): the installed production
      # images (hash-checked) must strand an owed blind off before the
      # migration and complete it after. Node 22 for import.meta.dirname.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: A Lightning blind off always completes
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: node scripts/qualify-lightning-blind-off.mjs
      # #10740 (migration 20261113225904): a leave queued behind a live hand
      # that then owes hands must strand before the migration and be dealt
      # out as a blind off, then cashed out, after it.
      - name: A queued Lightning leave that owes hands returns to the pool
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: node scripts/qualify-lightning-owed-leave.mjs
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: Lightning hand counts every player dealt in, not every payer
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-lightning-hand-counts-every-player-dealt-in.py --output artifacts/lightning-hand-counts-every-player-dealt-in
      - name: Lightning accepted facts reach the real stats projector
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-lightning-stats-facts.py --output artifacts/lightning-stats-facts
      - name: Lightning original intents fund at their final hand boundary
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-lightning-topup-postgres.py --output artifacts/lightning-topup
      - name: Lightning departure retains every unsettled original anchor
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-lightning-unsettled-anchor-exit.py --output artifacts/lightning-unsettled-anchor
      - name: Retain the unsettled anchor regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-unsettled-anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lightning-unsettled-anchor/RESULTS.json
          retention-days: 7
          if-no-files-found: error
      - name: Lightning void recovery uses the original money-neutral door
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-lightning-void-recovery.py --output artifacts/lightning-void-recovery
      - name: Retain the guarded void recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-void-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lightning-void-recovery/RESULTS.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain the original top-up regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-topup-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lightning-topup/RESULTS.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain the stats regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-stats-facts-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lightning-stats-facts/RESULTS.json
          retention-days: 7
          if-no-files-found: error
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lightning-hand-counts-every-player-dealt-in-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/lightning-hand-counts-every-player-dealt-in/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
