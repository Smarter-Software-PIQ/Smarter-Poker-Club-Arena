name: V31 evaluation epochs bind the engine commit

# Native proofs of migrations 20261102151428 and 20261102180625 against a throwaway PostgreSQL 17
# cluster (never production): scripts/ci/test-v31-evaluation-epochs.py, with
# its mutation checks. No timer (CLAUDE.md 10.85): pull_request only, scoped to
# the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261102151428_v31_evaluation_epochs_bind_the_engine_commit.sql
      - scripts/ci/test-v31-evaluation-epochs.py
      - supabase/migrations/20261102180625_v31_serving_bindings_admit_only_verified_engines.sql
      - scripts/ci/test-v31-serving-bindings.py
      - scripts/ci/fixtures/v31-evaluation-epochs/**
      - .github/workflows/v31-evaluation-epochs.yml

permissions:
  contents: read

concurrency:
  group: v31-evaluation-epochs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v31-evaluation-epochs:
    name: V31 evaluation epochs keep provenance and bind promotion to the evaluated engine
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root).
      - name: Native proof and mutation checks
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: |
          python3 scripts/ci/test-v31-evaluation-epochs.py --mutations
          python3 scripts/ci/test-v31-serving-bindings.py --mutations
