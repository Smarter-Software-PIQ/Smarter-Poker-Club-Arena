name: Satellite entry prices
on:
  pull_request:
    branches: [main]
    paths:
      - server/src/services/ScheduledTournamentService.ts
      - supabase/migrations/**
      - scripts/ci/test-satellite-entry-prices.py
      - server/src/services/satelliteEntryValue*
      - .github/workflows/satellite-entry-prices.yml
permissions:
  contents: read
concurrency:
  group: satellite-entry-prices-${{ github.ref }}
  cancel-in-progress: true
jobs:
  value-tickets:
    name: Satellite prices fund target tickets and preserve purchased terms
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      - name: Qualify native value-ticket transactions
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
          TMPDIR: ${{ runner.temp }}
        run: python3 scripts/ci/test-satellite-entry-prices.py
