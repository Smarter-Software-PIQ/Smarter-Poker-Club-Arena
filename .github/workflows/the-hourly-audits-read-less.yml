name: The hourly audits read less and answer the same

# Migration 20261022062934. Runs
# scripts/ci/test-the-hourly-audits-stop-holding-the-hot-tables.py against a
# throwaway PostgreSQL 17 cluster, never production: the exact production
# definitions captured 2026-10-22 (pg_get_functiondef md5 equal to the live
# functions) answer every fixture, the migration is installed, and every answer
# must be identical, owners and grants unchanged, a second install refused.
# No timer (CLAUDE.md 10.85): pull_request only, scoped to the paths it proves.
on:
  pull_request:
    branches: [main]
    paths:
      - supabase/migrations/20261022062934_the_hourly_audits_read_only_what_changed_since_they_last_loo.sql
      - scripts/ci/fixtures/hourly-audits-hot-tables/**
      - scripts/ci/fixtures/bbj-audit-reads/cumulative-function-after.sql
      - scripts/ci/test-the-hourly-audits-stop-holding-the-hot-tables.py
      - .github/workflows/the-hourly-audits-read-less.yml

permissions:
  contents: read

concurrency:
  group: the-hourly-audits-read-less-${{ github.ref }}
  cancel-in-progress: true

jobs:
  the-hourly-audits-read-less:
    name: The hourly audits read less and answer the same
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL 17 from the signed PGDG source only
        uses: ./.github/actions/install-postgres-17
      # Runs as the runner user (non-root), exactly as the ci.yml step would.
      - name: The hourly audits read less and answer the same
        env:
          PG_BIN: /usr/lib/postgresql/17/bin
        run: python3 scripts/ci/test-the-hourly-audits-stop-holding-the-hot-tables.py --output artifacts/hourly-audits-hot-tables
      - name: Retain the regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-audits-hot-tables-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/hourly-audits-hot-tables/RESULTS.json
          retention-days: 7
          if-no-files-found: warn
