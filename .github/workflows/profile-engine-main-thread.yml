name: Profile Engine Main Thread (One Bounded Sample)
on:
  pull_request:
    paths:
      - 'scripts/ci/profile-engine-main-thread.mjs'
      - 'scripts/ci/native-fault-observation.py'
      - 'tests/operations/native-fault-observation.test.mjs'
      - 'tests/operations/engine-main-profile.test.mjs'
      - 'tests/fixtures/engine-native-fault/**'
      - '.github/workflows/profile-engine-main-thread.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Existing Inspector sample or one bounded native observation/receipt
        type: choice
        default: inspector
        options: [inspector, native_fault, native_receipt]
      native_operation:
        description: Existing numeric operation only for read-only native_receipt
        required: false
        type: string
      expected_engine_sha:
        description: Exact full currently serving engine image SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: engine-main-thread-profile-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'manual' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/operations/engine-main-profile.test.mjs tests/operations/native-fault-observation.test.mjs
        env:
          TMPDIR: ${{ runner.temp }}
  native-feasibility:
    name: Actual isolated Node PID1 native GPF feasibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install isolated Linux qualification prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y linux-perf gcc libc6-dev openssh-server
          PERF_PATH=$(dpkg-query --listfiles linux-perf | python3 -c 'import sys; p=[line.strip() for line in sys.stdin if line.strip()=="/usr/bin/perf"]; assert len(p)==1; print(p[0])')
          test -x "$PERF_PATH"
          printf 'QUALIFICATION_PERF=%s\n' "$PERF_PATH" >> "$GITHUB_ENV"
          mountpoint -q /sys/kernel/tracing || sudo mount -t tracefs tracefs /sys/kernel/tracing
          mkdir -p "$RUNNER_TEMP/native-perf-fixture"
      - name: Prove actual native fault attribution and finite isolated bounds
        run: |
          set -euo pipefail
          sudo env TMPDIR="$RUNNER_TEMP/native-perf-fixture" python3 tests/fixtures/engine-native-fault/qualify.py \
            --perf "$QUALIFICATION_PERF" --output artifacts/native-perf-feasibility/qualification.json
      - name: Prove actual host-owned native unit lifecycle and cleanup
        run: |
          set -euo pipefail
          sudo env TMPDIR="$RUNNER_TEMP/native-perf-fixture" python3 tests/fixtures/engine-native-fault/qualify_host_unit.py \
            --feasibility-receipt artifacts/native-perf-feasibility/qualification.json \
            --output artifacts/native-host-unit/qualification.json
      - name: Retain sanitized host-unit qualification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-native-host-unit-${{ github.run_id }}
          path: artifacts/native-host-unit/qualification.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain sanitized qualification only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-native-perf-feasibility-${{ github.run_id }}
          path: artifacts/native-perf-feasibility/qualification.json
          if-no-files-found: error
          retention-days: 7
  profile:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'inspector' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      EXPECTED_ENGINE_SHA: ${{ inputs.expected_engine_sha }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Collect thirty seconds through the configured pinned SSH boundary
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected SHA refused'; exit 1; }
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::Configured host refused'; exit 1; }
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ] || { echo '::error::Configured SSH metadata unavailable'; exit 1; }
          SSH_DIR="$RUNNER_TEMP/main-profile-ssh-$GITHUB_RUN_ID"
          install -d -m 0700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          ssh-keygen -y -f "$SSH_DIR/key" >/dev/null
          ssh-keygen -l -f "$SSH_DIR/known_hosts" >/dev/null
          timeout --signal=TERM --kill-after=5s 75s ssh \
            -i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
            "root@$HETZNER_HOST" \
            "test -f /var/lock/club-arena-engine-up.lock && exec 9>/var/lock/club-arena-engine-up.lock && flock -n 9 && test \"\$(docker inspect -f '{{index .Config.Labels \"org.opencontainers.image.revision\"}}' club-arena-engine)\" = '$EXPECTED_ENGINE_SHA' && docker exec -i club-arena-engine node --input-type=module - '$EXPECTED_ENGINE_SHA'" \
            < scripts/ci/profile-engine-main-thread.mjs > "$RUNNER_TEMP/main-thread-profile.json"
          cat "$RUNNER_TEMP/main-thread-profile.json"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-main-thread-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/main-thread-profile.json
          if-no-files-found: error
          retention-days: 7
  native-observation:
    needs: verify
    if: github.event_name == 'workflow_dispatch' && (inputs.mode == 'native_fault' || inputs.mode == 'native_receipt') && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_ENGINE_SHA: ${{ inputs.expected_engine_sha }}
      NATIVE_MODE: ${{ inputs.mode }}
      REQUESTED_OPERATION: ${{ inputs.native_operation }}
      HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One explicit native observation or read-only same-operation receipt
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          HOST_KEY: ${{ secrets.HETZNER_HOST_KEY }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 1024
          [[ "$EXPECTED_ENGINE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo '::error::Expected SHA refused'; exit 1; }
          [[ "$HETZNER_HOST" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::Configured host refused'; exit 1; }
          [ -n "$SSH_KEY" ] && [ -n "$HOST_KEY" ] || { echo '::error::Configured SSH metadata unavailable'; exit 1; }
          if [ "$NATIVE_MODE" = native_fault ]; then
            [ -z "$REQUESTED_OPERATION" ] || { echo '::error::New capture must use its own run identity'; exit 1; }
            OPERATION="$GITHUB_RUN_ID"
          else
            OPERATION="$REQUESTED_OPERATION"
          fi
          [[ "$OPERATION" =~ ^[1-9][0-9]{0,19}$ ]] || { echo '::error::Operation identity refused'; exit 1; }
          SSH_DIR="$RUNNER_TEMP/native-fault-ssh-$GITHUB_RUN_ID"
          install -d -m 0700 "$SSH_DIR"
          trap 'rm -rf "$SSH_DIR"' EXIT
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$HOST_KEY" > "$SSH_DIR/known_hosts"
          chmod 0600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          ssh-keygen -y -f "$SSH_DIR/key" >/dev/null
          ssh-keygen -l -f "$SSH_DIR/known_hosts" >/dev/null
          SSH_ARGS=(-i "$SSH_DIR/key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$SSH_DIR/known_hosts" -o GlobalKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2)
          if [ "$NATIVE_MODE" = native_fault ]; then
            SOURCE_SHA=$(sha256sum scripts/ci/native-fault-observation.py | cut -d ' ' -f 1)
            REMOTE_COMMAND=$(python3 - "$OPERATION" "$EXPECTED_ENGINE_SHA" "$SOURCE_SHA" <<'PY'
          import shlex,sys
          bootstrap=r'''
          import hashlib,os,re,stat,subprocess,sys
          from pathlib import Path
          try:
              op,sha,digest=sys.argv[1:]
              assert re.fullmatch(r'[1-9][0-9]{0,19}',op) and re.fullmatch(r'[0-9a-f]{40}',sha) and re.fullmatch(r'[0-9a-f]{64}',digest)
              raw=sys.stdin.buffer.read(131073)
              assert len(raw)<=131072 and hashlib.sha256(raw).hexdigest()==digest
              parent=Path('/')
              for component in ('var','lib','club-arena-native-fault','incoming'):
                  parent/=component
                  if not parent.exists():parent.mkdir(mode=0o700)
                  meta=parent.lstat()
                  assert stat.S_ISDIR(meta.st_mode) and meta.st_uid==0 and not meta.st_mode&0o022
              source=parent/(op+'.py')
              try:
                  fd=os.open(source,os.O_WRONLY|os.O_CREAT|os.O_EXCL|os.O_NOFOLLOW,0o600)
                  with os.fdopen(fd,'wb') as stream:stream.write(raw);stream.flush();os.fsync(stream.fileno())
              except FileExistsError:
                  fd=os.open(source,os.O_RDONLY|os.O_NOFOLLOW)
                  with os.fdopen(fd,'rb') as stream:
                      meta=os.fstat(stream.fileno());assert meta.st_uid==0 and stat.S_ISREG(meta.st_mode) and not meta.st_mode&0o077
                      assert stream.read(131073)==raw
              result=subprocess.run(['/usr/bin/python3',str(source),'admit','--operation',op,'--expected-engine-sha',sha],timeout=20)
              sys.exit(result.returncode)
          except Exception:
              print('{"verdict":"UNKNOWN","reason":"native_admission_unconfirmed_read_same_operation"}')
              sys.exit(1)
          '''
          print(shlex.join(['/usr/bin/python3','-c',bootstrap,*sys.argv[1:]]))
          PY
            )
            # Unknown acknowledgement is followed only by a read of this SAME
            # durable operation. It never triggers a second arm or another run.
            set +e
            timeout --signal=TERM --kill-after=5s 40s ssh "${SSH_ARGS[@]}" "root@$HETZNER_HOST" "$REMOTE_COMMAND" < scripts/ci/native-fault-observation.py > "$RUNNER_TEMP/native-admission.private"
            ADMISSION_STATUS=$?
            set -e
            printf 'Native admission transport exit: %s; reading original operation only.\n' "$ADMISSION_STATUS"
          else
            ADMISSION_STATUS=0
          fi
          python3 - "$OPERATION" "$ADMISSION_STATUS" "$NATIVE_MODE" "$RUNNER_TEMP" <<'PY'
          import importlib.util,json,pathlib,sys
          spec=importlib.util.spec_from_file_location('native_controller','scripts/ci/native-fault-observation.py')
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          op,status,mode,folder=sys.argv[1:];root=pathlib.Path(folder)
          if mode=='native_fault':
              source=root/'native-admission.private'
              raw=source.open('rb').read(16385) if source.is_file() else b''
              value=helper.admission_outcome(raw,op,int(status))
          else:
              value={'schema':'native-fault-admission/v1','operation':op,'outcome':'read_only_receipt_requested','transportExit':None}
          (root/'native-admission.json').write_text(json.dumps(value,separators=(',',':')))
          PY
          REMOTE_RECEIPT="/usr/bin/python3 /var/lib/club-arena-native-fault/$OPERATION/controller.py receipt --operation $OPERATION --wait"
          set +e
          timeout --signal=TERM --kill-after=5s 220s ssh "${SSH_ARGS[@]}" "root@$HETZNER_HOST" "$REMOTE_RECEIPT" > "$RUNNER_TEMP/native-fault-receipt.private"
          RECEIPT_STATUS=$?
          set -e
          python3 - "$OPERATION" "$EXPECTED_ENGINE_SHA" "$RECEIPT_STATUS" "$RUNNER_TEMP" <<'PY'
          import importlib.util,json,pathlib,sys
          spec=importlib.util.spec_from_file_location('native_controller','scripts/ci/native-fault-observation.py')
          helper=importlib.util.module_from_spec(spec);spec.loader.exec_module(helper)
          op,sha,status,folder=sys.argv[1:];root=pathlib.Path(folder);source=root/'native-fault-receipt.private'
          raw=source.open('rb').read(262145) if source.is_file() else b''
          value=helper.receipt_outcome(raw,op,sha,int(status))
          (root/'native-fault-receipt.json').write_text(json.dumps(value,separators=(',',':')))
          assert value.get('validReceipt') is True and value.get('cleanupConfirmed') is True, 'Native operation receipt/cleanup remains unproven; closed admission evidence retained'
          print(json.dumps(value,separators=(',',':')))
          PY
      - name: Retain closed native observation receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-fault-observation-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/native-admission.json
            ${{ runner.temp }}/native-fault-receipt.json
          if-no-files-found: error
          retention-days: 7
