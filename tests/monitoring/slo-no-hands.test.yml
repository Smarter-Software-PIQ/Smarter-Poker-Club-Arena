{
  "rule_files": [
    "../../infra/monitoring/slo-alerts.yml"
  ],
  "evaluation_interval": "1m",
  "tests": [
    {
      "name": "Low volume is dealing, even below the obsolete estate floor",
      "interval": "1m",
      "input_series": [
        {
          "series": "sp:hands_dealt:rate5m{job=\"engine_game_server\",instance=\"engine\",app=\"club-arena-engine\",host=\"engine-01\",role=\"engine\"}",
          "values": "0.5929824561403508+0x25"
        },
        {
          "series": "poker_dealable_tables{job=\"engine_game_server\",instance=\"engine\",app=\"club-arena-engine\",host=\"engine-01\",role=\"engine\"}",
          "values": "6+0x25"
        },
        {
          "series": "poker_maintenance_break_active{job=\"engine_game_server\",instance=\"engine\",app=\"club-arena-engine\",host=\"engine-01\",role=\"engine\"}",
          "values": "0+0x25"
        },
        {
          "series": "poker_operator_floor_park_share{job=\"engine_game_server\",instance=\"engine\",app=\"club-arena-engine\",host=\"engine-01\",role=\"engine\"}",
          "values": "0+0x25"
        },
        {
          "series": "poker_active_tables{job=\"engine_game_server\",instance=\"engine\",app=\"club-arena-engine\",host=\"engine-01\",role=\"engine\"}",
          "values": "144+0x25"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "count(ALERTS{alertname=\"SLOHandsAreNotBeingDealt\",alertstate=\"firing\"})",
          "eval_time": "20m",
          "exp_samples": []
        }
      ]
    },
