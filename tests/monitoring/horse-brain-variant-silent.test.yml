# ════════════════════════════════════════════════════════════════════
#  HORSE BRAIN RULES: SYNTHETIC TIME-SERIES FIXTURES (2026-11-17)
# ════════════════════════════════════════════════════════════════════
#
# Run by scripts/ci/test-slo-stall-duration.sh (pinned Prometheus image,
# unconditional CI step in ci.yml).
#
# HorseBrainVariantSilent paged whenever a variant's last horse table closed
# (alert 376529, and the overnight plo8/plo6/flo8/flh/plo4/nlh firings of
# 2026-11-16 and 2026-11-17): the rule could not tell a quiet variant from a
# failing one. The engine now emits poker_tables_with_horses_by_variant,
# seeded at 0 for every ledger variant, and the rule withholds a variant whose
# gauge read 0 for the last 10 minutes.
#
#   plo8  decisions stop while two horse tables stay live: FIRES (the fault
#         the rule exists for), and not before its `for: 15m` (pending from 89m, firing at 104m).
#   flo8  decisions stop because its last table closed: SILENT.
#   plo6  an engine that does not emit the gauge at all: FIRES exactly as the
#         rule did before this change (no silent loss of detection while an
#         older engine is serving).
#   nlh   the same quiet-variant shape inside the maintenance break: SILENT.

rule_files:
  - ../../infra/monitoring/alert-rules.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'poker_horse_policy_decisions_total{outcome="computed",variant="plo8"}'
        values: '0+10x75 750x60'
      - series: 'poker_tables_with_horses_by_variant{variant="plo8"}'
        values: '2x135'
      - series: 'poker_horse_policy_decisions_total{outcome="computed",variant="flo8"}'
        values: '0+10x75 750x60'
      - series: 'poker_tables_with_horses_by_variant{variant="flo8"}'
        values: '2x75 0x60'
      - series: 'poker_horse_policy_decisions_total{outcome="computed",variant="plo6"}'
        values: '0+10x75 750x60'
      - series: 'poker_maintenance_break_active'
        values: '0x135'
    alert_rule_test:
      - eval_time: 102m
        alertname: HorseBrainVariantSilent
        exp_alerts: []
      - eval_time: 106m
        alertname: HorseBrainVariantSilent
        exp_alerts:
          - exp_labels:
              severity: warning
              component: club-arena-engine
              variant: plo6
            exp_annotations:
              summary: 'Horse plo6 decisions stopped after an hour of play'
              description: |
                No live plo6 decision reached the policy ledger for
                15 minutes after the previous hour averaged more than 5 a minute. Its
                tables may have closed (check poker_dealable_tables and the lobby), or
                that variant's decisions are failing before the ledger.
              runbook: docs/runbooks/horse-brain-phase15.md
          - exp_labels:
              severity: warning
              component: club-arena-engine
              variant: plo8
            exp_annotations:
              summary: 'Horse plo8 decisions stopped after an hour of play'
              description: |
                No live plo8 decision reached the policy ledger for
                15 minutes after the previous hour averaged more than 5 a minute. Its
                tables may have closed (check poker_dealable_tables and the lobby), or
                that variant's decisions are failing before the ledger.
              runbook: docs/runbooks/horse-brain-phase15.md

  - interval: 1m
    input_series:
      - series: 'poker_horse_policy_decisions_total{outcome="computed",variant="nlh"}'
        values: '0+10x75 750x60'
      - series: 'poker_tables_with_horses_by_variant{variant="nlh"}'
        values: '2x135'
      - series: 'poker_maintenance_break_active'
        values: '0x80 1x55'
    alert_rule_test:
      - eval_time: 110m
        alertname: HorseBrainVariantSilent
        exp_alerts: []
