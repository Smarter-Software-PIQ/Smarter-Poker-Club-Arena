  "evaluation_interval": "5m",
  "tests": [
    {
      "name": "A floor that falls to a tenth of its week fires, with only four days retained",
      "interval": "1m",
      "input_series": [
        {
          "series": "poker_lightning_hands_total{outcome=\"settled\",job=\"engine_game_server\",instance=\"engine\"}",
          "values": "0+600x5760 3456060+60x179"
        },
        {
          "series": "poker_maintenance_break_active{job=\"engine_game_server\",instance=\"engine\"}",
          "values": "0+0x5940"
        }
      ],
      "promql_expr_test": [
        {
          "expr": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\"}",
          "eval_time": "5755m",
          "exp_samples": []
        },
        {
          "expr": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\"}",
          "eval_time": "5930m",
          "exp_samples": [
            {
              "labels": "ALERTS{alertname=\"HorseFleetThroughputRelativeDrop\",alertstate=\"firing\",component=\"club-arena-engine\",page=\"sms\",severity=\"critical\"}",
              "value": 1
            }
          ]
        }
      ]
    },
