# Alerts for the read-only recovery-stack verification.
#
# There is intentionally no periodic engine supervisor and no mutating
# heartbeat here. Docker restart policy owns process/daemon/host restart; the
# release transaction and ExecStopPost own exact desired restoration. The
# daily verifier publishes only the result of checking those deterministic
# contracts and the still-explicit autoheal dependency.
groups:
  - name: club-arena-recovery
    rules:
      - alert: RecoveryStackDegraded
        expr: club_arena_recovery_stack_failures > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} recovery-stack assertion(s) failing"
          description: >-
            The daily read-only verification found a deterministic recovery
            contract missing or misconfigured: Docker restart policy, the
            autoheal health owner, the sealed release identity, causal
            ExecStopPost restoration, or monitoring delivery. Run the active
            engine-control generation's verify-recovery-stack.sh for the
            per-assertion breakdown.

      - alert: RecoveryStackUnverified
        expr: >-
          absent(club_arena_recovery_stack_last_verified_timestamp_seconds)
          or time() - club_arena_recovery_stack_last_verified_timestamp_seconds > 172800
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Recovery stack has not been verified in over 48h"
          description: >-
            club-arena-verify.timer runs the read-only audit daily. Either it
            stopped or the textfile collector is no longer publishing. The
            recovery contract may be intact, but it is not currently verified.

      # ── THE RELEASE GATE THAT NEVER OPENS (2026-09-18) ──────────────────
      # The engine restarts only inside the :55 break, and only when
      # poker_maintenance_break_ready_for_restart reaches 1. On the night of
      # 2026-09-17 it stayed 0 through five consecutive breaks: the fleet ran
      # eight hours on a build from 16:56 while four merged fixes - including
      # the fix for the very bug holding the gate - sat in main unable to
      # install. Nothing alerted, because every individual break looks like a
      # break that simply had tables still finishing.
      #
      # ONE MISSED DAILY BREAK (2026-10-23). Owner update 2026-10-20: the
      # engine restarts once a day, in the 04:00 America/Chicago window
      # (09:00 UTC in CDT, 10:00 UTC in CST); the hourly :55 breaks no longer
      # open this gate. The old 3h window therefore paged every day at 12:11
      # UTC, three hours after a healthy 04:00 break, and stayed firing until
      # the next one (2026-10-21, -22, -23) - a page that is always on says
      # nothing. 26h covers one daily window plus the CST/CDT shift and a late
      # gate: if a whole scheduled break passes without the gate opening,
      # releases have stopped and somebody has to look. That is one missed
      # break, where the hourly rule waited for three.
      - alert: EngineReleaseGateNeverOpens
        expr: max_over_time(poker_maintenance_break_ready_for_restart[26h]) == 0
        for: 10m
        labels:
          severity: critical
          component: club-arena-engine
        annotations:
          summary: 'The restart gate did not open in the daily 04:00 Chicago break'
          description: >-
            poker_maintenance_break_ready_for_restart has been 0 for every
            scrape in 26 hours, so the daily break passed and no release can
            have installed. Read
            poker_maintenance_unparked_tables by reason: cards_in_air means
            hands are still finishing, and the rest mean a table's park
            checkpoint never became durable - accounting_pending and
            accounting_unconfirmed are the time-bank accounting settle,
            bank_park_write_incomplete is the presence row. The engine's log
            names the first five tables at each countdown.
          runbook: docs/runbooks/maintenance-break-fire-drill.md

      # The same signal from the other side: tables the gate refuses for a
      # reason that is not "cards are still in the air". A hand finishes in
      # seconds; a checkpoint that never becomes durable does not resolve on
      # its own, and one such table is enough to hold the whole platform's
      # release.
      - alert: RestartGateHeldByUndurableTables
        expr: >-
          sum(poker_maintenance_unparked_tables{reason!="cards_in_air"}) > 0
          and poker_maintenance_break_active == 1
        for: 4m
        labels:
          severity: warning
          component: club-arena-engine
        annotations:
          summary: '{{ $value }} table(s) hold the restart gate on a checkpoint, not on a hand'
          description: >-
            These tables are parked between hands, so nothing is being dealt
            at them, but their maintenance checkpoint never became durable and
            the gate cannot open. The reason label says which condition is
            false. Four minutes is past the point where a park write or a
            time-bank accounting write should have settled.
          runbook: docs/runbooks/maintenance-break-fire-drill.md

  # ── THE RELIABILITY CONTROLLER CANNOT REPORT ITS OWN SILENCE (2026-11-09) ──
  # The Reliability Controller is a set of Postgres objects ticked by pg_cron, and it
  # speaks through the same database's inbox and Messenger. If its tick stops,
  # its outbox jams or its intake refuses alerts, the controller is the one
  # thing that cannot say so. These four rules read gauges that
  # server/scripts/collect-monitoring-health.sh takes from
  # public.fn_reliability_controller_health() once a minute. Every one reaches
  # the codex-inbox route; the controller's intake opens no incident for these
  # names (seeded monitoring_self, not an incident, in migration
  # 20261110045731). The two critical ones also reach email-critical, which
  # does not pass through the controller (no tournament component, no page
  # label). Since 2026-11-11 warnings send no email (owner decision): the two
  # warnings below reach codex-inbox only.
  #
  # Every expression is aggregated to an empty label set so the two halves of
  # an `or` can never produce two alerts with the same labels.
  #
  # They are not suppressed in the maintenance break: the controller is in the
  # database and the collector runs outside the engine container, so an engine
  # restart changes neither.
  - name: reliability-controller
    rules:
      # Two causes look identical from the heartbeat alone, so the alert
      # names which one it has (label cause):
      #   controller_not_ticking  the collector refreshed its textfile in the
      #                           last three minutes and the database itself
      #                           says the heartbeat is over five minutes old.
      #   health_textfile_frozen  the textfile has not been refreshed for over
      #                           three minutes (collector timer dead, or its
      #                           fail-closed snapshot read failing) and the
      #                           last heartbeat it carries is over five
      #                           minutes old. Whether the controller is
      #                           ticking is unknown, not established.
      # poker_health_collected_timestamp_seconds is written into the same
      # atomic textfile on every successful collection and on no other, so its
      # age is the textfile's age. The two halves are exclusive on that age.
      # When the controller's series vanish (reliability_controller_collect_ok
      # 0, or the textfile gone) both halves are empty and
      # ReliabilityControllerMetricsAbsent is the one alert.
      - alert: ReliabilityControllerStale
        expr: >-
          label_replace(
            max(reliability_controller_heartbeat_age_seconds) > 300
            unless on() (time() - max(poker_health_collected_timestamp_seconds) > 180),
            "cause", "controller_not_ticking", "", ""
          )
          or
          label_replace(
            (time() - max(poker_health_collected_timestamp_seconds) > 180)
            and on() (time() - max(reliability_controller_heartbeat_timestamp_seconds) > 300),
            "cause", "health_textfile_frozen", "", ""
          )
        for: 5m
        labels:
          severity: critical
          component: reliability-controller
        annotations:
          summary: >-
            {{ if eq $labels.cause "health_textfile_frozen" }}Reliability Controller
            health has not been refreshed for {{ $value | humanizeDuration }}, so
            whether it is ticking is unknown{{ else }}The Reliability Controller
            has not ticked for {{ $value | humanizeDuration }}{{ end }}
          description: >-
            reliability_tick() writes reliability_heartbeat every minute from
            pg_cron job reliability-controller-tick, and
            collect-monitoring-health.sh publishes it once a minute. The label
            cause says which failure this is. controller_not_ticking: the
            collector is current and the database reports the heartbeat more
            than five minutes old, so incidents are not being escalated,
            confirmed, closed or delivered; read cron.job_run_details for the
            job and reliability_heartbeat.last_result. health_textfile_frozen:
            the collector's textfile has not been rewritten for over three
            minutes, so the last heartbeat it carries keeps ageing whether or
            not the controller is ticking; the collector timer is stopped, or
            its database read fails closed (database or REST API down). Read
            the journal of club-arena-money-health.service and its timer
            first.
          runbook: docs/reliability-controller/HEALTH-SIGNAL.md

      - alert: ReliabilityControllerMetricsAbsent
        expr: absent(reliability_controller_heartbeat_age_seconds)
        for: 15m
        labels:
          severity: critical
          component: reliability-controller
        annotations:
          summary: 'No Reliability Controller health has been published for 15 minutes'
          description: >-
            Missing telemetry is not health. The collector publishes no
            reliability_controller_heartbeat_age_seconds series when
            public.fn_reliability_controller_health() is missing or refuses,
            when the heartbeat has never ticked, when the answer is incomplete,
            or when the textfile or node_exporter on the engine host is gone.
            reliability_controller_collect_ok says whether the read itself
            failed; the collector's journal (club-arena-money-health.service)
            says why.
          runbook: docs/reliability-controller/HEALTH-SIGNAL.md

      - alert: ReliabilityControllerOutboxStuck
        expr: >-
          (
            max(min_over_time(reliability_controller_notifications_queued[30m])) > 0
            and max(reliability_controller_notifications_queued)
              >= max(reliability_controller_notifications_queued offset 30m)
          )
          or max(reliability_controller_notifications_failed_24h) > 0
        for: 5m
        labels:
          severity: critical
          component: reliability-controller
        annotations:
          summary: 'Reliability Controller notifications are not reaching the Messenger'
          description: >-
            Either notifications have sat queued for 30 minutes without the
            queue shrinking, or at least one notification created in the last
            24 hours ended failed after five attempts. Read
            reliability_controller_notifications_queued and
            reliability_controller_notifications_failed_24h to see which, then
            last_error on reliability_notifications. The owner may not be
            receiving escalations in the Messenger while this fires, which is
            why this is critical: email is then the only path left to the owner.
          runbook: docs/reliability-controller/HEALTH-SIGNAL.md

      - alert: ReliabilityControllerIntakeRejections
        expr: max(reliability_controller_intake_rejections_24h) > 0
        for: 5m
        labels:
          severity: warning
          component: reliability-controller
        annotations:
          summary: 'The Reliability Controller rejected {{ $value }} alert event(s) in the last 24 hours'
          description: >-
            An alert reached the operational inbox and the controller's intake
            could not turn it into an observation, so it belongs to no
            incident. reliability_intake_rejections holds the reason and
            sqlstate for each. The inbox row itself is intact. This clears 24
            hours after the last rejection.
          runbook: docs/reliability-controller/HEALTH-SIGNAL.md
